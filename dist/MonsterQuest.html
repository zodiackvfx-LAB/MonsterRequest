/* ---------- Farben und Masse an einer Stelle ----------
   Willst du die Optik aendern, aendere hier - nicht in den einzelnen Regeln. */
:root {
  /* Himmel und Natur. Diese Werte gelten für die Kulisse UND die Arena -
     deshalb stehen sie hier ganz oben und nicht in einer der beiden.
     Eine Region (siehe .region--sumpf in scenery.css) überschreibt sie. */
  --s-sky-top: #3ba7e8;
  --s-sky-bottom: #b6e8ff;
  --s-grass: #66c447;
  --s-grass-dark: #3f8f2c;
  --s-grass-light: #8fdd63;
  --s-rock: #7c8fb5;
  --s-rock-dark: #5a6c92;
  --s-tree: #3b8f3a;
  --s-tree-dark: #23611f;
  --snow: #f2f8ff;

  /* Oberflaeche der Bedienelemente */
  --panel: rgba(22, 30, 72, 0.88);
  --panel-solid: #1b2450;
  --panel-light: #2b3778;
  --panel-border: #4d5db8;

  /* Akzente */
  --gold: #ffc53d;
  --gold-1: #ffe27a;
  --gold-2: #ffb32b;
  --gold-3: #c9750d;
  --green-1: #7ee06a;
  --green-2: #3fa62a;
  --green-3: #24701a;
  --danger: #ff5f6d;
  --danger-dark: #b32330;

  /* Schrift */
  --text: #ffffff;
  --text-dim: #c3cdf0;
  --text-dark: #1b2450;
  --font: 'Fredoka', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* Formen */
  --radius: 18px;
  --radius-sm: 12px;
  --shadow-panel: 0 10px 24px rgba(8, 14, 40, 0.45);
  --outline: 3px solid rgba(12, 18, 48, 0.55);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
}

body {
  background: #0d1430;
  color: var(--text);
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Die Spielflaeche: auf grossen Bildschirmen begrenzt und mittig. */
/* Die Spielfläche füllt immer den ganzen Bildschirm - auf dem iPhone
   genauso wie auf dem iPad. */
.app {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  /* clip statt nur hidden: Die Kampfwiese ragt absichtlich weit über den
     Rand. Mit "hidden" durfte der Browser den Container trotzdem per
     Fokus oder Antippen verschieben - dann rutschte der ganze Bildschirm
     samt Ergebnisfenster aus dem Bild. "clip" verbietet jedes Scrollen. */
  overflow: clip;
  background: #0d1430;
}

/* Jeder Bildschirm fuellt die Spielflaeche komplett aus. */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  /* Bereich hinter Notch und Home-Leiste freihalten */
  padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
    calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}

/* Inhalte liegen über der Kulisse. Das Overlay ist ausgenommen: es
   positioniert sich selbst über den ganzen Bildschirm (position: absolute).
   Ohne die Ausnahme würde es als normales Element unten angehängt und
   unten abgeschnitten. */
.screen > *:not(.scenery):not(.overlay) {
  position: relative;
  z-index: 1;
}

/* Über die Einstellungen abschaltbar (siehe js/screens/settings.js). */
body.no-animations *,
body.no-animations *::before,
body.no-animations *::after {
  animation: none !important;
}

/* Wer weniger Bewegung eingestellt hat, bekommt keine Animationen. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ===== css/scenery.css ===== */
/* =========================================================================
   MonsterQuest · scenery.css
   Die Spielwelt-Kulissen: Himmel, Sonne, Wolken, Berge, Hügel, Boden.
   Alles reines CSS - spaeter kannst du einzelne Ebenen durch eigene
   Grafiken ersetzen, ohne den Rest anzufassen:
       .scenery__hills { background-image: url('../bilder/huegel.png'); }
   Aufbau (von hinten nach vorn): sky → sun → clouds → mountains → hills → ground
   ========================================================================= */

/* Die Farben (--s-...) stehen in css/base.css, damit Kulisse und Arena
   dieselben benutzen. Eine Region überschreibt sie weiter unten. */
.scenery {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.scenery__sky {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, var(--s-sky-top) 0%, var(--s-sky-bottom) 62%);
}

/* Weiche Lichtstrahlen von oben rechts - sehr dezent, nur ein Hauch.
   Sie liegen hinter der Sonne und geben dem Himmel Tiefe. */
.scenery__strahlen {
  position: absolute;
  inset: 0;
  opacity: 0.4;
  background: repeating-linear-gradient(
    114deg,
    rgba(255, 252, 226, 0) 0 34px,
    rgba(255, 252, 226, 0.22) 34px 48px,
    rgba(255, 252, 226, 0) 48px 92px
  );
  /* Nach unten hin ausblenden, damit die Wiese sauber bleibt. */
  mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.5) 38%, transparent 62%);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.5) 38%, transparent 62%);
}

.scenery__sun {
  position: absolute;
  top: -70px;
  right: -60px;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(
    circle,
    rgba(255, 249, 214, 0.95) 0%,
    rgba(255, 233, 150, 0.55) 38%,
    rgba(255, 233, 150, 0) 70%
  );
}

/* ---------- Wolken ---------- */
.scenery__cloud {
  position: absolute;
  height: 34px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.92);
  /* Die Beulen der Wolke sind Schatten desselben Elements - spart Markup. */
  box-shadow: 26px -14px 0 -2px rgba(255, 255, 255, 0.92),
    58px -4px 0 -6px rgba(255, 255, 255, 0.92), 0 12px 18px rgba(80, 140, 190, 0.18);
  animation: drift 26s linear infinite;
}

.scenery__cloud:nth-child(1) { top: 9%;  left: -30%; width: 96px; animation-duration: 34s; }
.scenery__cloud:nth-child(2) { top: 18%; left: -55%; width: 74px; animation-duration: 46s; animation-delay: -12s; }
.scenery__cloud:nth-child(3) { top: 5%;  left: -80%; width: 120px; animation-duration: 58s; animation-delay: -30s; }

@keyframes drift {
  from { transform: translateX(0); }
  to   { transform: translateX(260%); }
}

/* ---------- Berge im Hintergrund ---------- */
.scenery__mountains {
  position: absolute;
  left: -10%;
  right: -10%;
  bottom: 34%;
  height: 32%;
  background: var(--s-rock-dark);
  clip-path: polygon(
    0% 100%, 8% 52%, 16% 72%, 27% 26%, 38% 66%, 47% 44%,
    58% 78%, 68% 38%, 79% 68%, 88% 50%, 100% 88%, 100% 100%
  );
  opacity: 0.85;
}

/* Die hintere Bergreihe: heller, kleiner, leicht versetzt. Mehr braucht es
   nicht, damit der Hintergrund Tiefe bekommt. */
.scenery__mountains--fern {
  bottom: 38%;
  height: 24%;
  left: -18%;
  right: -2%;
  opacity: 0.45;
  filter: brightness(1.25);
}

.scenery__mountains--fern::after {
  display: none; /* keine Schneekappen in der Ferne */
}

/* Sonnenseite der Berge: ein heller Streifen an der rechten Flanke. */
.scenery__mountains::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 52%, rgba(255, 255, 255, 0.16) 100%);
}

.scenery__mountains::after {
  /* Schneekappen: dieselbe Silhouette, nur oben abgeschnitten */
  content: '';
  position: absolute;
  inset: 0;
  background: var(--snow);
  clip-path: polygon(
    22% 34%, 27% 26%, 33% 40%, 30% 38%, 27% 33%, 24% 37%,
    63% 46%, 68% 38%, 74% 52%, 71% 49%, 68% 45%, 65% 49%
  );
  opacity: 0.9;
}

/* ---------- Hügel ---------- */
.scenery__hills {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 22%;
  height: 26%;
  background: var(--s-grass-dark);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  transform: scaleX(1.6);
}

.scenery__hills--second {
  bottom: 18%;
  height: 20%;
  background: var(--s-grass);
  transform: scaleX(1.9) translateX(-8%);
}

/* ---------- Boden ---------- */
.scenery__ground {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 24%;
  background: linear-gradient(180deg, var(--s-grass-light) 0%, var(--s-grass) 40%, var(--s-grass-dark) 100%);
}

.scenery__ground::before {
  /* Angedeutete Grasbüschel als weiche Wellenlinie */
  content: '';
  position: absolute;
  top: -10px;
  left: 0;
  right: 0;
  height: 22px;
  background: radial-gradient(circle at 50% 100%, var(--s-grass-light) 55%, transparent 56%);
  background-size: 34px 22px;
  background-repeat: repeat-x;
}

/* ---------- Welt-Themen ----------
   Die FARBEN einer Welt stehen in js/data/worlds.js und werden von dort
   gesetzt (applyRegion in js/ui/scenery.js). Willst du eine Arena
   umfaerben, aenderst du also die Datendatei - nicht dieses Stylesheet.

   Hier unten stehen nur die FORMEN: die Silhouetten von Tannen,
   Kristallen, Felsnadeln und Kakteen. Die Klasse kommt auf den Bildschirm
   (nicht auf die Kulisse), damit Kulisse UND Arena sie erben. */

/* ---------- Eigenes Hintergrundbild ----------
   Traegt eine Welt das Feld "hintergrund", ersetzt dieses Bild die
   gezeichnete Kulisse. Der Boden der Arena bleibt bestehen, damit die
   Figuren immer sauber darauf stehen. */
.region--eigenes-bild .scenery__sky {
  background-image: var(--welt-bild);
  background-size: cover;
  background-position: center bottom;
}

.region--eigenes-bild .scenery__sun,
.region--eigenes-bild .scenery__cloud,
.region--eigenes-bild .scenery__mountains,
.region--eigenes-bild .scenery__hills {
  display: none;
}

/* In der Arena verschwinden Huegel und Baumreihen, damit das Bild wirkt.
   Die Wiese bleibt - sie ist der Boden, auf dem gekaempft wird. */
.region--eigenes-bild .arena__hills,
.region--eigenes-bild .arena__treeline {
  display: none;
}

/* Hinter einem Menue haben die Wolken nichts zu suchen: Unter dem
   Abdunkel-Schleier bleibt von einer weissen Wolke nur ein grauer Fleck
   uebrig, der wie ein Anzeigefehler aussieht - besonders am oberen Rand. */
.scenery--gedimmt .scenery__cloud {
  display: none;
}

/* Abgedunkelte Kulisse, damit Menues darauf lesbar bleiben */
.scenery--gedimmt::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10, 16, 44, 0.55), rgba(10, 16, 44, 0.78));
}

/* =========================================================================
   Die Kampfarena
   ---------------------------------------------------------------------
   Im Kampf zeigt die Kulisse nur Himmel, Sonne und Wolken (skyOnly).
   Alles andere gehört zur Arena: Hügel, Baumreihe, Wiese und Kampfplatz.
   Dadurch gibt es genau EINEN Horizont, und beide Monster stehen sicher
   darauf - egal wie hoch der Bildschirm ist.

   Die Arena ist in der Höhe begrenzt und wird mittig gesetzt, damit die
   Monster auch auf dem iPad dicht beieinander stehen.
   ========================================================================= */
.arena {
  position: relative;
  width: 100%;
  height: 100%;
  max-height: 400px;
  /* Die Wiese reicht absichtlich über die Arena hinaus. */
  overflow: visible;
}

/* Hügel hinter dem Horizont */
.arena__hills {
  position: absolute;
  left: -25%;
  right: -25%;
  top: 26%;
  height: 30%;
  background: var(--s-grass-dark);
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
}

/* Baumreihe direkt am Horizont */
/* ---------- Baumreihen am Horizont ----------
   Es gibt zwei Reihen, damit die Tiefe stimmt:

     "fern"  - kleine, leicht aufgehellte Tannen direkt am Horizont.
               Sie werden VOR der Wiese gezeichnet, deshalb verdeckt das
               Gras ihre Stämme - genau wie bei echten weit entfernten Bäumen.
     "nah"   - wenige große Tannen, die etwas tiefer stehen und NACH der
               Wiese gezeichnet werden. Sie stehen also sichtbar auf dem
               Gras, mit vollem Stamm und Schatten.

   Die Größe steuert eine einzige Variable je Baum: --h (Gesamthöhe).
   Krone, Stamm und Breite rechnen sich daraus aus. */
.arena__treeline {
  position: absolute;
  left: -3%;
  right: -3%;
  top: 52%;
  transform: translateY(-100%);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 1%;
}

.arena__tree {
  --h: 86px;
  position: relative;
  flex: 0 0 auto;
  width: calc(var(--h) * 0.62);
  height: var(--h);
}

/* Der Stamm liegt hinter der Krone und ragt unten heraus. */
.arena__tree-trunk {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: calc(var(--h) * 0.11);
  height: calc(var(--h) * 0.26);
  border-radius: 2px;
  background: linear-gradient(90deg, #8a6340 0%, #6b4a2f 55%, #4e3521 100%);
}

/* Die Krone: die Tannenform entsteht durch clip-path (drei Etagen und eine
   Spitze). Wichtig: das clip-path gehört NUR auf die Krone - liegt es auf
   dem ganzen Baum, schneidet es den Stamm mit weg.
   Willst du eine andere Baumform, änderst du nur diese Punkte. */
.arena__tree-top {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: calc(var(--h) * 0.84);
  background: linear-gradient(170deg, var(--s-tree) 0%, var(--s-tree-dark) 100%);
  clip-path: polygon(
    50% 0%,
    68% 30%, 58% 30%,
    80% 62%, 68% 62%,
    93% 100%, 7% 100%,
    32% 62%, 20% 62%,
    42% 30%, 32% 30%
  );
}

/* ---------- Ferne Reihe ---------- */
.arena__treeline--fern .arena__tree {
  --h: 60px;
  /* Dunst in der Ferne: heller, blasser, leicht bläulich - dadurch wirkt
     die Reihe weiter weg als die großen Tannen davor. */
  filter: brightness(1.22) saturate(0.6) hue-rotate(-6deg);
  opacity: 0.88;
}

.arena__treeline--fern .arena__tree:nth-child(2n) { --h: 48px; }
.arena__treeline--fern .arena__tree:nth-child(3n) { --h: 72px; }
.arena__treeline--fern .arena__tree:nth-child(5n) { --h: 42px; }

/* ---------- Nahe Reihe ----------
   Diese Bäume sitzen einzeln an festen Stellen am linken und rechten Rand,
   damit sie die Monster in der Mitte nicht verdecken. */
.arena__treeline--nah {
  position: absolute;
  left: 0;
  right: 0;
  top: 52%;
  height: 0;
}

.arena__treeline--nah .arena__tree {
  position: absolute;
  bottom: 0;
  /* Vorn kräftigere Farbe und ein Schatten auf der Wiese */
  filter: saturate(1.12) brightness(0.94) drop-shadow(0 8px 7px rgba(20, 50, 15, 0.35));
}

/* left = Position, margin-bottom = wie weit der Baum vor dem Horizont steht.
   Je größer und je tiefer, desto näher wirkt der Baum. */
.arena__treeline--nah .arena__tree:nth-child(1) { --h: 156px; left: -3%; margin-bottom: -58px; }
.arena__treeline--nah .arena__tree:nth-child(2) { --h: 112px; left: 12%; margin-bottom: -22px; }
.arena__treeline--nah .arena__tree:nth-child(3) { --h: 142px; left: 92%; margin-bottom: -46px; }

/* Die Wiese: beginnt am Horizont und läuft bis zum unteren Bildschirmrand */
.arena__ground {
  position: absolute;
  left: -50vw;
  right: -50vw;
  top: 52%;
  bottom: -100vh;
  background: linear-gradient(
    180deg,
    var(--s-grass-light) 0%,
    var(--s-grass) 14%,
    var(--s-grass-dark) 100%
  );
}

/* Angedeutete Grasbüschel an der Kante */
.arena__ground::before {
  content: '';
  position: absolute;
  top: -9px;
  left: 0;
  right: 0;
  height: 20px;
  background: radial-gradient(circle at 50% 100%, var(--s-grass-light) 55%, transparent 56%);
  background-size: 30px 20px;
  background-repeat: repeat-x;
}

/* Heller Kampfplatz, auf dem die beiden stehen */
.arena__ring {
  position: absolute;
  left: 50%;
  top: 56%;
  transform: translateX(-50%);
  width: 96%;
  height: 46%;
  border-radius: 50%;
  background: radial-gradient(
    ellipse at 50% 50%,
    rgba(255, 249, 214, 0.3) 0%,
    rgba(255, 249, 214, 0.1) 55%,
    rgba(255, 249, 214, 0) 72%
  );
}

/* Ein paar Blumen, damit die Wiese nicht wie eine leere Fläche wirkt */
.arena__flower {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #fff6c9;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.35);
  opacity: 0.85;
}

.arena__flower:nth-of-type(2n) {
  background: #ffd9ec;
}

.arena__flower:nth-of-type(1) { left: 32%; top: 66%; }
.arena__flower:nth-of-type(2) { left: 72%; top: 80%; }
.arena__flower:nth-of-type(3) { left: 18%; top: 88%; }
.arena__flower:nth-of-type(4) { left: 58%; top: 94%; }
.arena__flower:nth-of-type(5) { left: 88%; top: 70%; }

/* ---------- Eigene Pflanzen und Felsen je Welt ----------
   Alle Welten nutzen dieselben Bausteine (.arena__tree), nur die Silhouette
   wechselt. Dadurch sieht jede Welt anders aus, ohne neuen Code. */

/* Kristallhöhlen: aufragende Kristallsplitter, kein Stamm */
.region--kristall .arena__tree-top {
  clip-path: polygon(50% 0%, 78% 36%, 70% 100%, 30% 100%, 22% 36%);
}

.region--kristall .arena__tree-trunk {
  background: linear-gradient(90deg, #6f7bd6, #454b9e);
}

/* Vulkanlande: zackige Felsnadeln */
.region--vulkan .arena__tree-top {
  clip-path: polygon(50% 0%, 64% 38%, 56% 42%, 74% 100%, 26% 100%, 44% 42%, 36% 38%);
}

.region--vulkan .arena__tree-trunk {
  background: linear-gradient(90deg, #6b4636, #40261c);
}

/* Eisgebirge: Tannen mit Schneekappe */
.region--eis .arena__tree-top::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, var(--snow) 0%, rgba(255, 255, 255, 0) 42%);
}

/* Schattenreich: kahle, krumme Bäume */
.region--schatten .arena__tree-top {
  clip-path: polygon(
    44% 0%, 56% 0%, 56% 34%, 80% 14%, 86% 24%, 56% 50%,
    56% 100%, 44% 100%, 44% 58%, 14% 30%, 20% 20%, 44% 40%
  );
}

/* Wüstenreich: Kakteen */
.region--wueste .arena__tree-top {
  clip-path: polygon(
    40% 14%, 60% 14%, 60% 44%, 76% 44%, 76% 28%, 88% 28%, 88% 60%,
    60% 60%, 60% 100%, 40% 100%, 40% 68%, 12% 68%, 12% 36%, 24% 36%, 24% 52%, 40% 52%
  );
}

.region--wueste .arena__tree-trunk,
.region--kristall .arena__tree-trunk {
  height: calc(var(--h) * 0.12);
}

/* In Vulkan, Schatten und Wüste wächst nichts, was blüht. */
.region--vulkan .arena__flower,
.region--schatten .arena__flower,
.region--wueste .arena__flower {
  display: none;
}

/* Im Eis liegen statt Blumen Schneeflecken. */
.region--eis .arena__flower {
  background: #ffffff;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5);
  width: 14px;
  height: 8px;
  border-radius: 50%;
}

/* =========================================================================
   Die verzauberte Wiese
   ---------------------------------------------------------------------
   Grasbueschel, Blumen, Steine, Kristalle, Lichtpunkte und Blaetter.
   Alle benutzen die Weltfarben (--s-...), damit sie auch in einer anderen
   Welt stimmig aussehen.

   Die Plaetze stehen in js/ui/scenery.js. Die Mitte bleibt bewusst frei -
   dort steht die Figur.
   ========================================================================= */
.scenery__deko {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.deko {
  position: absolute;
  /* --gr skaliert das einzelne Stueck, ohne die Position zu verschieben. */
  transform: translateX(-50%) scale(var(--gr, 1));
  transform-origin: bottom center;
}

/* ---------- Grasbueschel ----------
   Drei Halme aus einem Element: der mittlere ist das Element selbst,
   die beiden aeusseren sind seine Pseudo-Elemente. */
.deko--gras {
  width: 4px;
  height: 18px;
  border-radius: 2px 2px 0 0;
  background: var(--s-grass-dark);
  animation: halm-wiegen 3.8s ease-in-out infinite;
}

.deko--gras::before,
.deko--gras::after {
  content: '';
  position: absolute;
  bottom: 0;
  width: 3px;
  border-radius: 2px 2px 0 0;
  background: var(--s-grass-dark);
}

.deko--gras::before {
  left: -6px;
  height: 12px;
  transform: rotate(-16deg);
  transform-origin: bottom center;
}

.deko--gras::after {
  left: 6px;
  height: 14px;
  transform: rotate(15deg);
  transform-origin: bottom center;
  opacity: 0.85;
}

@keyframes halm-wiegen {
  0%, 100% { transform: translateX(-50%) scale(var(--gr, 1)) rotate(-3deg); }
  50%      { transform: translateX(-50%) scale(var(--gr, 1)) rotate(3deg); }
}

/* ---------- Blumen ----------
   Ein heller Kopf mit einem gelben Kern auf einem kurzen Stiel. Sie
   leuchten ganz leicht - das ist der magische Teil der Wiese. */
.deko--blume {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, var(--gold-1) 0 34%, #fff4fb 35% 100%);
  box-shadow: 0 0 6px rgba(255, 240, 200, 0.55);
  animation: blume-atmen 4.5s ease-in-out infinite;
}

.deko--blume::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  width: 2px;
  height: 10px;
  transform: translateX(-50%);
  background: var(--s-grass-dark);
}

@keyframes blume-atmen {
  0%, 100% { box-shadow: 0 0 5px rgba(255, 240, 200, 0.4); }
  50%      { box-shadow: 0 0 9px rgba(255, 240, 200, 0.75); }
}

/* ---------- Steine ---------- */
.deko--stein {
  width: 18px;
  height: 10px;
  border-radius: 50% 50% 40% 40%;
  background: linear-gradient(180deg, var(--s-rock) 0 55%, var(--s-rock-dark) 56% 100%);
  box-shadow: 0 2px 0 rgba(10, 20, 40, 0.18);
}

/* ---------- Kristalle ----------
   Zwei Stueck, je einer links und rechts. Sie sind das deutlichste
   Fantasy-Element und deshalb bewusst klein. */
.deko--kristall {
  width: 12px;
  height: 27px;
  background: linear-gradient(160deg, #cdf3ff 0%, #6fd0ff 45%, #3a8fd0 100%);
  clip-path: polygon(50% 0%, 100% 34%, 78% 100%, 22% 100%, 0% 34%);
  box-shadow: 0 0 10px rgba(120, 215, 255, 0.5);
  animation: kristall-glimmen 5.2s ease-in-out infinite;
}

@keyframes kristall-glimmen {
  0%, 100% { box-shadow: 0 0 7px rgba(120, 215, 255, 0.35); }
  50%      { box-shadow: 0 0 13px rgba(120, 215, 255, 0.7); }
}

/* ---------- Schwebende Lichtpunkte ---------- */
.funke {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #fff8dc;
  box-shadow: 0 0 8px rgba(255, 245, 200, 0.9);
  opacity: 0;
  animation: funke-schweben 7s ease-in-out infinite;
}

@keyframes funke-schweben {
  0%       { opacity: 0; transform: translateY(0) scale(0.6); }
  25%      { opacity: 0.85; }
  60%      { opacity: 0.5; }
  100%     { opacity: 0; transform: translateY(-46px) scale(1.1); }
}

/* ---------- Blaetter, die vorbeiziehen ---------- */
.blatt {
  position: absolute;
  width: 11px;
  height: 7px;
  border-radius: 0 70% 0 70%;
  background: var(--s-tree);
  opacity: 0.75;
}

.blatt--1 {
  top: 53%;
  animation: blatt-fliegen 17s linear infinite;
}

.blatt--2 {
  top: 57%;
  animation: blatt-fliegen 23s linear infinite;
  animation-delay: -9s;
  transform: scale(0.8);
}

@keyframes blatt-fliegen {
  0%   { left: -6%; transform: translateY(0) rotate(0deg); }
  50%  { transform: translateY(-16px) rotate(180deg); }
  100% { left: 106%; transform: translateY(6px) rotate(360deg); }
}

/* Hinter einem Menue bleibt die Wiese leer - dort zaehlt nur die Lesbarkeit. */
.scenery--gedimmt .scenery__deko,
.scenery--gedimmt .scenery__strahlen {
  display: none;
}

/* Eigenes Hintergrundbild: die gezeichnete Deko wuerde sich damit beissen. */
.region--eigenes-bild .scenery__deko,
.region--eigenes-bild .scenery__strahlen {
  display: none;
}

/* Auf kurzen Bildschirmen (kleines iPhone) ist das freie Wiesenband so
   schmal, dass die aeussersten Stuecke hinter dem Aufgabenbanner
   verschwinden wuerden. Dann lieber weglassen. */
@media (max-height: 700px) {
  .deko--aussen {
    display: none;
  }
}

/* Im Querformat liegt rechts die Knopfspalte. Dort wuerde die Deko nur
   hinter der UI hervorlugen - also bleibt nur die linke Wiesenhaelfte. */
@media (orientation: landscape) and (max-height: 560px) {
  .deko--rechts,
  .funke--rechts {
    display: none;
  }
}

/* ===== css/ui.css ===== */
/* =========================================================================
   MonsterQuest · ui.css
   Wiederverwendbare Bausteine: Logo, Buttons, Panels, Balken, Karten, HUD.
   Diese Klassen gelten auf allen Bildschirmen.
   ========================================================================= */

/* ---------- Logo ----------
   Als SVG gebaut, weil nur dort die dunkle Kontur sauber HINTER der
   Farbfuellung liegt (paint-order). In reinem HTML-Text würde die Kontur
   die Füllung überdecken. */
.logo {
  display: block;
  width: 100%;
  max-width: 330px;
  margin: 0 auto;
  height: auto;
  filter: drop-shadow(0 6px 10px rgba(10, 20, 60, 0.4));
}

/* Die drei Lagen des Logos. Reihenfolge = Reihenfolge im SVG:
   goldener Rand ganz hinten, dann die dunkle Kontur, vorn die Farbe.
   Kein paint-order noetig - genau daran ist die alte Fassung auf dem
   iPhone zerbrochen. */
.logo__rand {
  fill: none;
  stroke: var(--fantasy-gold);
  /* Nur wenig breiter als die dunkle Kontur (8), sonst laeuft das Gold in
     die Innenraeume der Buchstaben - besonders beim Q. */
  stroke-width: 11;
  stroke-linejoin: round;
  opacity: 0.75;
}

.logo__kontur {
  fill: #16204f;
  stroke: #16204f;
  stroke-width: 8;
  stroke-linejoin: round;
}

.logo__fuellung {
  stroke: none;
}

.logo__claim {
  margin-top: 6px;
  text-align: center;
  font-size: 0.82rem;
  font-weight: 500;
  color: #ffffff;
  text-shadow: 0 2px 3px rgba(12, 18, 48, 0.8);
}

/* ---------- Buttons ---------- */
/*
 * Knoepfe.
 *
 * Alle sind gleich gebaut: Verlauf von hell nach dunkel, Lichtkante oben,
 * Schattenkante unten und ein Sockel darunter, der sie beim Druecken
 * einsinken laesst. Die FARBE behaelt ihre Bedeutung:
 *   Gold  = kostet Muenzen
 *   Gruen = weiter, bestaetigen
 *   Blau  = Abenteuer, Hauptaktion
 *   Grau  = zurueck, abbrechen
 *   Rot   = loeschen
 */
.btn {
  font: inherit;
  font-weight: 600;
  border: 2px solid rgba(12, 18, 48, 0.45);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 14px 22px;
  border-radius: 999px;
  color: var(--text-dark);
  background: linear-gradient(180deg, #ffe9a8 0%, var(--gold-1) 38%, var(--gold-2) 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.7),
    inset 0 -3px 0 rgba(140, 80, 10, 0.35),
    0 5px 0 var(--gold-3), 0 10px 18px rgba(10, 16, 44, 0.4);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.btn:active {
  transform: translateY(4px);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), 0 1px 0 var(--gold-3),
    0 4px 10px rgba(10, 16, 44, 0.3);
}

.btn--big {
  width: 100%;
  min-height: 62px;
  font-size: 1.3rem;
  letter-spacing: 0.02em;
}

.btn--green {
  color: #0f2a08;
  border-color: rgba(255, 197, 61, 0.55);
  background: linear-gradient(180deg, #b6f07a 0%, var(--green-1) 38%, var(--green-2) 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.6),
    inset 0 -3px 0 rgba(20, 70, 10, 0.35),
    0 5px 0 var(--green-3), 0 10px 18px rgba(10, 16, 44, 0.4);
}

.btn--green:active {
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.4), 0 1px 0 var(--green-3);
}

.btn--ghost {
  color: var(--text);
  border-color: rgba(255, 197, 61, 0.3);
  background: linear-gradient(180deg, #33457f 0%, var(--panel-solid) 55%, #16204a 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22),
    inset 0 -2px 0 rgba(8, 14, 40, 0.5),
    0 4px 0 #101838, 0 8px 16px rgba(10, 16, 44, 0.4);
}

.btn--ghost:active {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 1px 0 #101838;
}

.btn--small {
  min-height: 42px;
  padding: 8px 16px;
  font-size: 0.9rem;
}

.btn--danger {
  color: #fff;
  border-color: rgba(12, 18, 48, 0.4);
  background: linear-gradient(180deg, #ffb0b6 0%, #ff8a93 38%, var(--danger) 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45),
    inset 0 -3px 0 rgba(120, 20, 30, 0.35),
    0 5px 0 var(--danger-dark), 0 10px 18px rgba(10, 16, 44, 0.4);
}

.btn:disabled {
  filter: grayscale(0.7) brightness(0.8);
  cursor: not-allowed;
}

/* Runde Symbol-Buttons (Monster, Deck, Sammlung, Einstellungen) */
.icon-btn {
  font: inherit;
  border: none;
  cursor: pointer;
  display: grid;
  gap: 5px;
  justify-items: center;
  background: none;
  color: var(--text);
  padding: 0;
}

.icon-btn__circle {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  font-size: 1.6rem;
  border-radius: 50%;
  /* Damit der Charakter im Knopf "Figur" rund beschnitten wird. */
  overflow: hidden;
  background: linear-gradient(180deg, var(--panel-light), var(--panel-solid));
  border: 2px solid var(--panel-border);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2), 0 5px 0 #101838,
    0 8px 16px rgba(10, 16, 44, 0.4);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.icon-btn:active .icon-btn__circle {
  transform: translateY(4px);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.15), 0 1px 0 #101838;
}

.icon-btn__label {
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-shadow: 0 2px 0 rgba(12, 18, 48, 0.7);
}

/* ---------- Panels ---------- */
.panel {
  position: relative;
  /* Verlauf statt einer flachen Flaeche: oben etwas heller, unten tiefer.
     Das laesst die Tafel wie ein Stueck Material wirken. */
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 55%, #16204a 100%);
  border: 2px solid var(--panel-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel), inset 0 1px 0 rgba(255, 255, 255, 0.16),
    inset 0 -2px 0 rgba(8, 14, 40, 0.4);
  padding: 14px;
  /* Kein overflow:hidden! Eine Box mit overflow:hidden darf im Raster auf
     0 schrumpfen - dann wuerde der Inhalt abgeschnitten. */
}

/* Feiner goldener Lichtstrich an der Oberkante - der Akzent, der alle
   Tafeln im Spiel zusammenhaelt. */
.panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 12%;
  right: 12%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 197, 61, 0.7), transparent);
}

.panel--tight {
  padding: 10px 12px;
}

.panel__title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 10px;
  letter-spacing: 0.01em;
}

/* Goldener Strich vor der Ueberschrift - wie eine kleine Wappenmarke. */
.panel__title::before {
  content: '';
  flex: 0 0 auto;
  width: 3px;
  height: 15px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
  box-shadow: 0 0 6px rgba(255, 197, 61, 0.5);
}

/* ---------- Kopfleiste ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex: 0 0 auto;
}

.topbar__title {
  position: relative;
  flex: 1;
  min-width: 0;
  text-align: center;
  padding-bottom: 7px;
  font-size: 1.02rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-shadow: 0 2px 0 rgba(12, 18, 48, 0.8), 0 0 12px rgba(120, 170, 255, 0.35);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Goldener Zierstrich unter dem Titel - derselbe Akzent wie auf den Tafeln. */
.topbar__title::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 58px;
  height: 2px;
  transform: translateX(-50%);
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
}

.topbar__spacer {
  width: 84px;
  flex: 0 0 auto;
}

/* ---------- Spieler-Anzeige (Avatar, Stufe, Muenzen) ---------- */
.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex: 0 0 auto;
}

.hud__player {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px 5px 5px;
  border-radius: 999px;
  background: var(--panel);
  border: 2px solid var(--panel-border);
  box-shadow: var(--shadow-panel);
}

.hud__avatar {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  overflow: hidden;
  font-size: 1.3rem;
  border-radius: 50%;
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
  border: 2px solid #fff;
}

.hud__level {
  display: grid;
  gap: 3px;
}

/* Der Spielername - nur da, wenn einer gewählt wurde. Er darf die schmale
   Leiste nicht sprengen: zu lange Namen werden mit … abgeschnitten. */
.hud__name {
  max-width: 118px;
  font-size: 0.82rem;
  font-weight: 700;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hud__level-text {
  font-size: 0.72rem;
  font-weight: 600;
  line-height: 1;
  color: var(--text-dim);
}

.hud__level-bar {
  width: 68px;
  height: 7px;
  border-radius: 999px;
  background: #0d1430;
  overflow: hidden;
}

.hud__level-fill {
  /* display: block ist noetig - als inline-Element haette das span
     weder Breite noch Hoehe und der Balken bliebe leer. */
  display: block;
  height: 100%;
  width: 100%;
  transform-origin: left center;
  transform: scaleX(var(--fuellung, 1));
  background: linear-gradient(180deg, var(--green-1), var(--green-2));
  transition: transform 0.3s ease;
}

/*
 * Die gezeichnete Muenze.
 *
 * Statt des Emojis 🪙, das je nach Geraet anders aussieht - auf dem iPhone
 * silbergrau, sonst golden. Gezeichnet passt sie ueberall zur Goldfarbe des
 * Spiels. Sie waechst mit der Schriftgroesse (em statt px).
 */
.muenze {
  display: inline-block;
  width: 1em;
  height: 1em;
  border-radius: 50%;
  /* Lichtpunkt oben links, dunkler Rand unten rechts - das macht rund. */
  background: radial-gradient(circle at 34% 28%, #ffeda6 0%, var(--gold-1) 42%, var(--gold-2) 100%);
  border: 0.09em solid #a86c14;
  box-shadow: inset 0 -0.1em 0.12em rgba(120, 66, 8, 0.45);
  vertical-align: -0.13em;
}

/* Auf einem goldenen Knopf ginge Gold auf Gold unter - ein heller Ring
   hebt die Muenze ab. */
.btn .muenze {
  border-color: #6d4408;
  box-shadow: inset 0 -0.1em 0.12em rgba(120, 66, 8, 0.45),
    0 0 0 0.07em rgba(255, 255, 255, 0.6);
}

.hud__coins {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  background: var(--panel);
  border: 2px solid var(--panel-border);
  box-shadow: var(--shadow-panel);
}

.hud__coin-icon {
  font-size: 1rem;
}

/* ---------- Lebens- und Energieanzeigen ---------- */
.bar {
  position: relative;
  display: block;
  height: 14px;
  background: linear-gradient(180deg, #0b1230 0%, #16204a 100%);
  border: 2px solid rgba(12, 18, 48, 0.85);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
}

/* Glanzstreifen auf der oberen Haelfte - laesst den Balken gewoelbt wirken. */
.bar::after {
  content: '';
  position: absolute;
  inset: 1px 1px auto 1px;
  height: 40%;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent);
  pointer-events: none;
}

/*
 * Der Balken wird ueber transform: scaleX gestaucht, nicht ueber width.
 * Grund: Safari auf dem iPad liess beim Ueberblenden von "width" den alten,
 * breiteren Anstrich stehen - der Balken sah voller aus als die Lebenszahl.
 * scaleX laeuft im Compositor und zeichnet zuverlaessig neu.
 */
.bar__fill {
  /* display: block, weil der Balken auch als <span> gebaut wird (z. B. bei
     den Tagesaufgaben) - ein inline-Element haette weder Breite noch Hoehe. */
  display: block;
  height: 100%;
  width: 100%;
  transform-origin: left center;
  transform: scaleX(var(--fuellung, 1));
  background: linear-gradient(180deg, var(--green-1), var(--green-2));
  transition: transform 0.2s ease-out;
}

.bar.is-low .bar__fill {
  background: linear-gradient(180deg, #ff8f97, var(--danger));
}

/* Das Warnblinken liegt auf dem Rahmen, nicht auf der Fuellung: zwei
   Animationen auf demselben Element haben den Neuzeichen-Fehler ausgeloest. */
.bar.is-low {
  animation: bar-warnung 0.9s ease-in-out infinite;
}

@keyframes bar-warnung {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 95, 109, 0); }
  50% { box-shadow: 0 0 9px 2px rgba(255, 95, 109, 0.6); }
}

.pips {
  --pip-color: #49c7ff;
  --pip-charge: rgba(73, 199, 255, 0.5);
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
}

.pips--enemy {
  --pip-color: var(--danger);
  --pip-charge: rgba(255, 95, 109, 0.5);
}

.pips--small {
  gap: 3px;
}

.pip {
  position: relative;
  height: 13px;
  border-radius: 4px;
  background: linear-gradient(180deg, #0b1230, #16204a);
  border: 2px solid rgba(12, 18, 48, 0.85);
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
}

/* Derselbe Glanz wie auf den Balken, damit alle Anzeigen zusammenpassen. */
.pip::after {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 45%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent);
  pointer-events: none;
}

.pips--small .pip {
  height: 8px;
  border-width: 1px;
  border-radius: 3px;
}

.pip.is-filled {
  background: var(--pip-color);
  border-color: var(--pip-color);
}

.pip.is-charging::after {
  content: '';
  position: absolute;
  inset: 0;
  transform-origin: left;
  transform: scaleX(var(--charge, 0));
  background: var(--pip-charge);
}

/* ---------- Angriffskarten ---------- */
.card {
  font: inherit;
  color: var(--text);
  position: relative;
  display: grid;
  gap: 2px;
  justify-items: center;
  align-content: center;
  padding: 12px 6px 10px;
  min-height: 96px;
  cursor: pointer;
  /* KEIN overflow: hidden - das Energie-Abzeichen ragt absichtlich ueber
     die Ecke hinaus und wuerde sonst abgeschnitten. */
  border: 2px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #34457f 0%, var(--panel-solid) 50%, #141e4a 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18),
    inset 0 -2px 0 rgba(8, 14, 40, 0.5),
    0 5px 0 #101838, 0 8px 14px rgba(10, 16, 44, 0.45);
  transition: transform 0.1s ease, opacity 0.15s ease, border-color 0.15s ease,
    box-shadow 0.15s ease;
}

/* Schraeger Lichtschein ueber der Karte - wie der Glanz auf einer echten
   Sammelkarte. Liegt hinter Symbol und Text (z-index der Kinder in base.css). */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  /* Der Glanz beschneidet sich selbst rund - so bleibt die Karte offen
     fuer das ueberstehende Abzeichen. */
  border-radius: inherit;
  background: linear-gradient(118deg, transparent 38%, rgba(255, 255, 255, 0.1) 50%, transparent 62%);
  pointer-events: none;
}

.card.is-ready {
  border-color: var(--gold-2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22),
    inset 0 -2px 0 rgba(8, 14, 40, 0.5),
    0 5px 0 var(--gold-3), 0 0 18px rgba(255, 190, 60, 0.45);
}

.card.is-ready:active {
  transform: translateY(4px) scale(0.97);
}

/* Nicht bezahlbare Karte: abgedunkelt statt durchsichtig - sonst scheint
   der helle Hintergrund durch und die Karte wird unleserlich. */
.card.is-disabled {
  filter: grayscale(0.55) brightness(0.6);
  cursor: not-allowed;
}

.card__cost {
  position: absolute;
  top: -11px;
  left: -8px;
  min-width: 30px;
  height: 30px;
  padding: 0 6px;
  display: grid;
  place-items: center;
  font-size: 0.88rem;
  font-weight: 700;
  color: #06234a;
  border-radius: 999px;
  background: linear-gradient(180deg, #b4eeff 0%, #6fd0ff 40%, #2b8fd0 100%);
  border: 2px solid #0d1430;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8),
    0 0 0 1px rgba(255, 197, 61, 0.45), 0 2px 5px rgba(8, 14, 40, 0.5);
}

.card__icon {
  font-size: 1.7rem;
  line-height: 1;
}

.card__name {
  font-size: 0.8rem;
  font-weight: 600;
  text-align: center;
}

.card__effect {
  font-size: 0.72rem;
  color: var(--text-dim);
}

/* ---------- Monster-Darstellung ---------- */
.platform {
  width: 110px;
  height: 22px;
  margin-top: -10px;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, 0.35), rgba(20, 60, 15, 0.35));
  box-shadow: 0 6px 14px rgba(12, 30, 10, 0.35);
}

/* Behälter für eine Pixel-Figur. Die Größe steht in --sprite und wird
   weiter unten je nach Bildschirm angepasst. */
.sprite {
  width: var(--sprite, 96px);
  height: var(--sprite, 96px);
  display: grid;
  place-items: end center;
  filter: drop-shadow(0 8px 8px rgba(10, 20, 40, 0.4));
}

.sprite--large {
  width: var(--sprite-large, 150px);
  height: var(--sprite-large, 150px);
}

/* Bosse werden größer dargestellt als normale Gegner. */
.sprite--boss {
  width: calc(var(--sprite, 96px) * 1.35);
  height: calc(var(--sprite, 96px) * 1.35);
}

/* Im runden Avatar bekommt die Figur etwas Luft, damit sie nicht am Rand
   klebt. */
.hud__avatar .pixel-sprite {
  width: 84%;
  height: 84%;
}

/* Die Figur selbst: hart skaliert, damit die Pixel scharf bleiben. */
.pixel-sprite {
  width: 100%;
  height: 100%;
  /* min-*: 0 ist noetig, weil ein Bild in einem Gitter von sich aus eine
     Mindestgroesse aus seinen Originalmassen bekommt. Die ueberstimmt sonst
     die Vorgaben hier - die Figur wurde dadurch viel zu gross. */
  min-width: 0;
  min-height: 0;
  object-fit: contain;
  image-rendering: pixelated;
  -webkit-user-drag: none;
  user-select: none;
}

/*
 * Menschen statt Tiere.
 *
 * Eine menschliche Figur ist etwa doppelt so hoch wie breit. In einem
 * quadratischen Kasten waere sie winzig - also darf sie nach oben darueber
 * hinauswachsen. Weil der Kasten seine Kinder unten ausrichtet, bleiben die
 * Fuesse dabei genau auf dem Boden stehen.
 */
/* Der Kasten selbst wird hoeher, statt dass die Figur darueber hinauswaechst.
   Nur so rechnet das Layout mit ihrer Hoehe - sonst ragt sie in die Zeile
   darueber hinein. :has() fragt: "enthaelt dieser Kasten eine hohe Figur?" */
.sprite:has(.pixel-sprite--hoch) {
  height: calc(var(--sprite, 96px) * 1.5);
}

.sprite--large:has(.pixel-sprite--hoch) {
  height: calc(var(--sprite-large, 150px) * 1.4);
}

.pixel-sprite--hoch {
  align-self: end;
}

/* Im runden Avatar wird nur der Kopf gezeigt - ganzkoerpers waere die Figur
   dort nur ein Streifen. */
.hud__avatar .pixel-sprite--hoch {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 6%;
}

/* ---------- Overlay (Sieg/Niederlage/Dialoge) ---------- */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 24px;
  /* Der Hintergrund wird weichgezeichnet, damit das Fenster im Vordergrund steht. */
  background: rgba(8, 12, 30, 0.55);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
  animation: fade-in 0.2s ease-out;
}

.overlay__box {
  position: relative;
  width: 100%;
  max-width: 360px;
  display: grid;
  gap: 10px;
  justify-items: center;
  text-align: center;
  padding: 22px 20px;
  border-radius: 22px;
  background: linear-gradient(180deg, #33468c 0%, var(--panel-solid) 55%, #141d45 100%);
  border: 3px solid var(--gold-2);
  box-shadow: var(--shadow-panel), 0 0 22px rgba(255, 197, 61, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  animation: pop-in 0.25s cubic-bezier(0.2, 1.4, 0.5, 1);
}

/* feiner goldener Lichtstrich an der Oberkante des Fensters */
.overlay__box::before {
  content: '';
  position: absolute;
  top: 0;
  left: 18%;
  right: 18%;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, rgba(255, 220, 140, 0.8), transparent);
}

/* Kampf-Tutorial: drei kurze Schritte im Ergebnis-Fenster-Stil */
.tutorial-liste {
  list-style: none;
  margin: 6px 0 2px;
  padding: 0;
  display: grid;
  gap: 12px;
  width: 100%;
  text-align: left;
}

.tutorial-step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.tutorial-step__icon {
  font-size: 1.7rem;
  line-height: 1.1;
  flex: 0 0 auto;
  width: 34px;
  text-align: center;
}

.tutorial-step__body {
  display: grid;
  gap: 2px;
}

.tutorial-step__title {
  font-weight: 700;
  font-size: 0.98rem;
}

.tutorial-step__text {
  font-size: 0.84rem;
  color: var(--text-dim);
  line-height: 1.35;
}

/* Erfolg-Fortschrittsbalken in der Sammlung */
.erfolg-fortschritt {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.erfolg-fortschritt__balken {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.3);
  overflow: hidden;
}

.erfolg-fortschritt__fuell {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-2, #ffb32b), var(--gold, #ffc53d));
}

.erfolg-fortschritt__zahl {
  font-size: 0.72rem;
  color: var(--text-dim);
  white-space: nowrap;
}

.katalog-item.is-erreicht {
  /* Ein erreichter Erfolg ist voll sichtbar (nicht gedimmt wie „gesperrt“). */
  opacity: 1;
}

/* Erfolg-Toast: kurze Einblendung am oberen Rand */
.erfolg-toast {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  left: 50%;
  transform: translate(-50%, -140%);
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: min(92vw, 420px);
  padding: 10px 16px;
  border-radius: 16px;
  background: linear-gradient(180deg, #33468c 0%, var(--panel-solid) 100%);
  border: 2px solid var(--gold);
  box-shadow: var(--shadow-panel), 0 0 18px rgba(255, 197, 61, 0.35);
  opacity: 0;
  transition: transform 0.38s cubic-bezier(0.2, 1.3, 0.5, 1), opacity 0.38s ease;
  pointer-events: none;
}

.erfolg-toast.is-shown {
  transform: translate(-50%, 0);
  opacity: 1;
}

.erfolg-toast__icon {
  font-size: 1.9rem;
  line-height: 1;
  flex: 0 0 auto;
}

.erfolg-toast__body {
  display: grid;
  gap: 1px;
}

.erfolg-toast__label {
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold);
}

.erfolg-toast__name {
  font-size: 1rem;
  font-weight: 700;
}

.overlay__unlock--erfolg {
  color: var(--gold);
}

.overlay__icon {
  font-size: 3.4rem;
  filter: drop-shadow(0 4px 6px rgba(8, 14, 40, 0.5));
}

.overlay__title {
  font-size: 1.5rem;
  font-weight: 700;
  text-shadow: 0 2px 0 rgba(8, 14, 40, 0.55), 0 0 14px rgba(255, 197, 61, 0.35);
}

.overlay__text {
  font-size: 0.9rem;
  color: var(--text-dim);
}

.overlay__actions {
  display: grid;
  gap: 8px;
  width: 100%;
  margin-top: 6px;
}

.overlay__actions .btn {
  width: 100%;
}

/* ---------- Sterne ---------- */
.stars {
  display: flex;
  gap: 3px;
  font-size: 1.1rem;
}

.star {
  filter: grayscale(1) brightness(0.55);
}

.star.is-earned {
  filter: none;
  animation: star-pop 0.4s backwards cubic-bezier(0.2, 1.5, 0.4, 1);
}

.star.is-earned:nth-child(2) { animation-delay: 0.15s; }
.star.is-earned:nth-child(3) { animation-delay: 0.3s; }

/* ---------- Animationen ---------- */
@keyframes bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
}

/* Treffer: das Monster zuckt und leuchtet kurz rot auf. Früher wurde es
   dabei komplett weiß - das sah aus wie ein Darstellungsfehler. */
@keyframes hit {
  0%, 100% {
    transform: translateX(0) scale(1);
    filter: drop-shadow(0 8px 8px rgba(10, 20, 40, 0.4));
  }
  20% {
    transform: translateX(-10px) scale(0.95);
    filter: brightness(1.35) drop-shadow(0 0 12px rgba(255, 70, 70, 0.95));
  }
  60% {
    transform: translateX(10px) scale(1.05);
    filter: brightness(1.35) drop-shadow(0 0 12px rgba(255, 70, 70, 0.95));
  }
}

@keyframes lunge-right {
  0%, 100% { transform: translate(0, 0); }
  40% { transform: translate(26px, -14px) scale(1.06); }
}

@keyframes lunge-left {
  0%, 100% { transform: translate(0, 0); }
  40% { transform: translate(-26px, 14px) scale(1.06); }
}

@keyframes heal-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.14); filter: drop-shadow(0 0 14px var(--green-1)); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

@keyframes fade-in {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes pop-in {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes star-pop {
  from { transform: scale(0); }
  to { transform: scale(1); }
}

@keyframes float-up {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-46px); opacity: 0; }
}

.idle-bob { animation: bob 2.6s ease-in-out infinite; }
.hit { animation: hit 0.4s ease-in-out; }
.lunge-right { animation: lunge-right 0.35s ease-out; }
.lunge-left { animation: lunge-left 0.35s ease-out; }
.heal { animation: heal-pulse 0.45s ease-in-out; }
.shake { animation: shake 0.25s ease-in-out; }

/* Schadenszahlen, die vom Monster aufsteigen */
.float-number {
  position: absolute;
  z-index: 3;
  font-size: 1.5rem;
  font-weight: 700;
  pointer-events: none;
  text-shadow: 0 2px 0 rgba(12, 18, 48, 0.8);
  animation: float-up 0.9s ease-out forwards;
}

.float-number--damage { color: #ffd76a; }
.float-number--heal { color: var(--green-1); }
.float-number--shield { color: #8fe3ff; }
.float-number--gift { color: #7ee081; }

/* =========================================================================
   Fantasy-Designsystem der Lobby
   ---------------------------------------------------------------------
   Vier Farben, ueberall dieselben: Dunkelblau, Blau, Weiss, Gold.
   Gold ist immer nur AKZENT - eine Kante, ein Ring, ein Punkt. Nie Flaeche.
   ========================================================================= */
:root {
  --fantasy-tief: #1b2a63;   /* dunkelblau, Grundflaeche */
  --fantasy-blau: #3c5fd0;   /* blau, Oberseite */
  --fantasy-hell: #6d92ff;   /* Lichtkante oben */
  --fantasy-gold: #ffc53d;   /* Akzentkante */
  --fantasy-gold-tief: #a8721a;
}

/* ---------- Der grosse Abenteuer-Knopf ----------
   Eigene Klasse statt .btn--big umzubauen: die anderen grossen Knoepfe im
   Spiel (Kaempfen, Weiter) sind gruen und bleiben unveraendert. */
.btn--abenteuer {
  /* Bezugspunkt fuer die Funken, die beim Antippen wegfliegen. */
  position: relative;
  color: #fff;
  background: linear-gradient(180deg, var(--fantasy-hell) 0%, var(--fantasy-blau) 45%, var(--fantasy-tief) 100%);
  border: 2px solid var(--fantasy-gold);
  text-shadow: 0 2px 3px rgba(8, 14, 40, 0.75);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.45),
    inset 0 -3px 0 rgba(8, 14, 40, 0.35),
    0 5px 0 var(--fantasy-gold-tief),
    0 10px 20px rgba(10, 16, 44, 0.45);
  animation: abenteuer-pulsieren 3.4s ease-in-out infinite;
}

.btn--abenteuer:active {
  transform: translateY(4px) scale(0.98);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.35),
    0 1px 0 var(--fantasy-gold-tief);
}

/* Zweiter Spielmodus: die Endlos-Arena. Violett statt Gold, damit sie sich
   klar vom Abenteuer-Knopf abhebt, aber nicht mit ihm konkurriert. */
.btn--arena {
  color: #fff;
  font-size: 1rem;
  padding: 13px 16px;
  background: linear-gradient(180deg, #7a54c9 0%, #5a3aa0 55%, #3d2775 100%);
  border: 2px solid #b98cff;
  text-shadow: 0 2px 3px rgba(8, 14, 40, 0.7);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.3),
    inset 0 -3px 0 rgba(8, 14, 40, 0.35),
    0 4px 0 #2c1c55,
    0 8px 16px rgba(10, 16, 44, 0.4);
}

.btn--arena:active {
  transform: translateY(3px) scale(0.99);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.25), 0 1px 0 #2c1c55;
}

/* Ganz leichtes Atmen - der Knopf soll einladen, nicht blinken. */
@keyframes abenteuer-pulsieren {
  0%, 100% { box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), inset 0 -3px 0 rgba(8,14,40,0.35),
                         0 5px 0 var(--fantasy-gold-tief), 0 10px 20px rgba(10,16,44,0.45); }
  50%      { box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), inset 0 -3px 0 rgba(8,14,40,0.35),
                         0 5px 0 var(--fantasy-gold-tief), 0 10px 26px rgba(120, 170, 255, 0.5); }
}

/* Beim Antippen kurz aufleuchten. */
.btn--abenteuer.is-gestartet {
  animation: none;
  filter: brightness(1.7) saturate(0.7);
  transform: translateY(4px) scale(0.97);
}

/* Die Funken, die dabei wegfliegen. */
.startfunke {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--fantasy-gold);
  box-shadow: 0 0 8px rgba(255, 205, 90, 0.9);
  pointer-events: none;
  animation: startfunke-fliegen 0.5s ease-out forwards;
}

@keyframes startfunke-fliegen {
  from { opacity: 1; transform: translate(0, 0) scale(1); }
  to   { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(0.3); }
}

/* ---------- Runde Menueknoepfe ---------- */
.icon-btn__circle {
  background: linear-gradient(180deg, #2c3f83 0%, var(--fantasy-tief) 60%, #141f4d 100%);
  border: 2px solid rgba(255, 197, 61, 0.55);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.22),
    inset 0 -2px 0 rgba(8, 14, 40, 0.4),
    0 5px 0 #0f1838,
    0 8px 16px rgba(10, 16, 44, 0.45);
}

.icon-btn__label {
  color: #eaf0ff;
}

/* Menuepunkte mit eigener Grafik.
   Der Knopf behaelt seinen runden Rahmen mit der goldenen Kante - er
   beschneidet die Grafik kreisrund.

   118 Prozent: Die Vorlage hatte die Beschriftung im unteren Teil des
   Kreises stehen. Ausgeschnitten wurde deshalb nur der schriftfreie Teil,
   und dessen gerade Unterkante wuerde man sonst sehen. Durch das leichte
   Vergroessern liegt sie ausserhalb des sichtbaren Kreises. */
.icon-btn__circle--bild img {
  width: 118%;
  height: 118%;
  min-width: 0;
  min-height: 0;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
}

/* ---------- Spielerleiste und Muenzen ---------- */
.hud__player,
.hud__coins {
  border-color: rgba(255, 197, 61, 0.45);
  background: linear-gradient(180deg, #2a3c7d 0%, var(--fantasy-tief) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 4px 10px rgba(10, 16, 44, 0.4);
}

.hud__avatar {
  border-color: var(--fantasy-gold);
  box-shadow: 0 0 0 1px rgba(8, 14, 40, 0.5);
}

/* ---------- Logo ----------
   Der dunkle Umriss bleibt. Dazu kommt ein weicher goldener Schein - das
   Logo selbst wird nicht neu gezeichnet. */
.logo {
  filter: drop-shadow(0 6px 10px rgba(10, 20, 60, 0.45))
    drop-shadow(0 0 12px rgba(255, 205, 90, 0.3));
  animation: logo-schimmern 6s ease-in-out infinite;
}

@keyframes logo-schimmern {
  0%, 100% { filter: drop-shadow(0 6px 10px rgba(10,20,60,0.45)) drop-shadow(0 0 10px rgba(255,205,90,0.22)); }
  50%      { filter: drop-shadow(0 6px 10px rgba(10,20,60,0.45)) drop-shadow(0 0 18px rgba(255,205,90,0.45)); }
}


/* ---------- Eingabefelder ----------
   Bisher kam das Spiel ohne aus. Gebraucht wird eines fuer den
   Uebertragungscode des Spielstands.

   16px ist Pflicht: Bei kleinerer Schrift zoomt Safari auf dem iPhone beim
   Antippen in die Seite hinein und kommt nicht wieder heraus. */
.eingabe {
  font: inherit;
  font-size: 16px;
  min-width: 0;
  padding: 8px 10px;
  color: var(--text);
  background: linear-gradient(180deg, #0f1737, #16204a);
  border: 2px solid var(--panel-border);
  border-radius: var(--radius-sm);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45);
}

.eingabe:focus {
  outline: none;
  border-color: var(--fantasy-gold);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45), 0 0 0 3px rgba(255, 197, 61, 0.28);
}

.eingabe::placeholder {
  color: rgba(214, 226, 255, 0.4);
}

/* Der Code wird abgetippt - deshalb weite Buchstabenabstaende. */
.eingabe--code {
  width: 8.5em;
  text-align: center;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.eingabe-gruppe {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* Der erzeugte Code im Text darunter. */
.spielstand-code {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 1rem;
  letter-spacing: 0.16em;
  color: var(--text-dark);
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
}

/* ---------- Willkommens-Pop-up (erster Start) ---------- */
.willkommen__feld {
  width: 100%;
  text-align: center;
  font-size: 16px; /* unter 16px zoomt Safari beim Antippen hinein */
  letter-spacing: 0.01em;
}

.willkommen__hinweis {
  margin-top: -2px;
  font-size: 0.74rem;
  color: var(--text-dim);
}

/* =========================================================================
   Extra-Effekte (Kampf und Bildschirmwechsel)
   -------------------------------------------------------------------------
   Alles hier laeuft ueber @keyframes. Damit schaltet der Schalter
   "Animationen" (body.no-animations) und die Systemeinstellung "weniger
   Bewegung" es automatisch mit ab - siehe css/base.css.
   ========================================================================= */

/* ---------- Sanfter Auftritt bei jedem Bildschirmwechsel ---------- */
@keyframes screen-rein {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.screen {
  animation: screen-rein 0.24s ease-out;
}

/* ---------- Bildschirm-Beben bei einem Treffer ----------
   Drei Staerken. Der Kampf waehlt die passende nach Schadenshoehe. */
@keyframes beben-klein {
  0%, 100% { transform: translate(0, 0); }
  30% { transform: translate(-2px, 1px); }
  70% { transform: translate(2px, -1px); }
}
@keyframes beben-mittel {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  20% { transform: translate(-4px, 2px) rotate(-0.3deg); }
  50% { transform: translate(4px, -2px) rotate(0.3deg); }
  80% { transform: translate(-3px, 1px) rotate(-0.2deg); }
}
@keyframes beben-gross {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  15% { transform: translate(-7px, 3px) rotate(-0.6deg); }
  35% { transform: translate(7px, -3px) rotate(0.6deg); }
  55% { transform: translate(-6px, 4px) rotate(-0.5deg); }
  75% { transform: translate(5px, -2px) rotate(0.4deg); }
}
.beben-klein  { animation: beben-klein  0.22s ease-in-out; }
.beben-mittel { animation: beben-mittel 0.30s ease-in-out; }
.beben-gross  { animation: beben-gross  0.40s ease-in-out; }

/* ---------- Aufprall-Funken am getroffenen Monster ---------- */
.impakt {
  position: absolute;
  left: 50%;
  top: 46%;
  width: 0;
  height: 0;
  z-index: 4;
  pointer-events: none;
}

/* Der Lichtring, der nach aussen aufplatzt. */
.impakt__ring {
  position: absolute;
  left: -20px;
  top: -20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 3px solid var(--impakt-farbe, #ffd76a);
  box-shadow: 0 0 14px var(--impakt-farbe, #ffd76a);
  animation: impakt-ring 0.42s ease-out forwards;
}
@keyframes impakt-ring {
  0%   { transform: scale(0.3); opacity: 0.95; }
  100% { transform: scale(1.9); opacity: 0; }
}

/* Die einzelnen Splitter, die wegfliegen. --dx/--dy setzt das Skript. */
.impakt__splitter {
  position: absolute;
  left: -3px;
  top: -3px;
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: var(--impakt-farbe, #ffd76a);
  box-shadow: 0 0 8px var(--impakt-farbe, #ffd76a);
  animation: impakt-splitter 0.5s ease-out forwards;
}
@keyframes impakt-splitter {
  0%   { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
}

/* ---------- Saftigere Schadenszahlen ----------
   Ersetzt das schlichte float-up: erst aufploppen, dann aufsteigen und
   leicht zur Seite treiben. */
@keyframes float-pop {
  0%   { transform: translate(0, 6px) scale(0.5); opacity: 0; }
  25%  { transform: translate(var(--drift, 0), -6px) scale(1.18); opacity: 1; }
  100% { transform: translate(var(--drift, 0), -52px) scale(1); opacity: 0; }
}

.float-number {
  animation: float-pop 0.95s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
}

/* Ein harter Treffer: groesser, rot-orange, mit kraeftigerem Schatten. */
.float-number--gross {
  font-size: 2.1rem;
  color: #ff7a3c;
  text-shadow: 0 2px 0 rgba(12, 18, 48, 0.85), 0 0 16px rgba(255, 90, 40, 0.7);
}

/* Kritischer Treffer: noch groesser, goldgelb, mit kurzem Aufblitz-Puls. */
.float-number--krit {
  font-size: 2.4rem;
  color: #ffdb3b;
  letter-spacing: 0.01em;
  text-shadow: 0 2px 0 rgba(12, 18, 48, 0.9), 0 0 20px rgba(255, 120, 40, 0.9);
  animation: float-pop 0.95s cubic-bezier(0.2, 1.2, 0.4, 1) forwards,
    krit-blitz 0.28s ease-out;
}
@keyframes krit-blitz {
  0% { filter: brightness(2.4); }
  100% { filter: brightness(1); }
}

/* ---------- Volle Energie: der Balken schimmert golden ---------- */
.wert-leiste.is-voll {
  border-color: var(--fantasy-gold);
  animation: energie-voll 1.6s ease-in-out infinite;
}
@keyframes energie-voll {
  0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14); }
  50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 0 16px rgba(255, 197, 61, 0.5); }
}

/* ---------- Konfetti im Siegesfenster ---------- */
.konfetti {
  position: absolute;
  top: -12px;
  width: 9px;
  height: 14px;
  border-radius: 2px;
  z-index: 6;
  pointer-events: none;
  animation: konfetti-fall 1.5s ease-in forwards;
}
@keyframes konfetti-fall {
  0%   { transform: translateY(0) rotate(0); opacity: 1; }
  100% { transform: translateY(var(--fall, 320px)) rotate(var(--dreh, 540deg)); opacity: 0; }
}

/* ---------- Eine Karte springt kurz an, wenn sie spielbar wird ---------- */
@keyframes karte-bereit {
  0% { transform: translateY(0) scale(1); }
  45% { transform: translateY(-4px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}
.karte-bereit { animation: karte-bereit 0.32s ease-out; }

/* Eine gespielte Karte fliegt kurz nach oben aus der Hand (ein Klon, siehe
   js/ui/effekte.js). Gibt dem Kartenspiel ein spürbares "ab dafür". */
@keyframes karte-flieg {
  0%   { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
  100% { transform: translateY(-46px) scale(1.16) rotate(-3deg); opacity: 0; }
}
.karte-flieg { animation: karte-flieg 0.4s cubic-bezier(0.3, 0, 0.5, 1) forwards; }

/* Energiestrahl quer über die Arena (siehe js/ui/effekte.js).
   transform-origin links, damit die Länge vom Angreifer weg zeigt. */
.energiestrahl {
  height: 6px;
  transform-origin: left center;
  border-radius: 3px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.1), var(--strahl-farbe, #8fd0ff) 45%, #ffffff);
  box-shadow: 0 0 14px var(--strahl-farbe, #8fd0ff);
  animation: strahl-blitz 0.24s ease-out forwards;
}
@keyframes strahl-blitz {
  0%   { opacity: 0; }
  25%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ===== css/screens.css ===== */
/* =========================================================================
   MonsterQuest · screens.css
   Aufbau der einzelnen Bildschirme.
   ========================================================================= */

/* =========================================================
   Startbildschirm
   ========================================================= */
.screen--start {
  justify-content: space-between;
  gap: 10px;
}

.start__logo {
  margin-top: 4px;
  flex: 0 0 auto;
  text-align: center;
}

.start__hero {
  flex: 1;
  display: grid;
  /* Zwei Reihen: oben die Buehne mit der Figur, darunter das Namensschild.
     minmax(0, 1fr) ist der entscheidende Teil - damit DARF die Buehne
     schrumpfen. Vorher war sie immer so hoch wie die Figur; auf niedrigen
     Bildschirmen (Safari blendet die Adressleiste ein) wuchs sie dann nach
     oben aus dem Bereich heraus und lag ueber dem Schriftzug. */
  grid-template-rows: minmax(0, 1fr) auto;
  justify-items: center;
  align-items: center;
  gap: 14px;
  min-height: 0;
}

.start__hero-name {
  padding: 5px 16px;
  border-radius: 999px;
  font-size: 0.85rem;
  font-weight: 600;
  background: linear-gradient(180deg, rgba(60, 95, 208, 0.9), rgba(27, 42, 99, 0.92));
  border: 2px solid var(--fantasy-gold);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 3px 8px rgba(8, 14, 40, 0.45);
}

.start__actions {
  display: grid;
  gap: 16px;
  flex: 0 0 auto;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding-bottom: 4px;
}

.start__menu {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px 6px;
  justify-items: center;
}

/* Arena-Startseite */
.arena-intro {
  text-align: center;
}

.arena-intro__icon {
  font-size: 2.6rem;
  line-height: 1;
  margin-bottom: 2px;
}

/* =========================================================
   Weltkarte
   ========================================================= */
.screen--map {
  gap: 10px;
}

.map {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: var(--radius);
  /* Oben und unten laufen die Stationen weich aus, statt hart abgeschnitten
     zu werden. Ein halb sichtbarer Levelpunkt sieht dadurch gewollt aus. */
  -webkit-mask-image: linear-gradient(
    180deg,
    transparent 0,
    #000 54px,
    #000 calc(100% - 26px),
    transparent 100%
  );
  mask-image: linear-gradient(
    180deg,
    transparent 0,
    #000 54px,
    #000 calc(100% - 26px),
    transparent 100%
  );
  /* Beim Loslassen rastet die Karte sanft auf einer Station ein. */
  scroll-snap-type: y proximity;
}

.map .node {
  scroll-snap-align: center;
}

/* Die Flaeche, auf der die Levelpunkte liegen. Waechst automatisch mit,
   wenn in js/data/levels.js weitere Level dazukommen. */
.map__canvas {
  position: relative;
  width: 100%;
  /* --levels wird in js/screens/map.js gesetzt: je mehr Kämpfe, desto höher
     die Karte. Ab etwa acht Kämpfen wird sie scrollbar. */
  min-height: max(100%, calc(var(--levels, 3) * 92px));
}

/* Der Weg zwischen den Levelpunkten */
.map__path {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.map__path-line {
  fill: none;
  stroke: rgba(255, 255, 255, 0.55);
  stroke-width: 7;
  stroke-linecap: round;
  stroke-dasharray: 2 18;
}

/* Ein Levelpunkt */
.node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 4px;
  font: inherit;
  color: var(--text);
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

.node__circle {
  position: relative;
  width: 62px;
  height: 62px;
  display: grid;
  place-items: center;
  font-size: 1.5rem;
  font-weight: 700;
  border-radius: 50%;
  /* Goldener Ring statt weissem - das Abzeichen wirkt dadurch wertiger. */
  border: 3px solid var(--gold-1);
  background: linear-gradient(180deg, #9db1e0 0%, #6a7cb8 45%, #3f4c80 100%);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45),
    inset 0 -3px 0 rgba(8, 14, 40, 0.4),
    0 5px 0 rgba(12, 18, 48, 0.55), 0 10px 16px rgba(10, 16, 44, 0.45);
  transition: transform 0.1s ease;
}

/* Glanzlicht oben auf dem Abzeichen. */
.node__circle::after {
  content: '';
  position: absolute;
  top: 5px;
  left: 16%;
  width: 68%;
  height: 34%;
  border-radius: 50%;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.4), transparent);
  pointer-events: none;
}

.node.is-unlocked .node__circle {
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
  color: var(--text-dark);
}

.node.is-cleared .node__circle {
  background: linear-gradient(180deg, #bdf58a 0%, var(--green-1) 40%, var(--green-2) 100%);
  color: #0f2a08;
}

.node.is-boss .node__circle {
  width: 74px;
  height: 74px;
  font-size: 1.1rem;
  background: linear-gradient(180deg, #b06bd8, #6b2f9e);
  color: #fff;
}

.node:not(:disabled):active .node__circle {
  transform: translateY(4px);
}

.node:disabled {
  cursor: not-allowed;
}

/* Der naechste Kampf wippt und traegt einen goldenen Schein - so findet
   man ihn sofort, auch wenn die Karte lang ist. */
.node.is-current .node__circle {
  animation: bob 1.8s ease-in-out infinite, node-leuchten 2.2s ease-in-out infinite;
}

@keyframes node-leuchten {
  0%, 100% { box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), inset 0 -3px 0 rgba(8,14,40,0.4),
                         0 5px 0 rgba(12,18,48,0.55), 0 0 12px rgba(255, 197, 61, 0.35); }
  50%      { box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), inset 0 -3px 0 rgba(8,14,40,0.4),
                         0 5px 0 rgba(12,18,48,0.55), 0 0 24px rgba(255, 197, 61, 0.7); }
}

.node__label {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(12, 18, 48, 0.65);
  white-space: nowrap;
}

.node .stars {
  font-size: 0.72rem;
}

/* Kopfzeile der Welt über der Karte */
.map__header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

.map__world {
  flex: 1;
  min-width: 0;
  text-align: center;
  font-size: 0.95rem;
  font-weight: 600;
  text-shadow: 0 2px 0 rgba(12, 18, 48, 0.7);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.map__chip {
  flex: 0 0 auto;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  background: linear-gradient(180deg, #2f3f7d, #16204a);
  border: 2px solid var(--gold-2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 2px 6px rgba(8, 14, 40, 0.4);
}

/* Der gerade ausgewählte Kampf */
.node.is-selected .node__circle {
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.85), 0 5px 0 rgba(12, 18, 48, 0.5);
}

/* Infoleiste unten auf der Karte */
.map__footer {
  flex: 0 0 auto;
  display: grid;
  gap: 8px;
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
}

.map__buttons {
  display: flex;
  gap: 8px;
}

.map__buttons .btn--big {
  flex: 1;
}

.map__info {
  display: grid;
  gap: 2px;
  text-align: center;
  justify-items: center;
}

/* Vorschau des Gegners in der Infoleiste */
.map__info-sprite {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
}

.map__info-title {
  font-size: 1rem;
  font-weight: 600;
}

.map__info-text {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* =========================================================
   Kampfbildschirm
   ========================================================= */
.screen--battle {
  gap: 8px;
}

/* Die Kampffläche: hier stehen sich die beiden Monster gegenüber.
   Die Arena darin ist in der Höhe begrenzt (css/scenery.css) und wird
   mittig gesetzt - dadurch bleiben die Monster nah beieinander, egal wie
   hoch der Bildschirm ist. */
.battlefield {
  position: relative;
  flex: 1;
  min-height: 140px;
  display: grid;
  place-items: center;
}

.stage {
  position: absolute;
  display: grid;
  justify-items: center;
}

/* Der Horizont der Arena liegt bei 52 Prozent ihrer Höhe. Der Gegner steht
   knapp dahinter, der Spieler vorne - so entsteht die klassische
   diagonale Aufstellung, und beide bleiben dicht beieinander. */
.stage--enemy {
  bottom: 26%;
  right: 8%;
}

/* Die Figuren sind nach rechts gezeichnet. Der Gegner wird gespiegelt,
   damit sich beide anschauen. */
.stage--enemy .pixel-sprite {
  transform: scaleX(-1);
}

.stage--player {
  bottom: 1%;
  left: 8%;
}

/* Infozeile eines Kämpfers (Name, Lebenspunkte, Energie) */
.fighter-bar {
  position: relative;
  flex: 0 0 auto;
  display: grid;
  gap: 5px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, rgba(42, 58, 114, 0.94), rgba(17, 24, 58, 0.94));
  border: 2px solid var(--panel-border);
  box-shadow: var(--shadow-panel), inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

/* goldener Lichtstrich oben - dasselbe Muster wie bei .panel */
.fighter-bar::before {
  content: '';
  position: absolute;
  top: 0;
  left: 14%;
  right: 14%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 197, 61, 0.6), transparent);
}

.fighter-bar__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.fighter-bar__name {
  font-size: 0.95rem;
  font-weight: 600;
}

.fighter-bar__hp {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-dim);
  white-space: nowrap;
}

.fighter-bar__energie {
  display: flex;
  align-items: center;
  gap: 6px;
}

.fighter-bar__energie-label {
  font-size: 0.58rem;
  font-weight: 700;
  color: var(--danger);
}

.fighter-bar__energie .pips {
  flex: 1;
}

/* Schild-Anzeige, erscheint nur wenn ein Schild aktiv ist */
.shield-badge {
  display: none;
  align-items: center;
  gap: 4px;
  font-size: 0.72rem;
  font-weight: 600;
  color: #8fe3ff;
}

.shield-badge.is-active {
  display: flex;
}

.battle-log {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 2;
  text-align: center;
  padding: 0 12px;
  font-size: 0.88rem;
  font-weight: 500;
  text-shadow: 0 2px 4px rgba(12, 18, 48, 0.9);
}

/* Energieleiste des Spielers */
.wert-leiste {
  flex: 0 0 auto;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, rgba(42, 58, 114, 0.94), rgba(17, 24, 58, 0.94));
  border: 2px solid var(--panel-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

.wert-leiste__kopf {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 6px;
}

.wert-leiste__titel {
  font-size: 0.78rem;
  font-weight: 700;
  color: #6fd4ff;
  letter-spacing: 0.04em;
}

.wert-leiste__wert {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-dim);
}

/* Energiepunkte und der Kraft-Knopf stehen nebeneinander in einer Reihe. */
.wert-leiste__reihe {
  display: flex;
  align-items: center;
  gap: 12px;
}

.wert-leiste__reihe .pips {
  flex: 1;
  min-width: 0;
}

/* ---------- Boss-Kraft-Knopf ----------
   Rund, mit dem Symbol der Kraft. Der Ring aussenrum zeigt, wie voll die
   Kraft-Leiste ist (--kraft von 0 bis 1). Erst wenn sie voll ist, leuchtet
   der Knopf und lässt sich drücken. */
.kraft-knopf {
  position: relative;
  flex: 0 0 auto;
  width: 52px;
  height: 52px;
  padding: 0;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 38%, #2c3f83, #141f4d 78%);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 3px 8px rgba(8, 14, 40, 0.5);
  /* Solange nicht bereit: gedämpft. */
  filter: saturate(0.6) brightness(0.85);
  transition: filter 0.2s ease, transform 0.08s ease;
}

/* Der Ladering: goldener Bogen nach Füllstand, Rest dunkel. */
.kraft-knopf__ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(
    var(--fantasy-gold) calc(var(--kraft, 0) * 360deg),
    rgba(12, 18, 48, 0.65) 0
  );
  /* Nur den äußeren Rand als Ring zeigen (Mitte ausstanzen). */
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
}

.kraft-knopf__icon {
  font-size: 1.5rem;
  filter: drop-shadow(0 2px 3px rgba(8, 14, 40, 0.6));
}

/* Bereit: volle Farbe, goldener Schein, ruhiges Pulsieren. */
.kraft-knopf.is-bereit {
  filter: none;
  animation: kraft-bereit 1.3s ease-in-out infinite;
}

.kraft-knopf.is-bereit:active {
  transform: scale(0.92);
}

.kraft-knopf:disabled {
  cursor: default;
}

@keyframes kraft-bereit {
  0%, 100% { box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 8px rgba(255, 197, 61, 0.5); }
  50% { box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5), 0 0 18px rgba(255, 197, 61, 0.9); }
}

/* Eingefrorener Gegner (Boss-Kraft "Frostbann"): blau getönt, kein Wippen. */
.ist-gefroren {
  animation: none !important;
  filter: brightness(1.1) saturate(1.3)
    drop-shadow(0 0 10px rgba(140, 227, 255, 0.9)) hue-rotate(-12deg);
}

/* Betäubte Figur (Attacke "Frostschock"): gelb umflort, kein Wippen. */
.ist-betaeubt {
  animation: none !important;
  filter: brightness(1.15) saturate(1.2)
    drop-shadow(0 0 10px rgba(255, 224, 138, 0.9));
}

/* Warnleiste über der Spezialkraft eines Bosses: zeigt, wie nah sein
   großer Angriff ist. Läuft sie voll, glüht sie bedrohlich. */
.kraft-warnung {
  display: flex;
  align-items: center;
  gap: 6px;
}

.kraft-warnung__label {
  font-size: 0.56rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #ff9ad9;
  white-space: nowrap;
}

.kraft-warnung__bar {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.35);
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
}

.kraft-warnung__fill {
  width: 0;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #b14dff, #ff5ad0);
  transition: width 0.2s ease;
}

.kraft-warnung.is-voll .kraft-warnung__fill {
  animation: kraft-warnung-puls 0.7s ease-in-out infinite;
}

.kraft-warnung.is-voll .kraft-warnung__label {
  animation: kraft-warnung-puls 0.7s ease-in-out infinite;
}

@keyframes kraft-warnung-puls {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.6) drop-shadow(0 0 6px rgba(255, 90, 208, 0.9)); }
}

/* Die vier Handkarten */
.hand {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 4px;
}

/* =========================================================
   Unterseiten (Monster, Deck, Sammlung, Einstellungen)
   ========================================================= */
.screen--page {
  gap: 10px;
}

.page__content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: grid;
  gap: 10px;
  align-content: start;
  padding-bottom: 6px;
}

.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.88rem;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.stat-row:last-child {
  border-bottom: none;
}

.stat-row__label {
  color: var(--text-dim);
}

.stat-row__value {
  font-weight: 600;
}

/* Deckliste: Karte mit Name, Kosten und Wirkung */
.deck-list {
  display: grid;
  gap: 8px;
}

.deck-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 60%, #18224e 100%);
  border: 2px solid var(--panel-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 3px 0 rgba(8, 14, 40, 0.35);
}

/* Das Symbol sitzt auf einer runden Scheibe - wirkt wie ein Wappen */
.deck-item__icon {
  flex: 0 0 auto;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  font-size: 1.4rem;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #4a63bd, #1a2350 75%);
  border: 2px solid rgba(255, 197, 61, 0.55);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
}

.deck-item__body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 1px;
}

.deck-item__name {
  font-size: 0.92rem;
  font-weight: 600;
}

.deck-item__text {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px 6px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* Der antippbare Teil einer Deckzeile */
.deck-item__tap {
  font: inherit;
  color: var(--text);
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0;
  text-align: left;
  background: none;
  border: none;
  cursor: pointer;
}

.deck-item__tap:active {
  transform: translateY(2px);
}

.deck-item__level {
  /* nowrap, damit "Lv." und die Zahl nicht auf zwei Zeilen zerrissen werden. */
  white-space: nowrap;
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--text-dark);
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
}

.deck-item .btn {
  flex: 0 0 auto;
  min-width: 92px;
  line-height: 1.25;
}

.deck-item--button {
  font: inherit;
  color: var(--text);
  width: 100%;
  text-align: left;
  cursor: pointer;
}

.deck-item--button:not(:disabled):active {
  transform: translateY(2px);
}

.deck-item--button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.deck-item--button.is-current {
  border-color: var(--gold-2);
}

.deck-item__rarity {
  font-size: 0.62rem;
  font-weight: 700;
  text-transform: uppercase;
}

/* Auswahlliste beim Kartentausch */
.overlay__box--wide {
  max-width: 460px;
}

.swap-list {
  width: 100%;
  max-height: 46vh;
  overflow-y: auto;
  display: grid;
  gap: 6px;
  padding-right: 2px;
}

.deck-item__cost {
  min-width: 34px;
  height: 34px;
  padding: 0 8px;
  display: grid;
  place-items: center;
  font-size: 0.9rem;
  font-weight: 700;
  color: #06234a;
  border-radius: 999px;
  background: linear-gradient(180deg, #8fe3ff, #2ba7e0);
  border: 2px solid #0d1430;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55), 0 2px 4px rgba(8, 14, 40, 0.45);
}

/* Sammlung: Raster aus Monsterkacheln */
.collection {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.collection-item {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 14px 10px;
  text-align: center;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 60%, #18224e 100%);
  border: 2px solid var(--panel-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 3px 0 rgba(8, 14, 40, 0.35);
}

/* Heller Schimmer oben, damit die Kachel gewoelbt aussieht.
   Der Schimmer holt sich die Rundung selbst - die Kachel braucht deshalb
