.welt-teilchen--sand .welt-teilchen__stueck { width: 5px; height: 5px; border-radius: 50%; background: #f2d28c; }
.welt-teilchen--feder .welt-teilchen__stueck { width: 6px; height: 16px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; background: linear-gradient(90deg, #ffffff, #dfe8ff); }

  </style>
</head>

function neueNummer() {
  const zufall2 = globalThis.crypto;
  if (zufall2?.randomUUID) return zufall2.randomUUID();
  const bytes = new Uint8Array(16);
  if (zufall2?.getRandomValues) {
    zufall2.getRandomValues(bytes);
  } else {
    for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
  }
  bytes[6] = bytes[6] & 15 | 64;
  bytes[8] = bytes[8] & 63 | 128;
  const hex = [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("");

      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: CLOUD.schluessel,
        Authorization: `Bearer ${CLOUD.schluessel}`

      body: JSON.stringify(parameter),
      signal: abbruch.signal,
      keepalive: amEnde

var GLAETTUNG = 0.08;
function parallaxAktivieren(screen) {
  if (document.body.classList.contains("no-animations")) return () => {
  };
  if (window.matchMedia?.("(prefers-reduced-motion: reduce)").matches) return () => {
  };
  let zielX = 0;
  let zielY = 0;
  let istX = 0;
  let istY = 0;
  let laeuft = true;
  let rafId = null;
  function merken(event) {
    const b = screen.getBoundingClientRect();
    zielX = (event.clientX - b.left) / b.width * 2 - 1;
    zielY = (event.clientY - b.top) / b.height * 2 - 1;
  }
  function loslassen() {
    zielX = 0;
    zielY = 0;
  }
  function schritt() {
    if (!laeuft) return;
    istX += (zielX - istX) * GLAETTUNG;
    istY += (zielY - istY) * GLAETTUNG;
    screen.style.setProperty("--px", istX.toFixed(4));
    screen.style.setProperty("--py", istY.toFixed(4));
    rafId = requestAnimationFrame(schritt);
  }
  screen.addEventListener("pointermove", merken);
  screen.addEventListener("pointerdown", merken);
  screen.addEventListener("pointerup", loslassen);
  screen.addEventListener("pointerleave", loslassen);
  screen.addEventListener("pointercancel", loslassen);
  rafId = requestAnimationFrame(schritt);
  return () => {
    laeuft = false;
    if (rafId !== null) cancelAnimationFrame(rafId);
    screen.removeEventListener("pointermove", merken);
    screen.removeEventListener("pointerdown", merken);
    screen.removeEventListener("pointerup", loslassen);
    screen.removeEventListener("pointerleave", loslassen);
    screen.removeEventListener("pointercancel", loslassen);
  };
}

var parallaxAus = () => {
};
var START_EFFEKT = 240;
function funkenStreuen(knopf) {
  const anzahl = 10;
  for (let i = 0; i < anzahl; i++) {
    const winkel = Math.PI * 2 * i / anzahl;
    const weite = 34 + Math.random() * 22;
    const funke = document.createElement("span");
    funke.className = "startfunke";
    funke.style.left = `${20 + Math.random() * 60}%`;
    funke.style.top = "50%";
    funke.style.setProperty("--fx", `${Math.cos(winkel) * weite}px`);
    funke.style.setProperty("--fy", `${Math.sin(winkel) * weite}px`);
    knopf.appendChild(funke);
    setTimeout(() => funke.remove(), 520);
  }
}

function energiestrahl(vonEl, zuEl, farbe = "#8fd0ff") {
  if (!vonEl || !zuEl || !animationenAn()) return;
  const a = vonEl.getBoundingClientRect();
  const z = zuEl.getBoundingClientRect();
  const x1 = a.left + a.width * 0.55;
  const y1 = a.top + a.height * 0.42;
  const x2 = z.left + z.width * 0.5;
  const y2 = z.top + z.height * 0.5;
  const laenge = Math.hypot(x2 - x1, y2 - y1);
  const winkel = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  const strahl = document.createElement("span");
  strahl.className = "energiestrahl";
  strahl.style.setProperty("--strahl-farbe", farbe);
  Object.assign(strahl.style, {
    position: "fixed",
    left: `${x1}px`,
    top: `${y1}px`,
    width: `${laenge}px`,
    // Der rotate-Wert bleibt statisch - die Animation rührt transform nicht an.
    transform: `translateY(-50%) rotate(${winkel}deg)`,
    zIndex: "15",
    pointerEvents: "none"
  });

}

// js/core/deck.js
var HAND_SIZE = 4;
var DECK_SIZE = 8;
function shuffle(items) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}
function createDeck(cardIds, handSize = HAND_SIZE) {
  if (cardIds.length !== DECK_SIZE) {
    console.warn(
      `Deck hat ${cardIds.length} Karten statt ${DECK_SIZE}. Das Spiel läuft trotzdem, aber die Regel "genau 8 Attacken" ist verletzt.`
    );
  }
  let drawPile = shuffle(cardIds);
  let discardPile = [];
  const hand = [];
  function drawOne(platz = hand.length) {
    if (drawPile.length === 0) {
      if (discardPile.length === 0) return false;
      drawPile = shuffle(discardPile);
      discardPile = [];
    }
    hand.splice(platz, 0, drawPile.pop());
    return true;
  }
  function refill() {
    while (hand.length < handSize) {
      if (!drawOne()) break;
    }
  }
  function play(handIndex) {
    if (handIndex < 0 || handIndex >= hand.length) return null;
    const [cardId] = hand.splice(handIndex, 1);
    discardPile.push(cardId);
    drawOne(handIndex);
    refill();
    return cardId;
  }
  refill();
  return {
    hand,
    play,
    refill,
    get drawCount() {
      return drawPile.length;
    },
    get discardCount() {
      return discardPile.length;
    }
  };
}

// js/core/fighter.js
var MAX_ENERGIE = 10;
var ENERGIE_PRO_SEKUNDE = 1;
var START_ENERGIE = 3;
function createFighter(monster) {
  const deck = createDeck(monster.deck);
  const energieProSekunde = monster.energieProSekunde ?? ENERGIE_PRO_SEKUNDE;
  const state = {
    name: monster.name,
    icon: monster.icon,
    hp: monster.maxHp,
    maxHp: monster.maxHp,
    shield: 0,
    // fängt Schaden ab, bevor Lebenspunkte verloren gehen
    energie: START_ENERGIE,
    // ganze Energie, die ausgegeben werden kann
    energieFortschritt: 0,
    // 0..1 Fortschritt zum nächsten Energiepunkt (nur für die Anzeige)
    hand: deck.hand,
    // Array mit 4 Attacken-ids
    handVersion: 0,
    // zählt hoch, sobald sich die Hand ändert
    // Kampfwerte aus dem Charakterfortschritt (siehe js/core/progression.js)
    damageFactor: monster.damageFactor ?? 1,
    defense: monster.defense ?? 0,
    energieProSekunde
  };
  let genaueEnergie = START_ENERGIE;
  function syncXp() {
    genaueEnergie = Math.max(0, Math.min(MAX_ENERGIE, genaueEnergie));
    state.energie = Math.floor(genaueEnergie);
    state.energieFortschritt = state.energie >= MAX_ENERGIE ? 1 : genaueEnergie - state.energie;
  }
  function energieAufladen(seconds) {
    genaueEnergie += seconds * energieProSekunde;
    syncXp();
  }
  function canAfford(cost) {
    return cost <= state.energie;
  }
  function handAttacks() {
    return state.hand.map((id) => attackeMitLevel(getAttack(id)));
  }
  function useCard(handIndex) {
    const cardId = state.hand[handIndex];
    if (!cardId) return null;
    const attack = attackeMitLevel(getAttack(cardId));
    if (!canAfford(attack.cost)) return null;
    genaueEnergie -= attack.cost;
    syncXp();
    deck.play(handIndex);
    state.handVersion++;
    return attack;
  }
  function takeDamage(amount) {
    const absorbed = Math.min(state.shield, amount);
    state.shield -= absorbed;
    const rest = amount - absorbed;
    state.hp = Math.max(0, state.hp - rest);
    return { hp: rest, shield: absorbed };
  }
  function addShield(amount) {
    state.shield = Math.max(state.shield, amount);
  }
  function entferneSchild() {
    state.shield = 0;
  }
  function energieVoll() {
    genaueEnergie = MAX_ENERGIE;
    syncXp();
  }
  function energieLeeren() {
    genaueEnergie = 0;
    syncXp();
  }
  function heal(amount) {
    state.hp = Math.min(state.maxHp, state.hp + amount);
  }
  function missingHp() {
    return state.maxHp - state.hp;
  }
  return {
    state,
    energieAufladen,
    canAfford,
    handAttacks,
    useCard,
    takeDamage,
    addShield,
    entferneSchild,
    energieVoll,
    energieLeeren,
    heal,
    missingHp
  };
}

// js/core/battle.js
var DEFAULT_REACTION_TIME = 1;
var DEFAULT_PATIENCE = 2;
var KRIT_CHANCE = 0.12;
var KRIT_FAKTOR = 1.5;
function createBattle({
  playerMonster,
  enemyMonster,
  bossPower = null,
  enemyBossPower = null,
  onUpdate,
  onEvent,
  onEnd
}) {
  const player = createFighter(playerMonster);
  const enemy = createFighter(enemyMonster);
  const reactionTime = enemyMonster.reactionTime ?? DEFAULT_REACTION_TIME;
  const patience = enemyMonster.patience ?? DEFAULT_PATIENCE;
  const state = {
    player: player.state,
    enemy: enemy.state,
    bossPower,
    // die getragene Boss-Kraft (oder null) - der Spieler trägt sie
    enemyBossPower,
    // die Boss-Kraft des Gegners (nur bei Bossen gesetzt)
    kraft: 0,
    // 0..1: wie voll die Kraft-Leiste des Spielers ist
    kraftBereit: false,
    // true, sobald die Spieler-Kraft einsatzbereit ist
    gegnerKraft: 0,
    // 0..1: wie voll die Kraft-Leiste des Gegners ist
    playerFrozen: false,
    // true, solange der Spieler eingefroren ist (Boss-Kraft)
    running: false,
    pausiert: false,
    // true, solange der Spieler die Pause-Taste gedrückt hat
    finished: false,
    result: null,
    // 'win' | 'lose'
    zeit: 0,
    // gespielte Kampfzeit in Sekunden (ohne Pausen)
    // Kampfstatistik für das Ergebnisfenster. Sie zählt nur mit und hat
    // keinen Einfluss auf die Rechnung.
    statistik: { karten: 0, schaden: 0 }
  };
  const KRAFT_MAX = 16;
  let kraftPunkte = 0;
  const GEGNER_KRAFT_MAX = enemyBossPower?.gegnerLadung ?? 24;
  let gegnerKraftPunkte = 0;
  function ladeKraft(punkte) {
    if (!bossPower || state.finished) return;
    kraftPunkte = Math.min(KRAFT_MAX, kraftPunkte + punkte);
    state.kraft = kraftPunkte / KRAFT_MAX;
    state.kraftBereit = kraftPunkte >= KRAFT_MAX;
  }
  function gegnerKraftLaden(punkte) {
    if (!enemyBossPower || state.finished) return;
    gegnerKraftPunkte = Math.min(GEGNER_KRAFT_MAX, gegnerKraftPunkte + punkte);
    state.gegnerKraft = gegnerKraftPunkte / GEGNER_KRAFT_MAX;
  }
  const brand = { player: null, enemy: null };
  const frostRest = { player: 0, enemy: 0 };
  let thinkTimer = reactionTime;
  let sparenAb = null;
  let rafId = null;
  let lastTimestamp = 0;
  function emit(event) {
    if (onEvent) onEvent(event);
  }
  function schadenZaehlen(seite, menge) {
    if (seite === "player") state.statistik.schaden += menge;
  }
  function finish(result) {
    if (state.finished) return;
    state.finished = true;
    state.result = result;
    stop();
    if (onUpdate) onUpdate(state);
    emit({ type: "end", result });
    if (onEnd) onEnd(result);
  }
  function checkEnd() {
    if (state.enemy.hp <= 0) finish("win");
    else if (state.player.hp <= 0) finish("lose");
  }
  function schadenBerechnen(attacker, defender, roh) {
    const mitAngriff = roh * (attacker.state.damageFactor ?? 1);
    const nachAbwehr = mitAngriff * (1 - (defender.state.defense ?? 0));
    return Math.max(1, Math.round(nachAbwehr));
  }
  function useAttack(attacker, defender, attack, side) {
    if (attack.damage > 0) {
      let schaden = schadenBerechnen(attacker, defender, attack.damage);
      const krit = Math.random() < KRIT_CHANCE;
      if (krit) schaden = Math.round(schaden * KRIT_FAKTOR);
      const applied = defender.takeDamage(schaden);
      schadenZaehlen(side, schaden);
      if (side === "enemy") ladeKraft(2);
      if (side === "player") gegnerKraftLaden(2);
      emit({
        type: `${side}-attack`,
        attack,
        amount: schaden,
        krit,
        absorbed: applied.shield,
        // vom Schild abgefangener Anteil
        text: krit ? `Kritischer Treffer! ${attack.name}: ${schaden} Schaden!` : applied.shield > 0 ? `${attack.name}: ${schaden} Schaden - das Schild fängt ${applied.shield} ab!` : `${attacker.state.name} setzt ${attack.name} ein: ${schaden} Schaden!`
      });
    }
    if (attack.heal > 0) {
      attacker.heal(attack.heal);
      emit({
        type: `${side}-heal`,
        attack,
        amount: attack.heal,
        text: `${attacker.state.name} nutzt ${attack.name} und heilt ${attack.heal} LP.`
      });
    }
    if (attack.shield > 0) {
      attacker.addShield(attack.shield);
      emit({
        type: `${side}-shield`,
        attack,
        amount: attack.shield,
        text: `${attacker.state.name} stellt ein Schutzschild auf: ${attack.shield} Schaden werden abgefangen.`
      });
    }
    const zielSeite = side === "player" ? "enemy" : "player";
    if (attack.gift) {
      const intervall = attack.gift.intervall ?? 1;
      brand[zielSeite] = {
        rest: attack.gift.male,
        tick: attack.gift.tick,
        timer: intervall,
        intervall,
        angreifer: attacker,
        verteidiger: defender,
        typ: "gift"
      };
      emit({ type: "gift", seite: zielSeite, text: `${defender.state.name} ist vergiftet!` });
    }
    if (attack.stun) {
      frostRest[zielSeite] = attack.stun;
      if (zielSeite === "player") state.playerFrozen = true;
      emit({ type: "betaeubung", seite: zielSeite, dauer: attack.stun, text: `${defender.state.name} ist betäubt!` });
    }
    checkEnd();
  }
  function canPlay(handIndex) {
    const attack = player.handAttacks()[handIndex];
    if (!attack || state.finished || state.playerFrozen) return false;
    return player.canAfford(attack.cost);
  }
  function playCard(handIndex) {
    if (!state.running || state.finished || state.playerFrozen) return false;
    const attack = player.useCard(handIndex);
    if (!attack) return false;
    state.statistik.karten += 1;
    ladeKraft(attack.cost);
    useAttack(player, enemy, attack, "player");
    return true;
  }
  function kraftAnwenden(kraft, angreifer, verteidiger, seite) {
    const gegenseite = seite === "player" ? "enemy" : "player";
    emit({ type: "kraft", power: kraft, seite, text: `${angreifer.state.name} setzt ${kraft.name} ein!` });
    switch (kraft.art) {
      case "schild": {
        const menge = Math.round(angreifer.state.maxHp * kraft.wert);
        angreifer.addShield(menge);
        emit({ type: `${seite}-shield`, amount: menge, kraft: true, text: `${kraft.name}: Schild ${menge}.` });
        break;
      }
      case "schildbruch": {
        verteidiger.entferneSchild();
        const dmg = schadenBerechnen(angreifer, verteidiger, kraft.wert);
        verteidiger.takeDamage(dmg);
        schadenZaehlen(seite, dmg);
        emit({ type: `${seite}-attack`, amount: dmg, kraft: true, text: `${kraft.name} zerschlägt das Schild: ${dmg} Schaden!` });
        break;
      }
      case "lebensraub": {
        const dmg = schadenBerechnen(angreifer, verteidiger, kraft.wert);
        verteidiger.takeDamage(dmg);
        schadenZaehlen(seite, dmg);
        angreifer.heal(dmg);
        emit({ type: `${seite}-attack`, amount: dmg, kraft: true, text: `${kraft.name}: ${dmg} Schaden - und ${dmg} LP zurück!` });
        emit({ type: `${seite}-heal`, amount: dmg });
        break;
      }
      case "energiesturm": {
        angreifer.energieVoll();
        const dmg = schadenBerechnen(angreifer, verteidiger, kraft.wert);
        verteidiger.takeDamage(dmg);
        schadenZaehlen(seite, dmg);
        emit({ type: `${seite}-attack`, amount: dmg, kraft: true, text: `${kraft.name}: volle Energie und ${dmg} Schaden!` });
        break;
      }
      case "energieraub": {
        const dmg = schadenBerechnen(angreifer, verteidiger, kraft.wert);
        verteidiger.takeDamage(dmg);
        schadenZaehlen(seite, dmg);
        verteidiger.energieLeeren();
        emit({ type: `${seite}-attack`, amount: dmg, kraft: true, text: `${kraft.name}: ${dmg} Schaden - und die ganze Energie entladen!` });
        break;
      }
      case "brand": {
        const sofort = schadenBerechnen(angreifer, verteidiger, kraft.wert.sofort);
        verteidiger.takeDamage(sofort);
        schadenZaehlen(seite, sofort);
        emit({ type: `${seite}-attack`, amount: sofort, kraft: true, text: `${kraft.name}: ${sofort} Schaden - Feuer!` });
        brand[gegenseite] = { rest: kraft.wert.male, tick: kraft.wert.tick, timer: 0.6, intervall: 0.6, angreifer, verteidiger, typ: "brand" };
        break;
      }
      case "frost": {
        frostRest[gegenseite] = kraft.wert;
        if (gegenseite === "player") state.playerFrozen = true;
        emit({ type: "frost", seite: gegenseite, dauer: kraft.wert, text: `${kraft.name}: ${verteidiger.state.name} ist eingefroren!` });
        break;
      }
      default:
        break;
    }
    checkEnd();
  }
  function useBossPower() {
    if (!state.running || state.finished) return false;
    if (!bossPower || kraftPunkte < KRAFT_MAX) return false;
    kraftPunkte = 0;
    state.kraft = 0;
    state.kraftBereit = false;
    kraftAnwenden(bossPower, player, enemy, "player");
    return true;
  }
  function valueOf(attack) {
    const usefulHeal = Math.min(attack.heal ?? 0, enemy.missingHp());
    const inDanger = state.enemy.hp < state.enemy.maxHp * 0.5;
    const usefulShield = inDanger ? attack.shield ?? 0 : 0;
    return attack.damage + usefulHeal + usefulShield;
  }
  function chooseCard() {
    const hand = enemy.handAttacks();
    let bestIndex = -1;
    let bestValue = -1;
    hand.forEach((attack, index) => {
      if (!enemy.canAfford(attack.cost)) return;
      const value = valueOf(attack);
      if (value > bestValue) {
        bestValue = value;
        bestIndex = index;
      }
    });
    const startEnergie = sparenAb ?? state.enemy.energie;
    const worthWaiting = hand.some(
      (attack) => !enemy.canAfford(attack.cost) && attack.cost <= startEnergie + patience && valueOf(attack) > bestValue
    );
    if (worthWaiting) {
      if (sparenAb === null) sparenAb = state.enemy.energie;
      return -1;
    }
    sparenAb = null;
    return bestIndex;
  }
  function enemyTurn() {
    if (enemyBossPower && gegnerKraftPunkte >= GEGNER_KRAFT_MAX && !state.finished) {
      gegnerKraftPunkte = 0;
      state.gegnerKraft = 0;
      kraftAnwenden(enemyBossPower, enemy, player, "enemy");
      return;
    }
    const handIndex = chooseCard();
    if (handIndex < 0) return;
    const attack = enemy.useCard(handIndex);
    if (!attack) return;
    gegnerKraftLaden(attack.cost);
    useAttack(enemy, player, attack, "enemy");
  }
  function tick(deltaSeconds) {
    state.zeit += deltaSeconds;
    if (frostRest.player > 0) {
      frostRest.player = Math.max(0, frostRest.player - deltaSeconds);
      if (frostRest.player === 0) state.playerFrozen = false;
    } else {
      player.energieAufladen(deltaSeconds);
    }
    if (frostRest.enemy > 0) {
      frostRest.enemy = Math.max(0, frostRest.enemy - deltaSeconds);
    } else {
      enemy.energieAufladen(deltaSeconds);
      thinkTimer -= deltaSeconds;
      if (thinkTimer <= 0 && !state.finished) {
        thinkTimer = reactionTime;
        enemyTurn();
      }
    }
    for (const seite of ["player", "enemy"]) {
      const b = brand[seite];
      if (!b || state.finished) continue;
      b.timer -= deltaSeconds;
      while (b.timer <= 0 && b.rest > 0 && !state.finished) {
        const dmg = schadenBerechnen(b.angreifer, b.verteidiger, b.tick);
        b.verteidiger.takeDamage(dmg);
        schadenZaehlen(seite === "enemy" ? "player" : "enemy", dmg);
        const gift = b.typ === "gift";
        emit({
          type: gift ? "gift" : "brand",
          seite,
          amount: dmg,
          text: `${b.verteidiger.state.name} ${gift ? "erleidet Gift" : "brennt"}: ${dmg} Schaden.`
        });
        b.rest -= 1;
        b.timer += b.intervall ?? 0.6;
        checkEnd();
      }
      if (b.rest <= 0) brand[seite] = null;
    }
  }
  function loop(timestamp) {
    if (!state.running) return;
    const deltaSeconds = lastTimestamp ? (timestamp - lastTimestamp) / 1e3 : 0;
    lastTimestamp = timestamp;
    tick(Math.min(deltaSeconds, 0.1));
    if (onUpdate) onUpdate(state);
    if (state.running) {
      rafId = requestAnimationFrame(loop);
    }
  }
  function start() {
    if (state.running || state.finished) return;
    state.running = true;
    state.pausiert = false;
    lastTimestamp = 0;
    rafId = requestAnimationFrame(loop);
  }
  function stop() {
    state.running = false;
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }
  function pause() {
    if (!state.running || state.finished) return false;
    stop();
    state.pausiert = true;
    return true;
  }
  function resume() {
    if (!state.pausiert || state.finished) return false;
    start();
    return true;
  }
  return { state, start, stop, pause, resume, playCard, canPlay, useBossPower };
}

var NORMALE = Object.values(ENEMIES).filter((e) => !e.isBoss);
var BOSSE = Object.values(ENEMIES).filter((e) => e.isBoss);
function istBossRunde(runde) {
  return runde % 5 === 0;
}
function arenaGegner(runde) {
  const boss = istBossRunde(runde);
  const pool = boss ? BOSSE : NORMALE;
  const basis = pool[(runde - 1) % pool.length];
  const skala = 1 + (runde - 1) * 0.16;
  const grundHp = boss ? 130 : 60;
  return {
    ...basis,
    id: `arena-${basis.id}-${runde}`,
    name: basis.name,
    maxHp: Math.round(grundHp * skala * (boss ? 1.5 : 1)),
    damageFactor: (basis.damageFactor ?? 1) * (1 + (runde - 1) * 0.045),
    defense: basis.defense ?? 0,
    reactionTime: Math.max(0.45, 0.95 - runde * 0.015),
    patience: 2,
    variante: null,
    isBoss: boss,
    worldId: basis.worldId
  };
}
function arenaLevel(runde) {
  const gegner = arenaGegner(runde);
  const welt = getWorld(gegner.worldId) ?? getWorld(1);
  return {
    id: `arena-${runde}`,
    arena: true,
    runde,
    worldId: gegner.worldId,
    number: runde,
    name: gegner.name,
    enemyId: gegner.id,
    isBoss: gegner.isBoss,
    scenery: welt.scenery,
    music: welt.music,
    gegner
    // den fertigen Gegner gleich mitliefern
  };
}

// js/core/loot.js
function zwischen(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}
function zufall(liste) {
  return liste[Math.floor(Math.random() * liste.length)];
}
function wuerfleSeltenheit(chancen) {
  const summe = Object.values(chancen).reduce((a, b) => a + b, 0);
  let wurf = Math.random() * summe;
  for (const [seltenheit, chance] of Object.entries(chancen)) {
    wurf -= chance;
    if (wurf <= 0) return seltenheit;
  }
  return "gewoehnlich";
}
function ziehe(seltenheit) {
  const attacken = BEUTE_ATTACKEN.filter(
    (a) => a.seltenheit === seltenheit && !besitztAttacke(a.id)
  );
  const skins = SKINS.filter((s) => s.seltenheit === seltenheit && !besitztSkin(s.id));
  const topf = [
    { art: "muenzen", gewicht: 35 },
    { art: "material", gewicht: 30 },
    ...attacken.length ? [{ art: "attacke", gewicht: 22 }] : [],
    ...skins.length ? [{ art: "skin", gewicht: 16 }] : []
  ];
  const summe = topf.reduce((a, b) => a + b.gewicht, 0);
  let wurf = Math.random() * summe;
  let art = "muenzen";
  for (const eintrag of topf) {
    wurf -= eintrag.gewicht;
    if (wurf <= 0) {
      art = eintrag.art;
      break;
    }
  }
  if (art === "attacke") {
    const attacke = zufall(attacken);
    return { art: "attacke", seltenheit, id: attacke.id, name: attacke.name, icon: attacke.icon };
  }
  if (art === "skin") {
    const skin = zufall(skins);
    return { art: "skin", seltenheit, id: skin.id, name: `Skin: ${skin.name}`, icon: "🎨", skin };
  }
  if (art === "material") {
    const menge2 = zwischen(...MATERIAL_BEUTE[seltenheit]);
    return { art: "material", seltenheit, menge: menge2, name: `${menge2} Material`, icon: "💠" };
  }
  const menge = zwischen(...MUENZ_BEUTE[seltenheit]);
  return { art: "muenzen", seltenheit, menge, name: `${menge} Münzen`, icon: MUENZE };
}
function mischen(liste) {
  const kopie2 = [...liste];
  for (let i = kopie2.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [kopie2[i], kopie2[j]] = [kopie2[j], kopie2[i]];
  }
  return kopie2;
}
function truheOeffnen(truhe) {
  const stuecke = [];
  for (let i = 0; i < truhe.anzahl; i++) {
    const seltenheit = i === 0 && truhe.garantie ? truhe.garantie : wuerfleSeltenheit(truhe.chancen);
    stuecke.push(ziehe(seltenheit));
  }
  return mischen(stuecke);
}

    function statistikHtml(result) {
      const st = battle.state.statistik;
      const sekunden = Math.round(battle.state.zeit);
      const dauer = `${Math.floor(sekunden / 60)}:${String(sekunden % 60).padStart(2, "0")}`;
      return `
        <div class="kampf-statistik" aria-label="Kampfstatistik">
          <span class="kampf-statistik__feld"><span class="kampf-statistik__icon">🃏</span><strong>${st.karten}</strong><small>Karten</small></span>
          <span class="kampf-statistik__feld"><span class="kampf-statistik__icon">💥</span><strong>${st.schaden}</strong><small>Schaden</small></span>
          <span class="kampf-statistik__feld"><span class="kampf-statistik__icon">⏱️</span><strong>${dauer}</strong><small>Dauer</small></span>
          <span class="kampf-statistik__feld"><span class="kampf-statistik__icon">${result === "win" ? "🏆" : "💤"}</span><strong>${result === "win" ? "Sieg" : "K.O."}</strong><small>Ergebnis</small></span>
        </div>
      `;
    }
    function fuelleBelohnung(behaelter, stuecke) {
      stuecke.forEach((stueck2, index) => {
        const seltenheit = SELTENHEITEN[stueck2.seltenheit] ?? SELTENHEITEN.gewoehnlich;
        const feld2 = document.createElement("div");
        feld2.className = "loot-item";
        feld2.style.setProperty("--rarity", seltenheit.farbe);
        feld2.style.animationDelay = `${index * 0.09}s`;
        klangTimer.push(
          setTimeout(() => {
            if (stueck2.art === "muenzen") spieleKlang("muenze");
            else spieleBeute(stueck2.seltenheit);
          }, 250 + index * 90)
        );
        feld2.innerHTML = `
          <span class="loot-item__icon">${stueck2.icon}</span>
          <span class="loot-item__name">${stueck2.name}</span>
        `;
        behaelter.appendChild(feld2);
      });
    }
    function verlassen() {
      showScreen(level.arena ? "arena" : "map", level.arena ? {} : { worldId: level.worldId });
    }
    screen.querySelector("#btn-flee").addEventListener("click", verlassen);
    const pauseKnopf = screen.querySelector("#btn-pause");
    let pauseOverlay = null;
    function pausieren() {
      if (!battle || pauseOverlay || !battle.pause()) return;
      spieleKlang("tipp");
      screen.classList.add("ist-pausiert");
      pauseOverlay = document.createElement("div");
      pauseOverlay.className = "overlay overlay--pause";
      pauseOverlay.innerHTML = `
        <div class="overlay__box">
          <div class="overlay__icon">⏸</div>
          <h3 class="overlay__title">Pause</h3>
          <p class="overlay__text">Der Kampf ist angehalten. Energie und Gegner warten auf dich.</p>
          <div class="overlay__actions">
            <button class="btn btn--big btn--green" id="btn-weiter" type="button">▶&nbsp;Fortsetzen</button>
            <button class="btn btn--ghost" id="btn-raus" type="button">${level.arena ? "Zur Arena" : "Zur Weltkarte"}</button>
          </div>
        </div>
      `;
      pauseOverlay.querySelector("#btn-weiter").addEventListener("click", fortsetzen);
      pauseOverlay.querySelector("#btn-raus").addEventListener("click", verlassen);
      screen.appendChild(pauseOverlay);
    }
    function fortsetzen() {
      if (!pauseOverlay) return;
      pauseOverlay.remove();
      pauseOverlay = null;
      screen.classList.remove("ist-pausiert");
      battle?.resume();
    }
    pauseKnopf.addEventListener("click", pausieren);
    const beiSichtwechsel = () => {
      if (document.hidden) pausieren();
    };
    document.addEventListener("visibilitychange", beiSichtwechsel);
    aufraeumen.push(() => document.removeEventListener("visibilitychange", beiSichtwechsel));
    function losLegen() {
      if (!battle) return;
      battle.start();
      pauseKnopf.disabled = false;
    }
    root.appendChild(screen);
    render(battle.state);
    const introAbbrechen = spieleKampfIntro(screen, {
      gegner: enemyMonster,
      sprite: ui.enemySprite,
      fertig: () => {
        if (!hinweisGesehen("kampf")) {
          zeigeKampfTutorial(screen, () => {
            merkeHinweis("kampf");
            losLegen();
          });
        } else {
          losLegen();
        }
      }
    });
    aufraeumen.push(introAbbrechen);
  },
  /** Wichtig: die Spielschleife stoppen, wenn der Bildschirm verlassen wird. */
  unmount() {
    if (battle) {
      battle.stop();
      battle = null;
    }
    if (resultTimer !== null) {
      clearTimeout(resultTimer);
      resultTimer = null;
    }
    klangTimer.forEach((timer) => clearTimeout(timer));
    klangTimer.length = 0;
    if (handSperreTimer !== null) {
      clearTimeout(handSperreTimer);
      handSperreTimer = null;
    }
    bildfolgeStoppen();
    bildfolgeStoppen = () => {
    };
    aufraeumen.forEach((fn) => fn());
    aufraeumen = [];
  }
};

// js/core/sortierung.js
var SORTIERUNGEN = [
  { id: "deck", label: "Deck" },
  { id: "name", label: "A–Z" },
  { id: "kosten-auf", label: "Kosten ↑" },
  { id: "kosten-ab", label: "Kosten ↓" },
  { id: "schaden-auf", label: "Schaden ↑" },
  { id: "schaden-ab", label: "Schaden ↓" }
];
var nachName = (a, b) => a.name.localeCompare(b.name, "de");
function sortiereAttacken(eintraege, art, attackeVon = (e) => e) {
  const liste = [...eintraege];
  const vergleiche = {
    name: (a, b) => nachName(a, b),
    "kosten-auf": (a, b) => a.cost - b.cost || nachName(a, b),
    "kosten-ab": (a, b) => b.cost - a.cost || nachName(a, b),
    "schaden-auf": (a, b) => schadenVergleich(a, b, 1),
    "schaden-ab": (a, b) => schadenVergleich(a, b, -1)
  }[art];
  if (!vergleiche) return liste;
  return liste.sort((x, y) => vergleiche(attackeVon(x), attackeVon(y)));
}
function schadenVergleich(a, b, richtung) {
  const aSchaden = (a.damage ?? 0) > 0;
  const bSchaden = (b.damage ?? 0) > 0;
  if (aSchaden !== bSchaden) return aSchaden ? -1 : 1;
  if (!aSchaden) return a.cost - b.cost || nachName(a, b);
  return richtung * (a.damage - b.damage) || a.cost - b.cost || nachName(a, b);
}

var deckScreen = {
  mount(root) {
    const monster = getMonster(getAktiveFigur());
    const screen = document.createElement("div");
    screen.className = "screen screen--page";
    screen.appendChild(createScenery({ dimmed: true }));
    screen.appendChild(createTopbar("Dein Deck", () => showScreen("start")));

    content.className = "page__content";

    zeichnen();
    function zeichnen() {
      const deck = getDeck(monster);
      content.innerHTML = "";
      const intro = document.createElement("div");
      intro.className = "panel panel--tight";
      intro.innerHTML = `
        <p class="map__info-text">
          Genau ${deck.length} Attacken, im Kampf ${HAND_SIZE} auf der Hand.
          <strong>Antippen</strong> zum Tauschen, <strong>Aufwerten</strong> macht
          eine Attacke stärker - die Energiekosten bleiben gleich.
          <br>${MUENZE} ${gameState.coins} · 💠 ${gameState.materials}
        </p>
      `;
      content.appendChild(intro);
      content.appendChild(sortierLeiste());
      const liste = document.createElement("div");
      liste.className = "deck-list";
      const eintraege = deck.map((attackId, platz) => ({ attackId, platz, attacke: attackeMitLevel(getAttack(attackId)) }));
      sortiereAttacken(eintraege, sortierung(), (e) => e.attacke).forEach(({ attackId, platz }) => {
        liste.appendChild(deckZeile(attackId, platz, deck));
      });
      content.appendChild(liste);
      const ersatz = verfuegbareAttacken().filter((a) => !deck.includes(a.id));
      const info = document.createElement("div");
      info.className = "panel panel--tight";
      info.innerHTML = `
        <p class="map__info-text">
          Auf der Ersatzbank: <strong>${ersatz.length}</strong> Attacke${ersatz.length === 1 ? "" : "n"}.
          Neue Attacken findest du in Truhen im Shop.
        </p>
      `;
      content.appendChild(info);
    }
    function sortierung() {
      const id = gameState.settings.deckSortierung;
      return SORTIERUNGEN.some((s) => s.id === id) ? id : "deck";
    }
    function sortierLeiste() {
      const leiste = document.createElement("div");
      leiste.className = "sortier-leiste";
      leiste.setAttribute("role", "group");
      leiste.setAttribute("aria-label", "Karten sortieren");
      SORTIERUNGEN.forEach(({ id, label }) => {
        const knopf = document.createElement("button");
        knopf.type = "button";
        knopf.className = `sortier-knopf${id === sortierung() ? " is-active" : ""}`;
        knopf.textContent = label;
        knopf.setAttribute("aria-pressed", String(id === sortierung()));
        knopf.addEventListener("click", () => {
          if (id === sortierung()) return;
          setSetting("deckSortierung", id);
          zeichnen();
        });
        leiste.appendChild(knopf);
      });
      return leiste;
    }
    function deckZeile(attackId, platz, deck) {
      const attacke = attackeMitLevel(getAttack(attackId));
      const level = getAttackenLevel(attackId);
      const voll = level >= MAX_ATTACKEN_LEVEL;
      const kosten = attackenKosten(level);
      const bezahlbar = !voll && gameState.coins >= kosten.muenzen && gameState.materials >= kosten.material;
      const zeile2 = document.createElement("div");
      zeile2.className = "deck-item";
      const info = document.createElement("button");
      info.type = "button";
      info.className = "deck-item__tap";
      info.innerHTML = inhaltFuer(attacke, level);
      info.addEventListener("click", () => tauschDialog(platz, deck));
      zeile2.appendChild(info);
      const knopf = document.createElement("button");
      knopf.type = "button";
      knopf.className = `btn btn--small${bezahlbar ? "" : " btn--ghost"}`;
      knopf.disabled = voll || !bezahlbar;
      knopf.innerHTML = voll ? "Max." : `${MUENZE} ${kosten.muenzen}<br><span class="upgrade-row__mat">💠 ${kosten.material}</span>`;
      knopf.addEventListener("click", () => {
        if (attackeAufwerten(attackId)) {
          spieleKlang("kauf");
          zeichnen();
        } else {
          spieleKlang("gesperrt");
        }
      });
      zeile2.appendChild(knopf);
      return zeile2;
    }
    function verfuegbareAttacken() {
      const grund = monster.deck.map(getAttack);
      const ausTruhen = BEUTE_ATTACKEN.filter((a) => besitztAttacke(a.id)).map(
        (a) => getAttack(a.id)
      );
      return [...grund, ...ausTruhen];
    }
    function tauschDialog(platz, deck) {
      const auswahl = sortiereAttacken(verfuegbareAttacken(), sortierung(), (a) => attackeMitLevel(a));
      const overlay = document.createElement("div");
      overlay.className = "overlay";
      overlay.innerHTML = `
        <div class="overlay__box overlay__box--wide">
          <h3 class="overlay__title">Platz ${platz + 1} belegen</h3>
          <p class="overlay__text">Wähle die Attacke für diesen Deckplatz.</p>
          <div class="swap-list" id="swap"></div>
          <div class="overlay__actions">
            <button class="btn btn--ghost" id="btn-cancel" type="button">Abbrechen</button>
          </div>
        </div>
      `;
      const liste = overlay.querySelector("#swap");
      auswahl.forEach((roh) => {
        const attacke = attackeMitLevel(roh);
        const imDeck = deck.includes(attacke.id);
        const aktuell = deck[platz] === attacke.id;
        const knopf = document.createElement("button");
        knopf.type = "button";
        knopf.className = `deck-item deck-item--button${aktuell ? " is-current" : ""}`;
        knopf.disabled = imDeck && !aktuell;
        knopf.innerHTML = inhaltFuer(
          attacke,
          getAttackenLevel(attacke.id),
          imDeck && !aktuell ? "bereits im Deck" : null
        );
        knopf.addEventListener("click", () => {
          const neu = [...deck];
          neu[platz] = attacke.id;
          setDeck(monster.id, neu);
          overlay.remove();
          zeichnen();
        });
        liste.appendChild(knopf);
      });
      overlay.querySelector("#btn-cancel").addEventListener("click", () => overlay.remove());
      screen.appendChild(overlay);
    }

var STATUS_TEXT = {

function spielstandBlock() {
  const block = document.createElement("div");

  const zustand = document.createElement("p");
  zustand.className = "setting-row__hint";

  block.appendChild(zustand);
  if (!cloudAktiv()) {
    zustand.textContent = STATUS_TEXT.aus;
    const hinweis = document.createElement("p");
    hinweis.className = "setting-row__hint";
    hinweis.style.marginTop = "6px";

  }
  abmelden = cloudBeobachten((status2) => {
    zustand.textContent = STATUS_TEXT[status2] ?? status2;
  });
  const raus = document.createElement("div");
  raus.className = "setting-row";
  raus.innerHTML = `
    <span class="setting-row__label">
      <span class="setting-row__name">Auf ein anderes Gerät</span>
      <span class="setting-row__hint" id="code-anzeige">Code erstellen und dort eingeben.</span>
    </span>
  `;
  const codeKnopf = document.createElement("button");
  codeKnopf.type = "button";
  codeKnopf.className = "btn btn--small";
  codeKnopf.textContent = "Code";
  codeKnopf.addEventListener("click", async () => {
    const anzeige = raus.querySelector("#code-anzeige");
    codeKnopf.disabled = true;
    anzeige.textContent = "Wird erstellt …";
    try {
      const code = await cloudCodeErstellen();
      anzeige.innerHTML = `<strong class="spielstand-code">${code}</strong> · 30 Minuten gültig`;
    } catch (fehler) {
      console.warn("Code konnte nicht erstellt werden:", fehler);
      anzeige.textContent = "Hat nicht geklappt. Später noch einmal versuchen.";
    } finally {
      codeKnopf.disabled = false;
    }
  });
  raus.appendChild(codeKnopf);
  block.appendChild(raus);
  const rein = document.createElement("div");
  rein.className = "setting-row setting-row--breit";
  rein.innerHTML = `
    <span class="setting-row__label">
      <span class="setting-row__name">Von einem anderen Gerät</span>
      <span class="setting-row__hint" id="hol-befund">Code vom anderen Gerät eintippen.</span>
    </span>
  `;
  const feld2 = document.createElement("input");
  feld2.type = "text";
  feld2.className = "eingabe eingabe--code";
  feld2.maxLength = 8;
  feld2.placeholder = "ABCD2345";
  feld2.autocapitalize = "characters";
  feld2.autocomplete = "off";
  feld2.spellcheck = false;
  feld2.setAttribute("aria-label", "Übertragungscode");
  const holKnopf = document.createElement("button");
  holKnopf.type = "button";
  holKnopf.className = "btn btn--small btn--green";
  holKnopf.textContent = "Holen";
  holKnopf.addEventListener("click", async () => {
    const befund = rein.querySelector("#hol-befund");
    const code = feld2.value.trim().toUpperCase();
    if (code.length !== 8) {
      befund.textContent = "Der Code hat genau 8 Zeichen.";
      return;
    }
    holKnopf.disabled = true;
    befund.textContent = "Wird geholt …";
    try {
      const ergebnis = await cloudCodeEinloesen(code);
      if (!ergebnis) {
        befund.textContent = "Der Code stimmt nicht oder ist abgelaufen.";
        return;
      }
      spielstandUebernehmenVonCode(ergebnis);
      showScreen("start");
    } catch (fehler) {
      console.warn("Spielstand konnte nicht geholt werden:", fehler);
      befund.textContent = "Hat nicht geklappt. Später noch einmal versuchen.";
    } finally {
      holKnopf.disabled = false;
    }
  });
  const gruppe2 = document.createElement("span");
  gruppe2.className = "eingabe-gruppe";
  gruppe2.append(feld2, holKnopf);
  rein.appendChild(gruppe2);
  block.appendChild(rein);
  const warnung = document.createElement("p");
  warnung.className = "setting-row__hint";
  warnung.style.marginTop = "8px";
  warnung.textContent = "Achtung: Der geholte Spielstand ersetzt den Stand auf diesem Gerät.";
  block.appendChild(warnung);
  return block;
}
function befundText(status2) {
  if (!status2.moeglich) return "Dieser Browser kann keinen Ton abspielen.";
  if (!status2.klaengeAn) return "Die Klänge sind oben ausgeschaltet.";
  if (!status2.aufgebaut) return "Der Ton ist noch nicht gestartet. Tippe noch einmal.";
  if (status2.zustand !== "running") {
    return `Der Ton ist angehalten (${status2.zustand}). Tippe noch einmal.`;
  }
  return "Der Ton läuft. Hörst du nichts, prüfe die Lautstärke und den Stummschalter: Kontrollzentrum öffnen und das Glockensymbol ausschalten.";
}

function zeigeErfolgToast(erfolge) {

function chancenText(truhe) {
  const teile = Object.entries(truhe.chancen).filter(([, chance]) => chance > 0).map(([id, chance]) => {
    const seltenheit = SELTENHEITEN[id];
    return `<span style="color:${seltenheit.farbe}">${seltenheit.name} ${chance}%</span>`;
  });
  const garantie = truhe.garantie ? ` · garantiert ${SELTENHEITEN[truhe.garantie].name}` : "";
  return teile.join(" · ") + garantie;
}
function oeffnungZeigen(screen, truhe) {
  const stuecke = truheOeffnen(truhe);
  const timer = [];
  fortschrittMelden("truhe");
  const overlay = document.createElement("div");
  overlay.className = "overlay overlay--chest";
  overlay.innerHTML = `
    <div class="chest-open">
      <div class="chest-open__chest" id="chest">${truhe.icon}</div>
      <div class="chest-open__title" id="chest-title">${truhe.name} wird geöffnet…</div>
      <div class="loot-grid" id="loot"></div>
      <button class="btn btn--big btn--green chest-open__done" id="btn-done" type="button" hidden>
        Alles einsammeln
      </button>
    </div>
  `;
  screen.appendChild(overlay);
  const chest = overlay.querySelector("#chest");
  const titel = overlay.querySelector("#chest-title");
  const gitter = overlay.querySelector("#loot");
  const fertig = overlay.querySelector("#btn-done");
  stuecke.forEach(() => {
    const feld2 = document.createElement("div");
    feld2.className = "loot-item is-hidden";
    feld2.innerHTML = '<span class="loot-item__icon">?</span>';
    gitter.appendChild(feld2);
  });
  chest.classList.add("is-shaking");
  timer.push(
    setTimeout(() => {
      chest.classList.remove("is-shaking");
      chest.classList.add("is-open");
      titel.textContent = "Du erhältst:";
      spieleKlang("truhe");
      stuecke.forEach((stueck2, index) => {
        timer.push(setTimeout(() => aufdecken(gitter, stueck2, index), index * AUFDECK_TAKT));
      });
      timer.push(
        setTimeout(() => {
          fertig.hidden = false;
        }, stuecke.length * AUFDECK_TAKT)
      );
    }, 850)
  );
  fertig.addEventListener("click", () => {
    timer.forEach(clearTimeout);
    spritesNeuZeichnen();

    const neueErfolge = pruefeNeueErfolge();
    if (neueErfolge.length) {

      zeigeErfolgToast(neueErfolge);
    }
    showScreen("shop");
