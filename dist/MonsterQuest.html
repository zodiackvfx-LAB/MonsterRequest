   kein overflow:hidden (das wuerde sie im Raster schrumpfen lassen). */
.collection-item::before {
  content: '';
  position: absolute;
  inset: 0 0 auto 0;
  height: 42%;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent);
  pointer-events: none;
}

.collection-item.is-locked {
  opacity: 0.55;
}

/* runder Lichtfleck hinter der Figur - als Hintergrund, damit
   die Figur selbst immer davor liegt */
.collection-item__sprite {
  position: relative;
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  font-size: 2rem;
  background: radial-gradient(circle, rgba(109, 146, 255, 0.34), transparent 68%);
}

.collection-item.is-locked .collection-item__sprite {
  filter: grayscale(1) brightness(0.4);
}

.collection-item__name {
  font-size: 0.85rem;
  font-weight: 600;
}

.collection-item__note {
  font-size: 0.7rem;
  color: var(--text-dim);
}

/* Einstellungen */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
}

.setting-row__label {
  display: grid;
  gap: 2px;
}

.setting-row__name {
  font-size: 0.92rem;
  font-weight: 600;
}

.setting-row__hint {
  font-size: 0.72rem;
  color: var(--text-dim);
}

/* Schalter zum Ein- und Ausschalten */
.switch {
  position: relative;
  width: 58px;
  height: 32px;
  flex: 0 0 auto;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  background: #101838;
  border: 2px solid var(--panel-border);
  transition: background 0.15s ease;
}

.switch::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #8ea3d6;
  transition: transform 0.15s ease, background 0.15s ease;
}

.switch.is-on {
  background: var(--green-2);
}

.switch.is-on::after {
  transform: translateX(26px);
  background: #fff;
}

/* Schwierigkeitswahl: drei Knöpfe nebeneinander */
.grad-wahl {
  display: flex;
  gap: 6px;
  width: 100%;
  margin-top: 4px;
}

.grad-knopf {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 9px 4px;
  border: 2px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #232e62, #18224e);
  color: var(--text-dim);
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.grad-knopf__icon {
  font-size: 1rem;
}

.grad-knopf.is-active {
  border-color: var(--gold-2);
  color: var(--text);
  background: linear-gradient(180deg, #3d4f97, #232e5e);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 10px rgba(255, 197, 61, 0.22);
}

.grad-knopf:not(.is-active):active {
  transform: translateY(2px);
}

/* =========================================================
   Anpassungen an die Bildschirmgroesse
   ========================================================= */

/* Breitere Geraete: vier Karten nebeneinander */
@media (min-width: 480px) {
  .hand {
    grid-template-columns: repeat(4, 1fr);
  }

  .card {
    min-height: 112px;
  }

  .collection {
    grid-template-columns: repeat(3, 1fr);
  }
}

/* ---------------------------------------------------------------
   Große Bildschirme (iPad): Das Spiel füllt den ganzen Schirm,
   deshalb wächst hier alles mit - sonst wirkt die Bedienung verloren.
   Die Schriftgröße wird an der Wurzel erhöht; weil fast alles in rem
   gerechnet ist, skaliert der Text damit automatisch mit.
   --------------------------------------------------------------- */
@media (min-width: 700px) {
  html {
    font-size: 19px;
  }

  .screen {
    padding: calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom)) 20px;
    gap: 12px;
  }

  .logo {
    max-width: 440px;
  }

  .card {
    min-height: 150px;
  }

  .card__icon {
    font-size: 2.3rem;
  }

  .card__cost {
    min-width: 36px;
    height: 36px;
    top: -14px;
    left: -10px;
  }

  .icon-btn__circle {
    width: 68px;
    height: 68px;
    font-size: 1.9rem;
  }

  .btn--big {
    min-height: 70px;
  }

  .node__circle {
    width: 78px;
    height: 78px;
  }

  .node.is-boss .node__circle {
    width: 92px;
    height: 92px;
  }

  .platform {
    width: 150px;
    height: 28px;
  }

  :root {
    --sprite: 132px;
    --sprite-large: 190px;
  }

  .arena {
    max-height: 440px;
  }

  .overlay__box {
    max-width: 440px;
  }

  .page__content {
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }
}

/* Viel Hoehe: groessere Monster */
@media (min-height: 760px) {
  :root {
    --sprite: 118px;
    --sprite-large: 168px;
  }

  .sprite--large {
    font-size: 8rem;
  }
}

/* Niedrige Displays (iPhone SE): alles kompakter, damit die vier
   Handkarten sicher auf den Bildschirm passen. */
@media (max-height: 700px) {
  .screen {
    padding: calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom)) 10px;
    gap: 6px;
  }

  :root {
    --sprite: 64px;
    --sprite-large: 100px;
  }

  .fighter-bar {
    padding: 7px 10px;
  }

  .battlefield {
    min-height: 110px;
  }

  .arena {
    max-height: 210px;
  }

  /* Kleine Displays: alle Tannen zusammen kleiner - eine Variable genügt */
  .arena__tree { --h: 52px; }
  .arena__treeline--fern .arena__tree:nth-child(2n) { --h: 42px; }
  .arena__treeline--fern .arena__tree:nth-child(3n) { --h: 58px; }
  .arena__treeline--fern .arena__tree:nth-child(5n) { --h: 36px; }
  .arena__treeline--nah .arena__tree:nth-child(1) { --h: 82px; margin-bottom: -18px; }
  .arena__treeline--nah .arena__tree:nth-child(2) { --h: 64px; margin-bottom: -8px; }
  .arena__treeline--nah .arena__tree:nth-child(3) { --h: 74px; margin-bottom: -14px; }

  .platform {
    width: 80px;
    height: 16px;
  }

  .logo {
    max-width: 250px;
  }

  .battle-log {
    font-size: 0.8rem;
  }

  .card {
    min-height: 74px;
    padding: 9px 5px 7px;
  }

  .card__icon {
    font-size: 1.3rem;
  }

  .card__name {
    font-size: 0.74rem;
  }

  .card__effect {
    font-size: 0.66rem;
  }

  .btn--big {
    min-height: 52px;
    font-size: 1.1rem;
  }

  .icon-btn__circle {
    width: 48px;
    height: 48px;
    font-size: 1.3rem;
  }

  .node__circle {
    width: 54px;
    height: 54px;
  }
}

/* =========================================================
   Weltauswahl
   ========================================================= */

/* Karten-Liste: jede Zeile so hoch wie ihr Inhalt. Sonst macht das Grid
   alle Zeilen gleich hoch (an der kuerzesten), und hoehere Karten - etwa
   fertige Welten mit dem zusaetzlichen "Geschafft"-Chip - werden oben und
   unten abgeschnitten. */
.page__content--cards {
  grid-auto-rows: min-content;
}

.world-card {
  position: relative;
  font: inherit;
  color: var(--text);
  display: flex;
  align-items: stretch;
  gap: 12px;
  width: 100%;
  padding: 0;
  overflow: hidden;
  text-align: left;
  cursor: pointer;
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 55%, #16204a 100%);
  border: 2px solid var(--panel-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel), inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

/* schraeger Lichtstreifen wie auf einer Sammelkarte */
.world-card::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(118deg, transparent 40%, rgba(255, 255, 255, 0.08) 50%, transparent 60%);
}

.world-card:not(:disabled):active {
  transform: translateY(3px);
}

.world-card.is-locked {
  cursor: not-allowed;
  filter: grayscale(0.7) brightness(0.75);
}

/* freigespielte Welten bekommen einen goldenen Rand */
.world-card:not(.is-locked) {
  border-color: var(--gold-2);
}

/* Kleine Vorschau der Weltfarben - nutzt dieselben Variablen wie die Kulisse */
.world-card__art {
  position: relative;
  flex: 0 0 96px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--s-sky-top), var(--s-sky-bottom));
  border-right: 2px solid rgba(8, 14, 40, 0.5);
}

/* weiche Abdunklung zum Text hin, damit die Kante nicht hart wirkt */
.world-card__art::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 55%, rgba(12, 18, 48, 0.45) 100%);
}

.world-card__hill {
  position: absolute;
  left: -20%;
  right: -20%;
  bottom: -30%;
  height: 70%;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  background: linear-gradient(180deg, var(--s-grass-light), var(--s-grass-dark));
}

.world-card__icon {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  font-size: 2.2rem;
  filter: drop-shadow(0 4px 4px rgba(10, 20, 40, 0.4));
}

.world-card__body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 4px;
  /* Von oben nach unten lesen - und falls der Platz doch einmal knapp wird,
     bleibt wenigstens der Welt-Titel stehen statt mittig wegzurutschen. */
  align-content: start;
  padding: 12px 12px 12px 0;
}

.world-card__name {
  font-size: 0.95rem;
  font-weight: 600;
}

.world-card__text {
  font-size: 0.75rem;
  color: var(--text-dim);
}

.world-card__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.world-card__chip {
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 600;
  background: rgba(12, 18, 48, 0.62);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.world-card__chip--done {
  background: linear-gradient(180deg, var(--green-2), var(--green-3));
  border-color: rgba(255, 255, 255, 0.3);
}

/* Zähler in einer Panel-Überschrift, z. B. "4/12" */
.panel__count {
  float: right;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-dim);
}

/* Hinweis im Ergebnisfenster, wenn eine neue Welt aufgeht */
.overlay__unlock {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  line-height: 1.4;
  background: rgba(255, 190, 60, 0.16);
  border: 2px solid var(--gold-2);
}

/* Bosse in der Sammlung hervorheben */
.collection-item.is-boss {
  border-color: var(--gold-2);
}

/* =========================================================
   Shop und Truhen
   ========================================================= */
.chest-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: var(--radius);
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 58%, #16204a 100%);
  border: 2px solid var(--gold-2);
  box-shadow: var(--shadow-panel), inset 0 1px 0 rgba(255, 255, 255, 0.16);
}

/* schraeger Glanz - Truhen sollen wertvoll aussehen */
.chest-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(118deg, transparent 40%, rgba(255, 220, 140, 0.1) 50%, transparent 60%);
}

.chest-card__icon {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  font-size: 2.1rem;
  border-radius: var(--radius-sm);
  background: radial-gradient(circle at 50% 38%, rgba(255, 197, 61, 0.28), rgba(12, 18, 48, 0.65) 70%);
  border: 2px solid rgba(255, 197, 61, 0.45);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.45);
}

.chest-card__body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 2px;
}

.chest-card__name {
  font-size: 0.95rem;
  font-weight: 600;
}

.chest-card__text,
.chest-card__odds {
  font-size: 0.72rem;
  color: var(--text-dim);
  line-height: 1.35;
}

.chest-card__buy {
  flex: 0 0 auto;
}

/* ---------- Truhe öffnen ---------- */
.overlay--chest {
  align-items: center;
}

.chest-open {
  width: 100%;
  max-width: 460px;
  display: grid;
  justify-items: center;
  gap: 12px;
}

.chest-open__chest {
  font-size: 4.6rem;
  filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.5));
}

.chest-open__chest.is-shaking {
  animation: chest-shake 0.35s ease-in-out infinite;
}

.chest-open__chest.is-open {
  animation: chest-pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
}

.chest-open__title {
  font-size: 1.05rem;
  font-weight: 600;
  text-shadow: 0 2px 0 rgba(12, 18, 48, 0.8);
}

.loot-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  width: 100%;
}

.loot-item {
  --rarity: var(--panel-border);
  display: grid;
  justify-items: center;
  gap: 2px;
  min-height: 92px;
  padding: 8px 4px;
  text-align: center;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #2f4185 0%, var(--panel-solid) 60%, #18224e 100%);
  border: 2px solid var(--rarity);
  box-shadow: 0 0 14px -2px var(--rarity), inset 0 1px 0 rgba(255, 255, 255, 0.16);
  animation: loot-reveal 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
}

.loot-item.is-hidden {
  opacity: 0.35;
  border-style: dashed;
  box-shadow: none;
  animation: none;
  align-content: center;
}

.loot-item__icon {
  font-size: 1.6rem;
  line-height: 1;
}

.loot-item__name {
  font-size: 0.62rem;
  font-weight: 600;
  line-height: 1.2;
}

.loot-item__rarity {
  font-size: 0.56rem;
  font-weight: 700;
  color: var(--rarity);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.chest-open__done {
  margin-top: 6px;
}

@keyframes chest-shake {
  0%, 100% { transform: rotate(-6deg); }
  50% { transform: rotate(6deg); }
}

@keyframes chest-pop {
  0% { transform: scale(1); }
  45% { transform: scale(1.35) translateY(-10px); }
  100% { transform: scale(1.12); }
}

@keyframes loot-reveal {
  from { transform: scale(0.4) rotate(-8deg); opacity: 0; }
  to { transform: scale(1) rotate(0); opacity: 1; }
}

/* Auf schmalen Bildschirmen zwei Reihen statt einer sehr engen */
@media (max-width: 420px) {
  .loot-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .loot-item {
    min-height: 84px;
  }
}

/* Steckbrief oben im Monster-Bildschirm.
   Der Lichtkegel liegt als zweite Hintergrundschicht ueber dem Panel-
   Verlauf - so bleibt die Figur immer davor. */
.monster-head {
  display: grid;
  justify-items: center;
  gap: 6px;
  text-align: center;
  background:
    radial-gradient(circle at 50% 32%, rgba(120, 158, 255, 0.34), transparent 58%),
    linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 55%, #16204a 100%);
}

/* Die Figur bekommt einen weichen Schatten nach unten */
.monster-head .pixel-sprite {
  filter: drop-shadow(0 8px 10px rgba(8, 14, 40, 0.55));
}

.monster-head__name {
  font-size: 1.2rem;
  font-weight: 600;
  text-shadow: 0 2px 0 rgba(8, 14, 40, 0.5), 0 0 14px rgba(255, 197, 61, 0.28);
}

/* Eine Zeile im Aufwertungs-Block */
.upgrade-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.upgrade-row:last-child {
  border-bottom: none;
}

.upgrade-row__label {
  display: grid;
  gap: 2px;
}

.upgrade-row__name {
  font-size: 0.9rem;
  font-weight: 600;
}

.upgrade-row__hint {
  font-size: 0.72rem;
  color: var(--text-dim);
}

.upgrade-row__mat {
  font-size: 0.68rem;
  opacity: 0.85;
}

.upgrade-row .btn {
  flex: 0 0 auto;
  min-width: 96px;
  line-height: 1.25;
}

/* Skin-Auswahl im Monster-Bildschirm */
.skin-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 8px;
}

.skin-chip {
  --rarity: var(--panel-border);
  font: inherit;
  color: var(--text);
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 8px 4px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #2f4185 0%, var(--panel-solid) 60%, #18224e 100%);
  border: 2px solid var(--rarity);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

.skin-chip.is-active {
  box-shadow: 0 0 0 3px var(--gold-2), 0 0 14px -2px var(--rarity);
}

.skin-chip.is-locked {
  opacity: 0.45;
  cursor: not-allowed;
}

.skin-chip__vorschau {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
}

.skin-chip__name {
  font-size: 0.68rem;
  font-weight: 600;
}

/* =========================================================
   Reiter (Sammlung)
   ========================================================= */

/* Figur-Auswahl über den Reitern (Deine Figur) */
.figur-wahl {
  display: flex;
  gap: 8px;
  padding: 0 var(--gap) 8px;
}

.figur-chip {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  font: inherit;
  text-align: left;
  border: 2px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #232e62, #18224e);
  color: var(--text-dim);
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.figur-chip.is-active {
  border-color: var(--gold-2);
  color: var(--text);
  background: linear-gradient(180deg, #3d4f97, #232e5e);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 10px rgba(255, 197, 61, 0.22);
}

.figur-chip.is-locked {
  opacity: 0.65;
  cursor: default;
}

.figur-chip__sprite {
  width: 38px;
  height: 38px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.figur-chip__sprite .pixel-sprite {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.figur-chip__text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.figur-chip__name {
  font-weight: 700;
  font-size: 0.9rem;
}

.figur-chip__hint {
  font-size: 0.66rem;
  color: var(--text-dim);
}

.tabs {
  display: flex;
  gap: 8px;
  padding: 0 var(--gap) 10px;
  /* Passen mehr Reiter nicht nebeneinander (z. B. fünf in der Sammlung),
     lässt sich die Leiste seitlich schieben, statt dass etwas abgeschnitten
     wird oder die Seite überbreit wird. Passen sie, füllen sie die Breite. */
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  position: relative;
  font: inherit;
  /* wachsen, um die Breite zu füllen, aber nie unter die eigene Textbreite
     schrumpfen - sonst würde der Reiter-Text abgeschnitten. */
  flex: 1 0 auto;
  padding: 10px 6px;
  border: 2px solid var(--panel-border);
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #232e62, #18224e);
  color: var(--text-dim);
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.tab.is-active {
  border-color: var(--gold-2);
  color: var(--text);
  background: linear-gradient(180deg, #3d4f97, #232e5e);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 10px rgba(255, 197, 61, 0.22);
}

/* goldener Strich unter dem aktiven Reiter */
.tab.is-active::after {
  content: '';
  position: absolute;
  left: 22%;
  right: 22%;
  bottom: 4px;
  height: 2px;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--gold-1), transparent);
}

.tab:not(.is-active):active {
  transform: translateY(2px);
}

/* =========================================================
   Katalog-Zeilen (Attacken in der Sammlung)
   ========================================================= */

.katalog {
  display: grid;
  gap: 8px;
}

.katalog-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 60%, #18224e 100%);
  /* Der farbige Streifen links zeigt die Seltenheit. */
  border: 2px solid var(--panel-border);
  border-left: 6px solid var(--seltenheit, var(--panel-border));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 3px 0 rgba(8, 14, 40, 0.3);
}

.katalog-item.is-locked {
  opacity: 0.5;
  border-left-color: var(--panel-border);
}

.katalog-item__icon {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  font-size: 1.25rem;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #445bb0, #182048 75%);
  border: 2px solid rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
}

.katalog-item.is-locked .katalog-item__icon {
  filter: grayscale(1) brightness(0.6);
}

.katalog-item__body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 1px;
}

.katalog-item__name {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 2px 0;
  font-size: 0.88rem;
  font-weight: 600;
}

.katalog-item__text {
  font-size: 0.74rem;
  color: var(--text-dim);
}

.katalog-item__rarity {
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--seltenheit, var(--text-dim));
}

.katalog-item.is-locked .katalog-item__rarity {
  color: var(--text-dim);
}

/* Der Energiepreis rechts - gleiche Optik wie die Zahl auf der Kampfkarte. */
.katalog-item__cost {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  border: 2px solid rgba(12, 18, 48, 0.6);
  background: linear-gradient(180deg, #6fd4ff, #2f9ae0);
  color: var(--text-dark);
  font-size: 0.82rem;
  font-weight: 700;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.5), 0 2px 4px rgba(8, 14, 40, 0.4);
}

.katalog-item.is-locked .katalog-item__cost {
  background: linear-gradient(180deg, #5c6a9c, #3d4874);
  color: var(--text-dim);
}

/* Der getragene Skin bekommt einen goldenen Rahmen. */
.collection-item.is-active {
  border-color: var(--gold-2);
  box-shadow: 0 0 0 2px rgba(255, 197, 61, 0.28);
}

/* =========================================================
   Belohnungen im Siegesfenster
   ========================================================= */

.belohnung {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px;
  width: 100%;
  margin: 2px 0 4px;
}

.belohnung .loot-item {
  /* Schmaler als im Shop: hier stehen bis zu sechs Felder nebeneinander. */
  min-height: 0;
  width: 76px;
  padding: 8px 4px;
  /* backwards: vor dem eigenen Einsatz unsichtbar bleiben, sonst blitzen
     alle Felder kurz auf, bevor die Verzoegerung greift. */
  animation-fill-mode: backwards;
}

.belohnung .loot-item__name {
  font-size: 0.6rem;
}

@media (max-height: 700px) {
  .belohnung .loot-item {
    width: 66px;
    padding: 6px 3px;
  }

  .belohnung .loot-item__icon {
    font-size: 1.3rem;
  }
}

/* =========================================================
   Tagesaufgaben
   ========================================================= */

/* Banner auf dem Startbildschirm */
.tagesbanner {
  font: inherit;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 2px solid rgba(255, 197, 61, 0.4);
  /* Goldene Kante nur links - ein Akzent, keine Flaeche. */
  border-left: 5px solid var(--fantasy-gold);
  background: linear-gradient(180deg, #2a3c7d 0%, var(--fantasy-tief) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 5px 14px rgba(10, 16, 44, 0.4);
  text-align: left;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}

.tagesbanner:active {
  transform: translateY(2px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 2px 6px rgba(10, 16, 44, 0.4);
}

/* Liegt eine Belohnung bereit, faellt das Banner auf. */
.tagesbanner.is-ready {
  border-color: var(--gold-2);
  animation: bar-warnung-gold 1.4s ease-in-out infinite;
}

@keyframes bar-warnung-gold {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 197, 61, 0); }
  50% { box-shadow: 0 0 12px 2px rgba(255, 197, 61, 0.5); }
}

.tagesbanner__icon {
  font-size: 1.5rem;
}

.tagesbanner__body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 1px;
}

.tagesbanner__title {
  font-size: 0.9rem;
  font-weight: 600;
}

.tagesbanner__text {
  font-size: 0.72rem;
  color: var(--text-dim);
}

.tagesbanner.is-ready .tagesbanner__text {
  color: var(--gold-2);
  font-weight: 600;
}

.tagesbanner__punkt {
  flex: 0 0 auto;
  min-width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  padding: 0 7px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
  color: var(--text-dark);
  font-size: 0.8rem;
  font-weight: 700;
}

.tagesbanner__pfeil {
  color: var(--text-dim);
  font-size: 1.2rem;
}

/* Eine Zeile im Aufgabenbildschirm */
.aufgabe {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--panel-border);
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 60%, #18224e 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 3px 0 rgba(8, 14, 40, 0.3);
}

/* erledigte Aufgaben bekommen einen gruenen Rand statt nur blasser zu werden */
.aufgabe.is-done {
  border-color: var(--green-2);
}

.aufgabe + .aufgabe {
  margin-top: 8px;
}

.aufgabe.is-done {
  opacity: 0.6;
}

.aufgabe__icon {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  font-size: 1.25rem;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #445bb0, #182048 75%);
  border: 2px solid rgba(255, 197, 61, 0.4);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
}

.aufgabe__body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 3px;
}

.aufgabe__name {
  font-size: 0.88rem;
  font-weight: 600;
}

.aufgabe__text {
  font-size: 0.72rem;
  color: var(--text-dim);
}

.aufgabe__stand {
  font-size: 0.68rem;
  color: var(--text-dim);
}

/* Schmalerer Balken als im Kampf. */
.bar--schmal {
  height: 9px;
}

.aufgabe__lohn {
  flex: 0 0 auto;
  min-width: 84px;
  line-height: 1.25;
  text-align: center;
}

/* =========================================================
   Niedrige Bildschirme im Hochformat
   =========================================================
   Wenn Safari die Adressleiste einblendet, bleiben von einem iPhone SE nur
   rund 553 Pixel Hoehe uebrig. Kopfzeile, Schriftzug und die Knoepfe
   brauchen davon fast alles - fuer die Figur bliebe ein Streifen von 20
   Pixeln. Deshalb wird hier ueberall etwas Platz abgezwackt, damit die
   Figur wieder ordentlich gross wird. Nichts verschwindet, alles behaelt
   seinen Platz.
   ========================================================= */
@media (orientation: portrait) and (max-height: 700px) {
  .start__logo {
    margin-top: 2px;
  }

  .screen--start .logo {
    max-width: 190px;
  }

  .screen--start .logo__claim {
    margin-top: 2px;
    font-size: 0.74rem;
  }

  .start__hero {
    gap: 8px;
  }

  .start__hero-name {
    padding: 4px 12px;
    font-size: 0.78rem;
  }

  .start__actions {
    gap: 9px;
  }

  .tagesbanner {
    padding: 8px 12px;
  }

  .start__menu {
    gap: 6px;
  }

  .screen--start .icon-btn__circle {
    width: 44px;
    height: 44px;
    font-size: 1.2rem;
  }

  .screen--start .icon-btn__label {
    font-size: 0.56rem;
  }
}

/* =========================================================
   Querformat auf dem Handy
   =========================================================
   Gedreht bleiben nur rund 390 Pixel Hoehe - untereinander passt der
   Startbildschirm da nicht mehr hin. Statt alles zu schrumpfen, nutzen wir
   die Breite: links Logo und Monster, rechts die Knoepfe.
   ========================================================= */
@media (orientation: landscape) and (max-height: 560px) {
  .screen--start {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto 1fr;
    align-items: center;
    column-gap: 18px;
    row-gap: 4px;
  }

  /* Die Spielerleiste laeuft ueber beide Spalten. */
  .screen--start .hud {
    grid-area: 1 / 1 / 2 / 3;
  }

  .screen--start .start__logo {
    grid-area: 2 / 1 / 3 / 2;
    margin-top: 0;
    align-self: end;
  }

  .screen--start .start__hero {
    grid-area: 3 / 1 / 4 / 2;
    /* min-height: 0 liesse den Bereich auf null zusammenfallen - die Figur
       wuerde dann ueber das Logo laufen. */
    min-height: 90px;
    align-content: start;
    gap: 8px;
  }

  .screen--start .start__actions {
    grid-area: 2 / 2 / 4 / 3;
    align-self: center;
    padding-bottom: 0;
    gap: 10px;
  }

  /* Alle sechs Menuepunkte in eine Reihe - spart eine ganze Zeile Hoehe. */
  .screen--start .start__menu {
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }

  .logo {
    max-width: 210px;
  }

  .logo__claim {
    font-size: 0.72rem;
  }

  :root {
    --sprite-large: 84px;
  }

  .start__hero-name {
    font-size: 0.72rem;
    padding: 3px 12px;
  }

  .tagesbanner {
    padding: 7px 12px;
  }

  .tagesbanner__icon {
    font-size: 1.2rem;
  }

  .btn--big {
    min-height: 46px;
    font-size: 1rem;
  }

  .icon-btn__circle {
    width: 42px;
    height: 42px;
    font-size: 1.1rem;
  }

  .icon-btn__label {
    font-size: 0.5rem;
  }

  /* Unterseiten: weniger Luft, damit der Inhalt nicht wegscrollt. */
  .page__content {
    gap: 8px;
  }

  /* ---- Kampf ----
     Gedreht muss die ganze Kampfanzeige in rund 390 Pixel Hoehe passen:
     Kopfzeile, zwei Kaempferleisten, die Arena, die Energieleiste und vier
     Karten. Deshalb ist hier alles eine Nummer kleiner. Die Karten stehen
     ohnehin schon nebeneinander, weil der Bildschirm breit genug ist. */
  .screen--battle {
    gap: 5px;
  }

  .fighter-bar {
    padding: 5px 10px;
    gap: 3px;
  }

  .fighter-bar__name {
    font-size: 0.82rem;
  }

  .fighter-bar__hp {
    font-size: 0.72rem;
  }

  .bar {
    height: 11px;
  }

  .pip {
    height: 9px;
  }

  .battlefield {
    min-height: 60px;
  }

  .arena {
    max-height: 124px;
  }

  .battle-log {
    font-size: 0.74rem;
  }

  .wert-leiste {
    padding: 5px 10px;
  }

  .wert-leiste__kopf {
    margin-bottom: 4px;
  }

  .hand {
    margin-top: 2px;
  }

  .card {
    min-height: 58px;
    padding: 5px 4px 4px;
  }

  .card__icon {
    font-size: 1.05rem;
  }

  .card__name {
    font-size: 0.66rem;
  }

  .card__effect {
    font-size: 0.6rem;
  }

  :root {
    --sprite: 54px;
  }

  /* Die Baeume der Arena mit verkleinern, sonst ragen sie oben heraus. */
  .arena__tree { --h: 40px; }
  .arena__treeline--fern .arena__tree:nth-child(2n) { --h: 32px; }
  .arena__treeline--fern .arena__tree:nth-child(3n) { --h: 44px; }
  .arena__treeline--fern .arena__tree:nth-child(5n) { --h: 28px; }
  .arena__treeline--nah .arena__tree:nth-child(1) { --h: 60px; margin-bottom: -12px; }
  .arena__treeline--nah .arena__tree:nth-child(2) { --h: 48px; margin-bottom: -6px; }
  .arena__treeline--nah .arena__tree:nth-child(3) { --h: 54px; margin-bottom: -10px; }

  .platform {
    width: 64px;
    height: 13px;
  }

  /* ---- Fenster (Sieg, Niederlage, Nachfragen) ----
     Hochkant stehen die Knoepfe untereinander. Gedreht wuerde das Fenster
     dadurch hoeher als der Bildschirm und man muesste darin scrollen, um
     "Weiter" zu erreichen. Also breiter statt hoeher. */
  .overlay__box {
    max-width: 520px;
    gap: 6px;
    padding: 14px 18px;
  }

  .overlay__icon {
    font-size: 2rem;
  }

  .overlay__title {
    font-size: 1.15rem;
  }

  .overlay__text {
    font-size: 0.8rem;
  }

  .overlay__actions {
    grid-template-columns: repeat(2, 1fr);
    margin-top: 2px;
  }

  /* Der Hauptknopf steht links, damit er unter dem Daumen liegt. */
  .overlay__actions .btn--big {
    min-height: 44px;
    font-size: 0.95rem;
  }

  .belohnung .loot-item {
    width: 62px;
    min-height: 0;
    padding: 5px 3px;
  }

  .belohnung .loot-item__icon {
    font-size: 1.1rem;
  }

  .overlay__unlock {
    font-size: 0.78rem;
    padding: 5px 8px;
  }
}

/* Ein zu hohes Fenster darf nie ueber den Rand laufen - lieber scrollen.
   Betrifft vor allem das Siegesfenster im Querformat. */
.overlay__box {
  max-height: calc(100% - 16px);
  overflow-y: auto;
}

/* =========================================================
   Timo in der Lobby
   =========================================================
   Der Charakter ist das Zentrum: ein sauberer Schatten setzt ihn auf den
   Boden, ein warmer Schimmer hebt ihn vom Himmel ab, und er atmet ruhig.
   ========================================================= */

.hero-buehne {
  position: relative;
  height: 100%;
  min-height: 0;
  display: grid;
  place-items: end center;
}

/* Die Figur nimmt die Hoehe der Buehne an - hoechstens aber ihre
   vorgesehene Groesse. Das Seitenverhaeltnis bleibt gleich (5:7), damit
   sie beim Schrumpfen nicht gestaucht wird. */
.hero-buehne .sprite {
  height: 100%;
  /* min-height: 0 ist noetig: Ein Rasterfeld ist von sich aus mindestens so
     gross wie sein Inhalt - ohne diese Zeile wuerde die Figur die Buehne
     wieder auseinanderdruecken. */
  min-height: 0;
  min-width: 0;
  max-height: calc(var(--sprite-large, 150px) * 1.4);
  width: auto;
  max-width: 100%;
  aspect-ratio: 5 / 7;
}

/* Der Schatten liegt unter den Fuessen und ist bewusst weich - ein harter
   Schatten wuerde die Pixelkanten der Figur stoeren. */
.hero-schatten {
  position: absolute;
  bottom: -4px;
  left: 50%;
  width: 62%;
  height: 16px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(22, 48, 20, 0.42) 0 45%, rgba(22, 48, 20, 0) 72%);
  animation: schatten-atmen 4.2s ease-in-out infinite;
}

/* Die Figur atmet: eine sehr kleine Hebung, viel ruhiger als das Wippen
   im Kampf. Der Schatten wird dabei minimal kleiner - das verbindet beide. */
.hero-atmen {
  animation: atmen 4.2s ease-in-out infinite;
  /* Warmer Schimmer von der Sonne oben rechts plus ein weicher Bodenschatten. */
  filter: drop-shadow(-1px -1px 0 rgba(255, 244, 214, 0.5))
    drop-shadow(0 0 7px rgba(255, 240, 200, 0.28))
    drop-shadow(0 6px 6px rgba(14, 32, 56, 0.35));
}

@keyframes atmen {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}

@keyframes schatten-atmen {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
  50%      { transform: translateX(-50%) scale(0.93); opacity: 0.85; }
}

/* =========================================================
   Tiefeneffekt der Lobby
   =========================================================
   --px und --py kommen aus js/ui/parallax.js und laufen von -1 bis +1.
   Je weiter vorn eine Ebene liegt, desto weiter wandert sie. Die Zahlen
   sind bewusst klein - es soll Tiefe entstehen, kein Wackeln.

   Der Charakter bewegt sich NICHT mit. Er ist der ruhende Punkt, an dem
   sich das Auge festhaelt. */
.screen--start .scenery__sky,
.screen--start .scenery__strahlen {
  transform: translate(calc(var(--px, 0) * 3px), calc(var(--py, 0) * 2px));
}

.screen--start .scenery__mountains--fern {
  transform: translate(calc(var(--px, 0) * 5px), calc(var(--py, 0) * 3px));
}

.screen--start .scenery__mountains {
  transform: translate(calc(var(--px, 0) * 9px), calc(var(--py, 0) * 4px));
}

.screen--start .scenery__deko {
  transform: translate(calc(var(--px, 0) * 16px), calc(var(--py, 0) * 6px));
}

/* Eine Einstellungszeile, deren Bedienelement unter die Beschriftung rutscht.
   Gebraucht fuer das Eingabefeld des Uebertragungscodes: Feld und Knopf
   nebeneinander lassen fuer den Text nur eine sehr schmale Spalte uebrig. */
.setting-row--breit {
  flex-wrap: wrap;
  gap: 8px;
}

.setting-row--breit .setting-row__label {
  flex: 1 1 100%;
}

.setting-row--breit .eingabe-gruppe {
  flex: 1 1 100%;
}

/* =========================================================================
   Boss-Kräfte im Figur-Bildschirm
   ========================================================================= */
.kraft-item {
  position: relative;
  font: inherit;
  color: var(--text);
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  text-align: left;
  cursor: pointer;
  border-radius: var(--radius-sm);
  border: 2px solid var(--panel-border);
  background: linear-gradient(180deg, #2a3a72 0%, var(--panel-solid) 60%, #18224e 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 3px 0 rgba(8, 14, 40, 0.3);
}

.kraft-item + .kraft-item {
  margin-top: 8px;
}

.kraft-item:not(:disabled):active {
  transform: translateY(2px);
}

/* Die getragene Kraft: goldener Rand und Schein. */
.kraft-item.is-active {
  border-color: var(--gold-2);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 0 14px rgba(255, 197, 61, 0.35);
}

/* Noch nicht freigeschaltet: gedämpft. */
.kraft-item.is-locked {
  cursor: not-allowed;
  filter: grayscale(0.6) brightness(0.8);
}

.kraft-item__icon {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  font-size: 1.5rem;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #445bb0, #182048 75%);
  border: 2px solid rgba(255, 197, 61, 0.45);
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
}

.kraft-item__body {
  flex: 1;
  min-width: 0;
  display: grid;
  gap: 2px;
}

.kraft-item__name {
  font-size: 0.92rem;
  font-weight: 600;
}

.kraft-item__text {
  font-size: 0.74rem;
  color: var(--text-dim);
  line-height: 1.3;
}

.kraft-item__stand {
  flex: 0 0 auto;
  align-self: center;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--gold-1);
}

.kraft-item.is-active .kraft-item__stand {
  color: var(--gold-1);
}

/* Kleiner Chip für die Gegner-Variante (Flink/Panzer/Wütend) */
.map__variante,
.fighter-bar__variante {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--text-dark);
  background: linear-gradient(180deg, var(--gold-1), var(--gold-2));
  vertical-align: middle;
}

.fighter-bar__variante {
  margin-left: 6px;
}

/* ===== css/erlebnis.css ===== */
/* =========================================================================
   MonsterQuest · erlebnis.css
   Alles, was den Kampf und die Menüs lebendiger macht:
     1. Pause und Ergebnisfenster (Banner, Porträt, Kampfstatistik)
     2. Kampf-Intro, Auftritte und eigene Bewegungen der Gegner
     3. Karten: Rahmen, Ziehen, Ausspielen, Kamera
     4. Arena: Varianten, Tageszeit, Wetter, kleine Tiere
     5. Menüs: Weltkarten-Partikel, Silhouetten, Sortierleiste

   Reihenfolge der Dateien: base → scenery → ui → screens → erlebnis.
   Alle Bewegungen laufen über @keyframes oder transitions - dadurch
   schaltet "Animationen aus" (body.no-animations, siehe base.css) sie
   automatisch mit ab.
   ========================================================================= */

/* =========================================================================
   1. Pause und Ergebnisfenster
   ========================================================================= */

/* Rechte Seite der Kopfzeile: hier sitzt der Pause-Knopf. */
.topbar__spacer--knopf {
  display: flex;
  justify-content: flex-end;
}

.pause-knopf {
  min-width: 44px;
  min-height: 40px;
  white-space: nowrap;
}

.pause-knopf:disabled {
  opacity: 0.45;
}

/* Während der Pause friert ALLES im Kampf ein - Wippen, Wetter, Wolken.
   Nur das Pausenfenster selbst bewegt sich noch. */
.screen--battle.ist-pausiert *,
.screen--battle.ist-pausiert *::before,
.screen--battle.ist-pausiert *::after {
  animation-play-state: paused !important;
}

.screen--battle.ist-pausiert .overlay--pause,
.screen--battle.ist-pausiert .overlay--pause * {
  animation-play-state: running !important;
}

/* Lange Ergebnisfenster (viel Beute, neue Welt, Erfolge) bleiben auf
   kleinen Handys scrollbar statt unten abgeschnitten. */
.overlay--ergebnis .overlay__box {
  max-height: calc(100dvh - 48px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* Niederlage: dunkler und kühler, aber freundlich - kein Rot. */
.overlay--niederlage {
  background: rgba(6, 8, 22, 0.72);
}

.overlay--niederlage .overlay__box {
  border-color: #6d7fc9;
  background: linear-gradient(180deg, #2a3466 0%, #1a2048 55%, #10142e 100%);
  box-shadow: var(--shadow-panel), 0 0 26px rgba(109, 127, 201, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

/* ---------- Kopf mit Banner ---------- */
.ergebnis-kopf {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 2px;
  width: 100%;
}

.ergebnis-kopf__icon {
  animation: ergebnis-icon 0.7s cubic-bezier(0.2, 1.5, 0.4, 1) both;
}

@keyframes ergebnis-icon {
  from { transform: scale(0.2) rotate(-25deg); opacity: 0; }
  to   { transform: scale(1) rotate(0); opacity: 1; }
}

/* Das Banner: ein Band mit eingeschnittenen Enden, wie bei einer Medaille. */
.ergebnis-banner {
  position: relative;
  min-width: 70%;
  padding: 6px 30px 8px;
  font-size: 1.7rem;
  letter-spacing: 0.04em;
  color: #fff;
  background: linear-gradient(180deg, #ffd55a 0%, #ffad1f 55%, #d27a08 100%);
  clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%);
  text-shadow: 0 2px 0 rgba(120, 60, 0, 0.6);
  animation: banner-ausrollen 0.45s 0.15s cubic-bezier(0.3, 1.4, 0.5, 1) both;
}

.ergebnis-kopf--niederlage .ergebnis-banner {
  background: linear-gradient(180deg, #8ea0e6 0%, #5f72c4 55%, #3f4f98 100%);
  text-shadow: 0 2px 0 rgba(20, 28, 70, 0.6);
}

@keyframes banner-ausrollen {
  from { transform: scaleX(0.1); opacity: 0; }
  to   { transform: scaleX(1); opacity: 1; }
}

/* Drei Funkelsterne um den Pokal. */
.ergebnis-kopf__stern {
  position: absolute;
  color: var(--gold-1);
  font-size: 1.1rem;
  text-shadow: 0 0 8px rgba(255, 220, 120, 0.9);
  animation: stern-funkeln 1.6s ease-in-out infinite;
}

.ergebnis-kopf__stern--1 { top: 2px; left: 26%; }
.ergebnis-kopf__stern--2 { top: 18px; right: 24%; animation-delay: 0.5s; font-size: 0.85rem; }
.ergebnis-kopf__stern--3 { top: -6px; right: 34%; animation-delay: 1s; font-size: 0.7rem; }

@keyframes stern-funkeln {
  0%, 100% { transform: scale(0.6) rotate(0); opacity: 0.4; }
  50%      { transform: scale(1.2) rotate(45deg); opacity: 1; }
}

/* ---------- Porträt des Gegners ---------- */
.ergebnis-portrait {
  position: relative;
  width: 84px;
  height: 84px;
  display: grid;
  place-items: end center;
}

.ergebnis-portrait .pixel-sprite {
  position: relative;
  transform: scaleX(-1);
}

.ergebnis-portrait__strahlen {
  position: absolute;
  inset: -14px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 230, 150, 0.4) 0%, rgba(255, 230, 150, 0) 68%);
}

/* Besiegt: kippt um, wird blass, Sternchen kreisen über dem Kopf. */
.ergebnis-portrait.ist-besiegt .pixel-sprite {
  filter: grayscale(0.5) brightness(0.9);
  animation: besiegt-kippen 0.8s 0.3s ease-out both;
}

.ergebnis-portrait.ist-besiegt::after {
  content: '💫';
  position: absolute;
  top: -4px;
  left: 50%;
  font-size: 1.2rem;
  animation: schwindel 1.4s linear infinite;
}

@keyframes besiegt-kippen {
  from { transform: scaleX(-1) rotate(0); }
  to   { transform: scaleX(-1) rotate(-12deg) translateY(4px); }
}

@keyframes schwindel {
  from { transform: translateX(-50%) rotate(0); }
  to   { transform: translateX(-50%) rotate(360deg); }
}

/* Bei einer Niederlage hüpft der Gegner vergnügt. */
.ergebnis-portrait.ist-froh .ergebnis-portrait__strahlen {
  background: radial-gradient(circle, rgba(140, 160, 255, 0.35) 0%, rgba(140, 160, 255, 0) 68%);
}

.ergebnis-portrait.ist-froh .pixel-sprite {
  animation: froh-huepfen 0.9s ease-in-out infinite;
}

@keyframes froh-huepfen {
  0%, 100% { transform: scaleX(-1) translateY(0); }
  50%      { transform: scaleX(-1) translateY(-7px); }
}

/* ---------- Kampfstatistik ---------- */
.kampf-statistik {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  width: 100%;
}

.kampf-statistik__feld {
  display: grid;
  justify-items: center;
  gap: 1px;
  padding: 6px 2px;
  border-radius: 10px;
  background: rgba(8, 14, 40, 0.35);
  border: 1px solid rgba(109, 146, 255, 0.35);
  animation: pop-in 0.3s ease-out both;
}

.kampf-statistik__feld:nth-child(2) { animation-delay: 0.08s; }
.kampf-statistik__feld:nth-child(3) { animation-delay: 0.16s; }
.kampf-statistik__feld:nth-child(4) { animation-delay: 0.24s; }

.kampf-statistik__icon {
  font-size: 1rem;
  line-height: 1.1;
}

.kampf-statistik__feld strong {
  font-size: 0.95rem;
  line-height: 1.1;
}

.kampf-statistik__feld small {
  font-size: 0.6rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

@media (max-width: 340px) {
  .kampf-statistik {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* =========================================================================
   2. Kampf-Intro, Auftritte und eigene Bewegungen der Gegner
   ========================================================================= */

/* Der Schleier über dem Kampf, solange das Intro läuft. Er fängt alle
   Tipps ab (ein Tipp überspringt das Intro), damit nichts doppelt startet. */
.kampf-intro {
  /* !important: base.css macht alle direkten Kinder eines Bildschirms
     relativ - der Schleier muss aber über allem schweben. */
  position: absolute !important;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at 50% 45%, rgba(8, 12, 30, 0) 30%, rgba(8, 12, 30, 0.55) 100%);
  animation: intro-schleier 1.5s ease-in-out forwards;
}

.kampf-intro--boss {
  background: radial-gradient(ellipse at 60% 40%, rgba(30, 6, 24, 0.15) 20%, rgba(14, 4, 20, 0.82) 100%);
  animation: intro-schleier-boss 2.9s ease-in-out forwards;
}

@keyframes intro-schleier {
  0%   { opacity: 0; }
  12%  { opacity: 1; }
  78%  { opacity: 1; }
  100% { opacity: 0; }
}

@keyframes intro-schleier-boss {
  0%   { opacity: 0; }
  10%  { opacity: 1; }
  82%  { opacity: 1; }
  100% { opacity: 0; }
}

/* Das Namensband - erst unsichtbar, dann rauscht es von links herein. */
.kampf-intro__banner {
  display: grid;
  justify-items: center;
  gap: 2px;
  padding: 10px 34px 12px;
  margin-top: -18vh;
  color: #fff;
  text-align: center;
  background: linear-gradient(90deg, rgba(27, 42, 99, 0) 0%, rgba(27, 42, 99, 0.94) 16%, rgba(27, 42, 99, 0.94) 84%, rgba(27, 42, 99, 0) 100%);
  border-top: 2px solid rgba(255, 197, 61, 0.7);
  border-bottom: 2px solid rgba(255, 197, 61, 0.7);
  opacity: 0;
  transform: translateX(-40px);
}

.zeige-banner .kampf-intro__banner {
  animation: intro-banner 0.4s cubic-bezier(0.2, 1.3, 0.5, 1) forwards;
}

@keyframes intro-banner {
  from { opacity: 0; transform: translateX(-40px) skewX(-8deg); }
  to   { opacity: 1; transform: translateX(0) skewX(0); }
}

.kampf-intro__oben {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-1);
}

.kampf-intro__name {
  font-size: 1.6rem;
  font-weight: 700;
  text-shadow: 0 2px 0 rgba(8, 14, 40, 0.7);
}

/* Boss: rot-goldenes Band, größere Schrift. */
.kampf-intro__banner--boss {
  margin-top: 26vh;
  background: linear-gradient(90deg, rgba(120, 20, 40, 0) 0%, rgba(120, 20, 40, 0.95) 14%, rgba(160, 40, 30, 0.95) 50%, rgba(120, 20, 40, 0.95) 86%, rgba(120, 20, 40, 0) 100%);
  border-color: var(--gold-2);
}

.kampf-intro__banner--boss .kampf-intro__oben {
  font-size: 1rem;
  letter-spacing: 0.3em;
}

.kampf-intro__banner--boss .kampf-intro__name {
  font-size: 2rem;
}

/* Die Krone fällt von oben und bleibt kurz glänzend stehen. */
.kampf-intro__krone {
  position: absolute;
  top: 18%;
  left: 50%;
  font-size: 3.4rem;
  filter: drop-shadow(0 0 14px rgba(255, 200, 80, 0.9));
  animation: krone-fallen 1.1s 0.2s cubic-bezier(0.3, 1.5, 0.5, 1) both, krone-weg 0.4s 1.3s ease-in forwards;
}

@keyframes krone-fallen {
  from { transform: translate(-50%, -120px) rotate(-30deg) scale(0.5); opacity: 0; }
  to   { transform: translate(-50%, 0) rotate(0) scale(1); opacity: 1; }
}

@keyframes krone-weg {
  to { transform: translate(-50%, -20px) scale(1.4); opacity: 0; }
}

.kampf-intro__tipp {
  position: absolute;
  bottom: calc(18px + env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.6);
}

/* Optischer Zoom auf den Boss während des Intros. Nur die Kampffläche
   bewegt sich - Leisten und Karten bleiben stehen. */
.battlefield {
  transition: transform 0.7s cubic-bezier(0.3, 0.8, 0.3, 1);
}

.battlefield.kamera-intro-zoom {
  transform: scale(1.22) translate(-8%, 6%);
}

/* Bis zum Auftritt: nur die dunkle Silhouette. */
.sprite.ist-silhouette {
  filter: brightness(0) drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
  opacity: 0.85;
}

/* ---------- Die fünf Auftritte ---------- */
.auftritt--busch   { animation: auftritt-busch 0.75s cubic-bezier(0.3, 1.4, 0.5, 1) both; }
.auftritt--rollen  { animation: auftritt-rollen 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.1) both; }
.auftritt--landen  { animation: auftritt-landen 0.6s cubic-bezier(0.5, 0, 0.8, 0.6) both; }
.auftritt--stein   { animation: auftritt-stein 0.8s ease-out both; }
.auftritt--gleiten { animation: auftritt-gleiten 0.85s cubic-bezier(0.2, 0.8, 0.3, 1) both; }

@keyframes auftritt-busch {
  0%   { transform: translateY(40%) scale(0.6); opacity: 0; }
  45%  { transform: translateY(-30%) scale(1.05); opacity: 1; }
  70%  { transform: translateY(0) scale(1.08, 0.9); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes auftritt-rollen {
  0%   { transform: translateX(160%) rotate(360deg); opacity: 0; }
  20%  { opacity: 1; }
  85%  { transform: translateX(-6%) rotate(-8deg); }
  100% { transform: translateX(0) rotate(0); }
}

@keyframes auftritt-landen {
  0%   { transform: translateY(-260%); opacity: 0; }
  20%  { opacity: 1; }
  80%  { transform: translateY(0) scale(1.1, 0.86); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes auftritt-stein {
  0%   { transform: translateX(-50%) translateY(18%) rotate(-18deg); opacity: 0; }
  35%  { transform: translateX(-38%) translateY(10%) rotate(-12deg); opacity: 1; }
  55%  { transform: translateX(-38%) translateY(10%) rotate(-12deg); }
  100% { transform: translateX(0) translateY(0) rotate(0); }
}

@keyframes auftritt-gleiten {
  0%   { transform: translate(70%, -24%); opacity: 0; }
  100% { transform: translate(0, 0); opacity: 1; }
}

/* Busch bzw. Stein, aus dem/hinter dem der Gegner kommt. Sie nehmen die
   Farben der Welt an und verschwinden nach dem Auftritt. */
.auftritt-requisite {
  position: absolute;
  z-index: 2;
  bottom: 4px;
  pointer-events: none;
  transition: opacity 0.4s 0.3s ease, transform 0.4s 0.3s ease;
}

.auftritt-requisite--busch {
  left: 50%;
  width: 92px;
  height: 46px;
  margin-left: -46px;
  border-radius: 46px 46px 10px 10px;
  background:
    radial-gradient(circle at 26% 42%, var(--s-grass-light) 0 20%, transparent 21%),
    radial-gradient(circle at 70% 36%, var(--s-grass-light) 0 16%, transparent 17%),
    linear-gradient(180deg, var(--s-grass) 0%, var(--s-grass-dark) 100%);
  box-shadow: inset 0 -6px 0 rgba(0, 0, 0, 0.15);
}

.auftritt-requisite--stein {
  left: 6%;
  width: 70px;
  height: 52px;
  border-radius: 48% 52% 20% 26% / 64% 60% 18% 20%;
  background: linear-gradient(160deg, var(--s-rock) 0%, var(--s-rock-dark) 100%);
  box-shadow: inset -6px -6px 0 rgba(0, 0, 0, 0.15), inset 5px 5px 0 rgba(255, 255, 255, 0.15);
}

.auftritt-requisite--busch.ist-weg {
  animation: busch-raschelt 0.5s ease-in-out;
  opacity: 0;
  transform: scale(0.7) translateY(10px);
}

.auftritt-requisite--stein.ist-weg {
  opacity: 0;
  transform: translateX(-20px);
}

@keyframes busch-raschelt {
  0%, 100% { rotate: 0deg; }
  30% { rotate: -6deg; }
  60% { rotate: 5deg; }
}

/* Der Boss landet: Staubring auf dem Boden. */
.stage.ist-gelandet::after {
  content: '';
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 160px;
  height: 30px;
  margin-left: -80px;
  border-radius: 50%;
  border: 4px solid rgba(255, 240, 210, 0.75);
  animation: staubring 0.7s 0.45s ease-out both;
  pointer-events: none;
}

@keyframes staubring {
  from { transform: scale(0.3); opacity: 1; }
  to   { transform: scale(1.6); opacity: 0; }
}

/* ---------- Eigene Bewegung im Kampf ----------
   Liegt auf einer eigenen Hülle um die Figur (.sprite__koerper). So kommen
   sich die Dauerbewegung und die kurzen Treffer-/Angriffsbewegungen am
   Kasten (.hit, .lunge-left) nicht in die Quere. */
.sprite__koerper {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: end center;
  transform-origin: 50% 100%;
}

.ruhe--wabbeln     { animation: ruhe-wabbeln 1.8s ease-in-out infinite; }
.ruhe--stampfen    { animation: ruhe-stampfen 3.2s ease-in-out infinite; }
.ruhe--flattern    { animation: ruhe-flattern 0.9s ease-in-out infinite; }
.ruhe--atmen       { animation: ruhe-atmen 2.6s ease-in-out infinite; }
.ruhe--schlaengeln { animation: ruhe-schlaengeln 2.2s ease-in-out infinite; }
.ruhe--wackeln     { animation: ruhe-wackeln 1.4s ease-in-out infinite; }
.ruhe--schweben    { animation: ruhe-schweben 3.4s ease-in-out infinite; }

@keyframes ruhe-wabbeln {
  0%, 100% { transform: scale(1, 1); }
  50%      { transform: scale(1.06, 0.94); }
}

@keyframes ruhe-stampfen {
  0%, 60%, 100% { transform: translateY(0) rotate(0); }
  70% { transform: translateY(-9%) rotate(-3deg); }
  78% { transform: translateY(0) scale(1.05, 0.95); }
  86% { transform: translateY(-6%) rotate(3deg); }
  94% { transform: translateY(0) scale(1.04, 0.96); }
}

@keyframes ruhe-flattern {
  0%, 100% { transform: translateY(-4%) scaleY(1); }
  50%      { transform: translateY(-11%) scaleY(0.96); }
}

@keyframes ruhe-atmen {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.035, 1.05); }
}

@keyframes ruhe-schlaengeln {
  0%, 100% { transform: skewX(0); }
  25%      { transform: skewX(5deg); }
  75%      { transform: skewX(-5deg); }
}

@keyframes ruhe-wackeln {
  0%, 100% { transform: rotate(0); }
  25%      { transform: rotate(-4deg); }
  75%      { transform: rotate(4deg); }
}

@keyframes ruhe-schweben {
  0%, 100% { transform: translateY(-6%); opacity: 1; }
  50%      { transform: translateY(-14%); opacity: 0.82; }
}

/* Der Boss atmet sichtbar Glut: ein pulsierender Schein hinter ihm. */
.sprite--boss .sprite__koerper::before {
  content: '';
  position: absolute;
  inset: 12% 8% 4%;
  z-index: -1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 170, 60, 0.45) 0%, rgba(255, 90, 40, 0) 70%);
  animation: boss-glut 2.4s ease-in-out infinite;
}

@keyframes boss-glut {
  0%, 100% { opacity: 0.5; transform: scale(0.9); }
  50%      { opacity: 1; transform: scale(1.08); }
}

/* ---------- Kamera bei starken Treffern ----------
   Kurzer Zoom und Ruck in Richtung des Getroffenen - nur die Kampffläche,
   die Kartenhand bleibt ruhig. */
.battlefield.kamera-stoss-rechts { animation: kamera-stoss-rechts 0.45s ease-out; }
.battlefield.kamera-stoss-links  { animation: kamera-stoss-links 0.45s ease-out; }

@keyframes kamera-stoss-rechts {
  0%   { transform: scale(1) translate(0, 0); }
  30%  { transform: scale(1.06) translate(2.5%, -1%); }
  100% { transform: scale(1) translate(0, 0); }
}

@keyframes kamera-stoss-links {
  0%   { transform: scale(1) translate(0, 0); }
  30%  { transform: scale(1.06) translate(-2.5%, 1%); }
  100% { transform: scale(1) translate(0, 0); }
}

/* =========================================================================
   3. Karten: Rahmen, Ziehen, Ausspielen
   ========================================================================= */

/* Ein zweiter, innerer Rahmen zeigt die Seltenheit. Der äußere Rand bleibt
   frei für "spielbar" (gold leuchtend) - so beißen sich beide nie. */
.card {
  --rahmen: rgba(140, 160, 220, 0.35);
  border-radius: 14px;
}

.card::after {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 10px;
  border: 1.5px solid var(--rahmen);
  pointer-events: none;
}

.card--silber {
  --rahmen: #d9e2f2;
  background: linear-gradient(180deg, #3d4f86 0%, #24305e 50%, #161f48 100%);
}

.card--gold {
  --rahmen: #ffcf5a;
  background: linear-gradient(180deg, #4a4580 0%, #2a2c62 50%, #1a1b47 100%);
}

.card--glitzer {
  --rahmen: #ffe6a0;
  background: linear-gradient(180deg, #5a3f8f 0%, #33276b 50%, #1d1747 100%);
}

/* Glitzer: Ein Lichtschein wandert langsam über den inneren Rahmen. */
.card--glitzer::after {
  border: 2px solid transparent;
  background: linear-gradient(115deg, #ffd36b, #ff8ad8, #8fd0ff, #b9ff9a, #ffd36b) border-box;
  background-size: 300% 100%;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) padding-box exclude, linear-gradient(#000 0 0);
  animation: glitzer-rahmen 4s linear infinite;
}

@keyframes glitzer-rahmen {
  from { background-position: 0% 50%; }
  to   { background-position: 300% 50%; }
}

/* Das Symbol bekommt einen weichen Lichthof in der Rahmenfarbe. */
.card__icon {
  filter: drop-shadow(0 2px 3px rgba(8, 14, 40, 0.6));
}

.card--gold .card__icon,
.card--glitzer .card__icon {
  filter: drop-shadow(0 0 6px rgba(255, 210, 110, 0.6)) drop-shadow(0 2px 3px rgba(8, 14, 40, 0.6));
}

.card__name {
  line-height: 1.15;
  text-shadow: 0 1px 0 rgba(8, 14, 40, 0.7);
}

/* Spielbare Karte: leicht angehoben. */
.card.is-ready {
  transform: translateY(-2px);
}

.card.is-ready:active {
  transform: translateY(3px) scale(0.96);
}

/* Neue Karte: kommt vom Stapel (unten rechts), dreht sich ein und landet. */
.card.karte-gezogen {
  animation: karte-gezogen 0.42s cubic-bezier(0.25, 1.3, 0.5, 1) both;
}

@keyframes karte-gezogen {
  0%   { transform: translate(40%, 70%) scale(0.45) rotate(14deg); opacity: 0; }
  60%  { transform: translate(0, -6%) scale(1.04) rotate(-2deg); opacity: 1; }
  100% { transform: translate(0, 0) scale(1) rotate(0); }
}

/* Ausgespielt: hebt sich kurz, schnellt nach vorn und verblasst. */
@keyframes karte-flieg {
  0%   { transform: translateY(0) scale(1) rotate(0); opacity: 1; }
  30%  { transform: translateY(-16px) scale(1.1) rotate(-2deg); opacity: 1; }
  100% { transform: translateY(-110px) scale(0.6) rotate(-6deg); opacity: 0; }
}

.karte-flieg {
  animation: karte-flieg 0.42s cubic-bezier(0.3, 0, 0.6, 1) forwards;
}

/* Etwas mehr Luft zwischen den Karten - weniger Fehltipps. */
.screen--battle .hand {
  gap: 10px;
}

/* =========================================================================
   4. Arena: Varianten, Tageszeit, Wetter, Tiere
   ========================================================================= */

/* Leisten oben liegen über der Wetter-Ebene, die Karten unten sowieso
   (sie stehen im Aufbau danach). */
.screen--battle .topbar,
.screen--battle .fighter-bar {
  z-index: 2;
}

/* ---------- Tiefe: die hinteren Ebenen treiben sacht ---------- */
.screen--battle .arena__hills {
  animation: tiefe-treiben 22s ease-in-out infinite alternate;
}

.screen--battle .arena__treeline--fern {
  animation: tiefe-treiben-mehr 16s ease-in-out infinite alternate;
}

@keyframes tiefe-treiben {
  from { translate: -1.5% 0; }
  to   { translate: 1.5% 0; }
}

@keyframes tiefe-treiben-mehr {
  from { translate: -3% 0; }
  to   { translate: 3% 0; }
}

/* ---------- Varianten-Bausteine ---------- */
.umgebung-variante {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.umgebung-variante > * {
  position: absolute;
  transform: translate(-50%, -100%) scale(var(--gr, 1));
  transform-origin: 50% 100%;
}

/* Bach (bzw. Lavastrom, Eisband ...) quer über die Wiese. */
.umgebung-bach {
  --bach: #6fc3ff;
  --bach-hell: #c9ecff;
  left: 50%;
  top: 66%;
  width: 150%;
  height: 9%;
  border-radius: 50%;
  background: linear-gradient(180deg, var(--bach-hell) 0%, var(--bach) 45%, var(--bach) 100%);
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.18), inset 0 -6px 8px rgba(0, 0, 0, 0.22);
  transform: translate(-50%, -50%) rotate(-4deg);
  overflow: hidden;
}

.umgebung-bach__glanz {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 30px, rgba(255, 255, 255, 0.45) 30px 44px, rgba(255, 255, 255, 0) 44px 90px);
  animation: bach-fliessen 3s linear infinite;
}

@keyframes bach-fliessen {
  from { transform: translateX(0); }
  to   { transform: translateX(90px); }
}

.region--vulkan .umgebung-bach { --bach: #ff6a1f; --bach-hell: #ffd36b; box-shadow: 0 0 18px rgba(255, 110, 40, 0.75); }
.region--eis .umgebung-bach { --bach: #a9dcf5; --bach-hell: #f4fbff; }
.region--eis .umgebung-bach__glanz { animation: none; }
.region--schatten .umgebung-bach { --bach: #5b4a9a; --bach-hell: #9d8fe0; }
.region--kristall .umgebung-bach { --bach: #59d8f0; --bach-hell: #d9fbff; box-shadow: 0 0 14px rgba(110, 230, 255, 0.6); }
.region--wueste .umgebung-bach { --bach: #2fbfb0; --bach-hell: #b8fff3; }

.umgebung-kiesel {
  width: 16px;
  height: 9px;
  border-radius: 50% 50% 40% 40%;
  background: linear-gradient(180deg, var(--s-rock) 0 55%, var(--s-rock-dark) 56%);
}

/* Lichtung: weiche Strahlen von oben. */
.umgebung-lichtstrahlen {
  left: 50%;
  top: 70%;
  width: 90%;
  height: 120%;
  transform: translate(-50%, -100%);
  background: repeating-linear-gradient(100deg, rgba(255, 250, 220, 0) 0 26px, rgba(255, 250, 220, 0.2) 26px 40px, rgba(255, 250, 220, 0) 40px 70px);
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 90%);
  mask-image: linear-gradient(180deg, #000 0%, transparent 90%);
  animation: strahlen-atmen 6s ease-in-out infinite;
}

@keyframes strahlen-atmen {
  0%, 100% { opacity: 0.55; }
  50%      { opacity: 1; }
}

.umgebung-stumpf {
  width: 30px;
  height: 22px;
  border-radius: 4px 4px 3px 3px;
  background: linear-gradient(90deg, #8a6340 0%, #6b4a2f 55%, #4e3521 100%);
  box-shadow: inset 0 5px 0 #c99e6c;
}

.umgebung-stein {
  width: 40px;
  height: 26px;
  border-radius: 48% 52% 20% 26% / 64% 60% 18% 20%;
  background: linear-gradient(160deg, var(--s-rock) 0%, var(--s-rock-dark) 100%);
  box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.15);
}

/* Wiese: Holzzaun am Horizont, Büsche, Blumen. */
.umgebung-zaun {
  left: 18%;
  top: 54%;
  width: 34%;
  height: 20px;
  background:
    linear-gradient(180deg, transparent 0 25%, #9b6d43 25% 38%, transparent 38% 62%, #9b6d43 62% 75%, transparent 75%),
    repeating-linear-gradient(90deg, #7a5432 0 5px, transparent 5px 26px);
  opacity: 0.85;
}

.umgebung-busch {
  width: 58px;
  height: 32px;
  border-radius: 32px 32px 8px 8px;
  background:
    radial-gradient(circle at 28% 38%, var(--s-grass-light) 0 18%, transparent 19%),
    radial-gradient(circle at 68% 30%, var(--s-grass-light) 0 14%, transparent 15%),
    linear-gradient(180deg, var(--s-grass) 0%, var(--s-grass-dark) 100%);
  box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.14);
}

.umgebung-blume {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffe27a 0 30%, var(--farbe, #ffb3d9) 32%);
  box-shadow: 0 7px 0 -3px var(--s-grass-dark);
}

.region--vulkan .umgebung-blume,
.region--schatten .umgebung-blume,
.region--eis .umgebung-blume {
  display: none;
}

/* ---------- Die Umgebung reagiert auf Treffer ---------- */
.umgebung-wackelt .arena__tree-top,
.umgebung-wackelt .umgebung-busch,
.umgebung-wackelt .umgebung-blume,
.umgebung-wackelt .arena__flower {
  animation: umgebung-wackeln 0.5s ease-in-out;
}

.umgebung-wackelt--stark .arena__tree-top,
.umgebung-wackelt--stark .umgebung-busch,
.umgebung-wackelt--stark .umgebung-blume,
.umgebung-wackelt--stark .umgebung-kiesel,
.umgebung-wackelt--stark .umgebung-stein,
.umgebung-wackelt--stark .arena__flower {
  animation: umgebung-wackeln-stark 0.65s ease-in-out;
}

@keyframes umgebung-wackeln {
  0%, 100% { rotate: 0deg; }
  30%      { rotate: -4deg; }
  65%      { rotate: 3deg; }
}

@keyframes umgebung-wackeln-stark {
  0%, 100% { rotate: 0deg; translate: 0 0; }
  20%      { rotate: -8deg; translate: 0 -2px; }
  50%      { rotate: 6deg; }
  75%      { rotate: -3deg; }
}

/* ---------- Licht und Wetter (Ebene über Himmel und Arena) ---------- */
.umgebung-himmel {
  position: absolute !important;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}

.umgebung-licht,
.umgebung-wetter {
  position: absolute;
  inset: 0;
}

/* Tageszeit nach der Uhr: morgens warm-rosa, abends lila Dämmerung. */
.tageszeit--morgen .umgebung-licht {
  background: linear-gradient(180deg, rgba(255, 168, 130, 0.26) 0%, rgba(255, 215, 160, 0.1) 55%, rgba(255, 230, 190, 0.06) 100%);
}

.tageszeit--abend .umgebung-licht {
  background: linear-gradient(180deg, rgba(60, 30, 130, 0.42) 0%, rgba(240, 110, 80, 0.2) 50%, rgba(40, 20, 90, 0.26) 100%);
}

.tageszeit--morgen .scenery__sun {
  top: 6%;
  right: auto;
  left: -80px;
  background: radial-gradient(circle, rgba(255, 228, 200, 0.95) 0%, rgba(255, 170, 140, 0.5) 38%, rgba(255, 170, 140, 0) 70%);
}

.tageszeit--abend .scenery__sun {
  top: 22%;
  right: -40px;
  background: radial-gradient(circle, rgba(255, 190, 120, 0.95) 0%, rgba(255, 110, 80, 0.55) 38%, rgba(255, 110, 80, 0) 70%);
}

.tageszeit--abend .scenery__strahlen {
  opacity: 0.12;
}

/* Abends funkeln zwei Sterne kurz auf. */
.umgebung-stern {
  position: absolute;
  top: 9%;
  left: 22%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
  animation: stern-blinken 5s ease-in-out infinite;
}

.umgebung-stern--2 {
  top: 15%;
  left: 64%;
  animation-delay: 2.3s;
}

@keyframes stern-blinken {
  0%, 70%, 100% { opacity: 0.15; transform: scale(0.6); }
  80%           { opacity: 1; transform: scale(1.4); }
}

/* Bewölkt: grauerer Himmel. */
.wetter--bewoelkt .umgebung-wetter {
  background: linear-gradient(180deg, rgba(90, 100, 130, 0.32) 0%, rgba(90, 100, 130, 0.08) 60%);
}

.wetter--bewoelkt .scenery__sun,
.wetter--regen .scenery__sun,
.wetter--nebel .scenery__sun {
  opacity: 0.35;
}

/* Regen: zwei Schichten schräger Striche in unterschiedlichem Tempo. */
.wetter--regen .umgebung-wetter {
  background: rgba(70, 85, 120, 0.2);
}

.wetter--regen .umgebung-wetter::before,
.wetter--regen .umgebung-wetter::after,
.wetter--schnee .umgebung-wetter::before,
.wetter--schnee .umgebung-wetter::after {
  content: '';
  position: absolute;
  left: -20%;
  right: -20%;
  top: -100%;
  height: 200%;
}

.wetter--regen .umgebung-wetter::before {
  background: repeating-linear-gradient(104deg, transparent 0 22px, rgba(210, 228, 255, 0.45) 22px 23.5px, transparent 23.5px 47px);
  animation: wetter-fallen 0.8s linear infinite;
}

.wetter--regen .umgebung-wetter::after {
  background: repeating-linear-gradient(104deg, transparent 0 37px, rgba(210, 228, 255, 0.3) 37px 38px, transparent 38px 71px);
  animation: wetter-fallen 1.2s linear infinite;
}

/* Schnee: weiche Flocken aus zwei Punktmustern. */
.wetter--schnee .umgebung-wetter::before {
  background-image: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0 2.5px, transparent 3px);
  background-size: 58px 64px;
  animation: wetter-fallen 7s linear infinite;
}

.wetter--schnee .umgebung-wetter::after {
  background-image: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0 1.6px, transparent 2px);
  background-size: 37px 41px;
  background-position: 13px 7px;
  animation: wetter-fallen 11s linear infinite;
}

@keyframes wetter-fallen {
  from { transform: translateY(0); }
  to   { transform: translateY(50%); }
}

/* Nebel: zwei Schwaden, die sacht hin und her ziehen. */
.wetter--nebel .umgebung-wetter::before,
.wetter--nebel .umgebung-wetter::after {
  content: '';
  position: absolute;
  left: -30%;
  right: -30%;
  height: 34%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 50%, rgba(235, 240, 255, 0.5) 0%, rgba(235, 240, 255, 0) 70%);
}

.wetter--nebel .umgebung-wetter::before {
  top: 36%;
  animation: nebel-ziehen 14s ease-in-out infinite alternate;
}

.wetter--nebel .umgebung-wetter::after {
  top: 56%;
  opacity: 0.8;
  animation: nebel-ziehen 19s ease-in-out infinite alternate-reverse;
}

@keyframes nebel-ziehen {
  from { transform: translateX(-12%); }
  to   { transform: translateX(12%); }
}

/* Sandwind: feine waagrechte Schlieren. */
.wetter--sand .umgebung-wetter {
  background: rgba(230, 190, 120, 0.12);
}

.wetter--sand .umgebung-wetter::before {
  content: '';
  position: absolute;
  inset: 20% -50% 10%;
  background: repeating-linear-gradient(178deg, transparent 0 16px, rgba(255, 230, 180, 0.35) 16px 17px, transparent 17px 41px);
  animation: sand-wehen 2.4s linear infinite;
}

@keyframes sand-wehen {
  from { transform: translateX(0); }
  to   { transform: translateX(33%); }
}

/* Kristallstaub: glitzernde Punkte, die aufleuchten. */
.wetter--glitzer .umgebung-wetter::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(200, 245, 255, 0.95) 0 1.5px, transparent 2.5px);
  background-size: 47px 53px;
  animation: glitzer-staub 3s ease-in-out infinite alternate;
}

@keyframes glitzer-staub {
  from { opacity: 0.2; }
  to   { opacity: 0.9; }
}

/* Glutfunken (Vulkan, und in jedem Bosskampf). */
.wetter--glut .umgebung-wetter {
  background: linear-gradient(180deg, rgba(120, 30, 20, 0.14) 0%, rgba(255, 110, 40, 0.1) 100%);
}

.umgebung-glut {
  position: absolute;
  bottom: -8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #ffd36b;
  box-shadow: 0 0 8px 2px rgba(255, 120, 40, 0.85);
  animation: glut-steigen 4s linear infinite;
}

@keyframes glut-steigen {
  0%   { transform: translate(0, 0) scale(1); opacity: 0; }
  10%  { opacity: 1; }
  100% { transform: translate(24px, -95vh) scale(0.3); opacity: 0; }
}

/* ---------- Bossarena ---------- */
.ist-bosskampf .umgebung-licht::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, 0) 40%, rgba(40, 6, 30, 0.45) 100%);
}

.umgebung-variante > .umgebung-boss-licht {
  position: absolute;
  top: -12%;
  left: auto;
  right: -14%;
  width: 82%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 190, 90, 0.16) 0deg 10deg, rgba(255, 190, 90, 0) 10deg 24deg);
  -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 68%);
  mask-image: radial-gradient(circle, #000 0%, transparent 68%);
  animation: boss-licht-drehen 30s linear infinite;
}

@keyframes boss-licht-drehen {
  to { transform: rotate(360deg); }
}

/* ---------- Tiere (antippbar, rein dekorativ) ---------- */
.umgebung-tier {
  position: absolute;
  z-index: 3;
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  animation: tier-flug 7s ease-in-out infinite;
}

.umgebung-tier__koerper {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 10px;
  margin: -5px 0 0 -2px;
  border-radius: 2px;
  background: #3a2a40;
}

/* Falter: zwei große Flügel (oben breit, unten schmal), die schlagen.
   Leicht schräg gestellt, damit er wie im Flug aussieht. */
.umgebung-tier--falter .umgebung-tier__koerper {
  width: 3px;
  height: 12px;
  margin: -6px 0 0 -1.5px;
  rotate: -18deg;
}

.umgebung-tier--falter .umgebung-tier__koerper::before,
.umgebung-tier--falter .umgebung-tier__koerper::after {
  content: '';
  position: absolute;
  top: -4px;
  width: 13px;
  height: 18px;
  background:
    radial-gradient(circle at 50% 30%, #ffffff 0 12%, transparent 13%),
    radial-gradient(ellipse at 50% 28%, #ffb3d9 0 52%, transparent 54%),
    radial-gradient(ellipse at 50% 78%, #ffd36b 0 38%, transparent 40%);
  filter: drop-shadow(0 1px 1px rgba(60, 20, 60, 0.45));
  animation: fluegel-schlag 0.28s ease-in-out infinite alternate;
}

.umgebung-tier--falter .umgebung-tier__koerper::before {
  right: 2px;
  transform-origin: 100% 50%;
}

.umgebung-tier--falter .umgebung-tier__koerper::after {
  left: 2px;
  transform-origin: 0% 50%;
}

.umgebung-tier--falter:nth-of-type(2n) .umgebung-tier__koerper::before,
.umgebung-tier--falter:nth-of-type(2n) .umgebung-tier__koerper::after {
  background:
    radial-gradient(circle at 50% 30%, #ffffff 0 12%, transparent 13%),
    radial-gradient(ellipse at 50% 28%, #9fd2ff 0 52%, transparent 54%),
    radial-gradient(ellipse at 50% 78%, #c9a8ff 0 38%, transparent 40%);
}

@keyframes fluegel-schlag {
  from { scale: 1 1; }
  to   { scale: 0.25 1; }
}

/* Glühwürmchen: ein leuchtender Punkt, der pulsiert. */
.umgebung-tier--gluehwurm .umgebung-tier__koerper {
  width: 6px;
  height: 6px;
  margin: -3px 0 0 -3px;
  border-radius: 50%;
  background: #eaffa0;
  box-shadow: 0 0 10px 4px rgba(210, 255, 120, 0.7);
  animation: gluehen 1.6s ease-in-out infinite alternate;
}

@keyframes gluehen {
  from { opacity: 0.35; }
  to   { opacity: 1; }
}

@keyframes tier-flug {
  0%, 100% { translate: 0 0; }
  25%      { translate: 14px -10px; }
  50%      { translate: 4px -20px; }
  75%      { translate: -12px -6px; }
}

.umgebung-tier.schreckt-auf {
  animation: tier-aufschrecken 0.7s ease-out;
}

@keyframes tier-aufschrecken {
  0%   { translate: 0 0; }
  40%  { translate: 10px -30px; }
  100% { translate: 0 0; }
}

/* Angetippt: davonflattern, später kommt es zurück. */
.umgebung-tier.fliegt-weg {
  pointer-events: none;
  animation: tier-davon 1.2s ease-in forwards;
}

@keyframes tier-davon {
  0%   { translate: 0 0; opacity: 1; }
  100% { translate: 120px -240px; opacity: 0; }
}

/* ---------- Vogel, der ab und zu durch den Himmel zieht ---------- */
.umgebung-vogel {
  position: absolute;
  top: 9%;
  left: -8%;
  width: 16px;
  height: 6px;
  animation: vogel-zug 16s linear infinite;
  animation-delay: 3s;
}

.umgebung-vogel::before,
.umgebung-vogel::after {
  content: '';
  position: absolute;
  top: 0;
  width: 9px;
  height: 6px;
  border-top: 2px solid rgba(30, 40, 70, 0.7);
  border-radius: 60% 60% 0 0;
  animation: vogel-schlag 0.4s ease-in-out infinite alternate;
}

.umgebung-vogel::before { left: 0; transform-origin: 100% 100%; }
.umgebung-vogel::after { right: 0; transform-origin: 0% 100%; }

@keyframes vogel-schlag {
  from { rotate: 12deg; }
  to   { rotate: -12deg; }
}

@keyframes vogel-zug {
  0%   { transform: translate(0, 0); opacity: 0; }
  4%   { opacity: 1; }
  45%  { transform: translate(60vw, 14px); opacity: 1; }
  50%  { transform: translate(66vw, 6px); opacity: 0; }
  100% { transform: translate(66vw, 6px); opacity: 0; }
}

/* ---------- Geheimnis: ein kleines Wesen am Horizont ---------- */
.umgebung-wicht {
  position: absolute;
  z-index: 1;
  left: 31%;
  top: 52%;
  width: 34px;
  height: 22px;
  margin: -22px 0 0 -17px;
  padding: 0;
  border: 0;
  background: none;
  overflow: hidden;
  cursor: pointer;
  pointer-events: none;
}

.umgebung-wicht::before {
  content: '';
  position: absolute;
  left: 7px;
  bottom: -22px;
  width: 20px;
  height: 20px;
  border-radius: 50% 50% 40% 40%;
  background: radial-gradient(circle at 40% 35%, #b28cff 0%, #6c4bc4 100%);
  transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
}

.umgebung-wicht__augen {
  position: absolute;
  left: 12px;
  bottom: -14px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 6px 0 0 #fff;
  transition: transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
}

.umgebung-wicht.ist-da {
  pointer-events: auto;
}

.umgebung-wicht.ist-da::before,
.umgebung-wicht.ist-da .umgebung-wicht__augen {
  transform: translateY(-17px);
}

.umgebung-wicht.huscht-weg::before {
  transition-duration: 0.12s;
}

.umgebung-wicht.huscht-weg::after {
  content: '✨';
  position: absolute;
  left: 8px;
  top: 0;
  font-size: 0.8rem;
  animation: float-up 0.6s ease-out forwards;
}

/* =========================================================================
   5. Menüs
   ========================================================================= */

/* ---------- Sortierleiste im Deckmenü ---------- */
.sortier-leiste {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}

@media (max-width: 420px) {
  .sortier-leiste {
    grid-template-columns: repeat(3, 1fr);
  }
}

.sortier-knopf {
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  min-height: 40px;
  padding: 6px 4px;
  color: var(--text-dim);
  border-radius: 999px;
  border: 2px solid var(--panel-border);
  background: linear-gradient(180deg, rgba(42, 58, 114, 0.94), rgba(17, 24, 58, 0.94));
  cursor: pointer;
  transition: transform 0.1s ease, border-color 0.15s ease;
}

.sortier-knopf:active {
  transform: scale(0.95);
}

.sortier-knopf.is-active {
  color: #fff;
  border-color: var(--gold-2);
  box-shadow: 0 0 10px rgba(255, 190, 60, 0.35);
}

.deck-list > * {
  animation: pop-in 0.22s ease-out both;
}

/* ---------- Lokale Sicherung in den Einstellungen ---------- */
.stat-row--sicherung {
  align-items: flex-start;
  gap: 10px;
}

.stat-row--sicherung .stat-row__label {
  display: grid;
  gap: 3px;
}

.stat-row--sicherung .stat-row__value {
  white-space: nowrap;
}

/* ---------- Bildschirmwechsel ----------
   Sanft einblenden, leicht anheben und aus 98,5 % aufziehen. Solange das
   läuft, nimmt der neue Bildschirm keine Tipps an (js/core/screens.js). */
@keyframes screen-rein {
  from { opacity: 0; transform: translateY(12px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.screen {
  animation: screen-rein 0.26s cubic-bezier(0.2, 0.8, 0.3, 1);
}

.screen.ist-im-uebergang {
  pointer-events: none;
}

/* ---------- Sammlung: Silhouetten und Weltfarben ---------- */
.collection-item {
  animation: pop-in 0.25s ease-out both;
}

.collection-item__sprite {
  background: radial-gradient(circle, color-mix(in srgb, var(--welt-farbe, #6d92ff) 55%, transparent), transparent 68%);
}

@supports not (background: color-mix(in srgb, red 50%, transparent)) {
  .collection-item__sprite {
    background: radial-gradient(circle, rgba(109, 146, 255, 0.34), transparent 68%);
  }
}

.pixel-sprite--silhouette {
  filter: brightness(0) drop-shadow(0 0 4px rgba(160, 190, 255, 0.45));
  opacity: 0.75;
}

/* Die Silhouette soll schwarz bleiben, nicht grau gefiltert werden. */
.collection-item.is-locked .collection-item__sprite:has(.pixel-sprite--silhouette) {
  filter: none;
}

/* ---------- Weltkarte: Ring in der Weltfarbe ---------- */
.screen--map .node__circle::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 3px solid var(--welt-farbe, transparent);
  opacity: 0.55;
  pointer-events: none;
}

.screen--map .node.is-locked .node__circle::before {
  opacity: 0.18;
  border-style: dashed;
}

.screen--map .node.is-selected .node__circle::before {
  opacity: 1;
  inset: -10px;
  box-shadow: 0 0 14px var(--welt-farbe, transparent);
}

/* ---------- Teilchen beim Betreten einer Welt ---------- */
.welt-teilchen {
  position: absolute !important;
  inset: 0;
  z-index: 4 !important;
  overflow: hidden;
  pointer-events: none;
}

.welt-teilchen__stueck {
  position: absolute;
  top: -20px;
  width: 12px;
  height: 8px;
  opacity: 0;
  animation: teilchen-fallen 1.6s ease-in forwards;
}

.welt-teilchen--steigen .welt-teilchen__stueck {
  top: auto;
  bottom: -20px;
  animation-name: teilchen-steigen;
}

@keyframes teilchen-fallen {
  0%   { transform: translate(0, 0) rotate(0); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: translate(var(--weg), 70vh) rotate(var(--dreh)); opacity: 0; }
}

@keyframes teilchen-steigen {
  0%   { transform: translate(0, 0) rotate(0); opacity: 0; }
  15%  { opacity: 1; }
  100% { transform: translate(var(--weg), -70vh) rotate(var(--dreh)); opacity: 0; }
}

.welt-teilchen--blatt .welt-teilchen__stueck { border-radius: 0 70% 0 70%; background: #6fc04a; }
.welt-teilchen--splitter .welt-teilchen__stueck { width: 8px; height: 12px; background: linear-gradient(160deg, #cdf3ff, #6fd0ff); clip-path: polygon(50% 0, 100% 40%, 70% 100%, 30% 100%, 0 40%); }
.welt-teilchen--glut .welt-teilchen__stueck { width: 6px; height: 6px; border-radius: 50%; background: #ffd36b; box-shadow: 0 0 8px 2px rgba(255, 110, 40, 0.8); }
.welt-teilchen--flocke .welt-teilchen__stueck { width: 8px; height: 8px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }
.welt-teilchen--schatten .welt-teilchen__stueck { width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle, #b28cff, rgba(80, 40, 140, 0)); }
